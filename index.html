var FOCUS_GROUPS = {
  'Cardio & core':['Core'],
  'Pull':['Back','Arms'], 'Push':['Chest','Shoulders','Arms'],
  'Legs — quad':['Legs'], 'Legs — hamstring/glute':['Glutes & hams'],
  'Full body':['Back','Chest','Legs']
};

function lastTrained(focus){
  var keys = Object.keys(state.sessions).filter(function(k){
    return (state.sessions[k].items||[]).length; }).sort().reverse();
  for(var i=0;i<keys.length;i++){ if(state.sessions[keys[i]].type === focus) return keys[i]; }
  return null;
}

function daysSince(k){
  if(!k) return 99;
  return Math.round((parseKey(todayKey()) - parseKey(k)) / 86400000);
}

function recentBack(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return state.sessions[k].back; }).sort().reverse();
  return keys.length ? state.sessions[keys[0]].back : '';
}

/* Which session next.
   Structure: four strength days to two cardio days, cardio spaced between strength
   rather than stacked, and no muscle group trained twice inside 48 hours. */
function sessionCategory(k){
  var s = state.sessions[k];
  if(!s || !(s.items||[]).length) return null;
  if(s.mode === 'rest') return null;
  var t = (s.typeManual && s.type) ? s.type : (detectType(s).label || s.type || '');
  if(/cardio/i.test(t)) return 'cardio';
  return sessionStats(s).sets >= 1 ? 'strength' : null;
}

function loggedHistory(){
  return Object.keys(state.sessions).sort().reverse()
    .map(function(k){ return { k:k, cat:sessionCategory(k) }; })
    .filter(function(x){ return x.cat; });
}

function timesDone(focus){
  var n = 0;
  Object.keys(state.sessions).forEach(function(k){
    var s = state.sessions[k];
    if(!(s.items||[]).length) return;
    var t = (s.typeManual && s.type) ? s.type : (detectType(s).label || s.type || '');
    if(t === focus) n++;
  });
  return n;
}

function familyOf(focus){
  if(/pull/i.test(focus)) return 'pull';
  if(/push/i.test(focus)) return 'push';
  if(/leg|glute|hamstring|quad/i.test(focus)) return 'legs';
  if(/cardio/i.test(focus)) return 'cardio';
  return 'mixed';
}

function pickFocus(){
  var hist = loggedHistory();
  var weekCut = weekKey(todayKey());
  var cardioThisWeek = 0, strengthThisWeek = 0;
  hist.forEach(function(x){
    if(weekKey(x.k) !== weekCut) return;
    if(x.cat === 'cardio') cardioThisWeek++; else strengthThisWeek++;
  });

  var lastCardio = null, strengthSinceCardio = 0;
  for(var i=0;i<hist.length;i++){
    if(hist[i].cat === 'cardio'){ lastCardio = hist[i].k; break; }
    strengthSinceCardio++;
  }
  var cardioRest = lastCardio ? daysSince(lastCardio) : 99;
  var lastWasCardio = hist.length && hist[0].cat === 'cardio';

  /* a core-only day counts as core work too, so do not stack another on top of it */
  var lastLabel = hist.length ? sessionLabel(state.sessions[hist[0].k]) : '';
  var lastWasCore = /core/i.test(lastLabel) && daysSince(hist.length ? hist[0].k : todayKey()) < 2;

  /* cardio has to earn its slot: rested, under quota, and with lifting in between */
  var cardioAllowed = !lastWasCardio && !lastWasCore && cardioRest >= 2 && cardioThisWeek < 2
                      && (strengthSinceCardio >= 1 || !lastCardio);
  var cardioWanted = cardioAllowed && (
       (strengthThisWeek >= 2 && cardioThisWeek === 0)
    || (strengthThisWeek >= 3 && cardioThisWeek < 2)
    || strengthSinceCardio >= 3
  );
  if(cardioWanted) return 'Cardio & core';

  /* legs are legs: a quad day the morning after a hamstring day is still a leg day */
  var lastStrength = null;
  for(var q=0;q<hist.length;q++){ if(hist[q].cat === 'strength'){ lastStrength = hist[q].k; break; } }
  var lastFamily = lastStrength ? familyOf(sessionLabel(state.sessions[lastStrength])) : '';
  var lastGap = lastStrength ? daysSince(lastStrength) : 99;

  var tally = groupTally(10), scored = [];
  Object.keys(POOLS).forEach(function(f){
    if(f === 'Full body' || f === 'Cardio & core') return;
    var groups = FOCUS_GROUPS[f];
    if(!groups) return;
    var vol = groups.reduce(function(a,g){ return a + (tally[g]||0); }, 0) / groups.length;
    var rest = daysSince(lastTrained(f));
    var sameFamily = (familyOf(f) === lastFamily && lastGap < 2);
    scored.push({ f:f, vol:vol, rest:rest, ready: rest >= 2 && !sameFamily });
  });
  if(!scored.length) return cardioAllowed ? 'Cardio & core' : 'Full body';

  var ready = scored.filter(function(x){ return x.ready; });
  if(ready.length){
    ready.sort(function(a,b){ return a.vol - b.vol || b.rest - a.rest; });
    return ready[0].f;
  }
  /* nothing has had its 48 hours — cardio if it is available, otherwise the most rested */
  if(cardioAllowed) return 'Cardio & core';
  scored.sort(function(a,b){ return b.rest - a.rest || a.vol - b.vol; });
  return scored[0].f;
}

/* rounding to what the gym actually offers */
function increment(eq){
  if(eq === 'Dumbbell') return 2.5;
  if(eq === 'Weight plate') return 2.5;
  if(eq === 'Barbell') return 5;
  return 5;                                                 // stacks
}
function roundTo(v, step){ return Math.round(v/step)*step; }

/* any prior appearance, even one logged without rep counts */
function prevAny(name, beforeKey){
  var keys = Object.keys(state.sessions).filter(function(k){ return k < beforeKey; }).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var items = state.sessions[keys[i]].items || [];
    for(var j=0;j<items.length;j++){
      if(items[j].name === name) return { k:keys[i], it:items[j] };
    }
  }
  return null;
}

/* the prescription itself */
function prescribe(name, mode){
  var horizon = shiftKey(todayKey(), 1);
  var eqGuess = guessEquip(name, 0);
  var prev = prevPerformance(name, horizon);

  if(!prev){
    var seen = prevAny(name, horizon);
    if(seen){
      var sl = topLoad(seen.it);
      if(sl) return { load:sl, eq:seen.it.eq || eqGuess, ps:!!seen.it.ps,
                      why:'you used '+sl+' lb last time but the reps went unrecorded — match it and write them down' };
      if((seen.it.eq || eqGuess) === 'Bodyweight'){
        return { load:0, eq:'Bodyweight', why:'bodyweight — take the last two reps to genuinely hard' };
      }
      return { load:null, eq:seen.it.eq || eqGuess,
               why:'you have done this but never logged the weight — note it today so it can be tracked' };
    }
    if(isAssisted(name)){
      return { load:null, eq:eqGuess,
               why:'set the assistance so you can manage 8 clean reps, then work that number down over time' };
    }
    if(eqGuess === 'Bodyweight'){
      return { load:0, eq:'Bodyweight', why:'bodyweight — quality over speed, stop when the position breaks' };
    }
    return { load:null, eq:eqGuess, why:'new to you — find a weight where the last two reps are hard' };
  }

  var it = prev.it, L = topLoad(it), eq = it.eq || eqGuess;
  var top = 0;
  (it.sets||[]).forEach(function(r,i){ if(loadAt(it,i) === L && +r > top) top = +r; });

  if(!L){
    if(eq === 'Bodyweight' || eq === 'Cardio machine'){
      return { load:0, eq:eq, ps:!!it.ps, why:'bodyweight — last time '+top+' reps, aim for '+(top+2) };
    }
    return { load:null, eq:eq, ps:!!it.ps,
             why:'the weight was never written down — record it today and this gets a real target' };
  }

  /* light loads need finer jumps than a 5 lb pin */
  var step = (L < 25) ? 2.5 : increment(eq);
  var out, why;

  function bump(pct){
    var t = roundTo(L*pct, step);
    return (t > L) ? t : L + step;
  }

  if(isAssisted(name)){
    /* less help is progress */
    if(mode === 'easy'){ out = L + step; why = 'a little more help than usual while you recover'; }
    else if(top >= 12){ out = Math.max(0, L - step); why = 'you got '+top+' reps with '+L+' lb of help \u2014 take '+step+' lb off the assistance'; }
    else if(top >= 8){ out = L; why = 'hold '+L+' lb of assistance and add reps before dropping it further'; }
    else { out = L + step; why = 'only '+top+' reps, so add a little help back'; }
    return { load:out, eq:eq, ps:!!it.ps, why:why, assisted:true };
  }

  if(mode === 'easy'){
    out = roundTo(L*0.85, step);
    why = 'eased back from '+L+' lb while your back settles';
  } else if(top >= 15){
    out = bump(1.10);
    why = 'you got '+top+' clean reps at '+L+' lb — that is too light';
  } else if(top >= 12){
    if(mode === 'hard'){ out = bump(1.05); why = 'stepping up from '+L+' lb after '+top+' solid reps'; }
    else { out = L; why = 'hold '+L+' lb and add a rep to each set'; }
  } else if(top >= 8){
    out = L;
    why = 'hold '+L+' lb — last time topped out at '+top+' reps';
  } else {
    out = Math.max(step, roundTo(L*0.92, step));
    why = 'back off slightly from '+L+' lb, you only managed '+top;
  }
  return { load:out, eq:eq, ps:!!it.ps, why:why };
}

/* Cardio days run on minutes, not sets — so they get their own builder.
   Core work here is anti-extension and anti-rotation only. */
/* what core work the last few cardio days already used */
function recentCoreWork(n){
  var out = [], seen = 0;
  Object.keys(state.sessions).sort().reverse().forEach(function(k){
    if(seen >= n) return;
    var s = state.sessions[k];
    if(!(s.items||[]).length) return;
    var t = (s.typeManual && s.type) ? s.type : (detectType(s).label || s.type || '');
    if(!/cardio/i.test(t)) return;
    seen++;
    (s.items||[]).forEach(function(it){
      if(it.kind !== 'cardio' && it.kind !== 'prep' && it.kind !== 'cool') out.push(it.name);
    });
  });
  return out;
}

function designCardioDay(opts, mode, flags){
  var mins = opts.minutes;
  var pool = POOLS['Cardio & core'];
  var machines = pool.filter(function(x){ return x.role === 'cardio' && !isHidden(x.n); });
  var cores    = pool.filter(function(x){ return x.role === 'core' && !isHidden(x.n); });

  /* rotate on its own, so consecutive cardio days are not identical */
  var v = (opts.variant || 0) + timesDone('Cardio & core');
  function rot(list){ return list.length ? list.slice(v % list.length).concat(list.slice(0, v % list.length)) : list; }
  machines = rot(machines);
  cores = rot(cores);

  /* one machine carries the session. Steady-state work wants a single sustained
     effort, not three short ones — swapping machines every six minutes keeps
     restarting the warm-up rather than accumulating any real aerobic time. */
  var primary = machines[0];
  var blocks = [], used = 0;

  var target = Math.round((mins - 10) * (mode === 'easy' ? 0.5 : 0.62));
  var ramp = 5;
  var work = Math.max(10, target - ramp);

  blocks.push({
    name: primary.n, role:'cardio', mins: ramp,
    inc: primary.inc ? Math.max(1, Math.round(primary.inc * 0.4)) : 0,
    mph: primary.mph || 0,
    dose: ramp + ' min easy' + (primary.inc ? ' \u00b7 ' + Math.max(1, Math.round(primary.inc*0.4)) + '% incline' : ''),
    why: 'Ramp up on the machine you are about to work on. No separate warm-up needed \u2014 this is it.'
  });

  blocks.push({
    name: primary.n, role:'cardio', mins: work,
    inc: primary.inc || 0, mph: primary.mph || 0,
    dose: work + ' min' + (primary.inc ? ' \u00b7 ' + primary.inc + '% incline \u00b7 ' + primary.mph + ' mph' : ' \u00b7 steady'),
    why: 'One sustained effort at a pace you could just about hold a conversation at. '
       + 'This is where the aerobic work actually happens.',
    note: primary.note
  });
  used = ramp + work;

  /* a second machine only earns a place in a long session, and only as a finisher */
  if(mins >= 60 && machines[1] && mode !== 'easy'){
    var fin = Math.min(8, Math.max(5, target - used));
    if(fin >= 5){
      blocks.push({
        name: machines[1].n, role:'cardio', mins: fin,
        inc: machines[1].inc || 0, mph: machines[1].mph || 0,
        dose: fin + ' min' + (machines[1].inc ? ' \u00b7 ' + machines[1].inc + '% incline' : ' \u00b7 steady'),
        why: 'A short finisher on a different machine \u2014 different muscles, and it stops the hour dragging.'
      });
      used += fin;
    }
  }

  var coreSlots = mode === 'easy' ? 3 : (mins >= 60 ? 5 : (mins >= 45 ? 4 : 3));

  /* skip what came up last time, and take one from each family so a session
     is not four versions of the same idea */
  var recent = recentCoreWork(2);
  var fresh = cores.filter(function(c){ return recent.indexOf(c.n) < 0; });
  if(fresh.length >= coreSlots) cores = fresh;

  var chosen = [], famUsed = {};
  cores.forEach(function(c){
    if(chosen.length >= coreSlots) return;
    var f = c.fam || 'other';
    if(famUsed[f]) return;
    famUsed[f] = 1; chosen.push(c);
  });
  cores.forEach(function(c){
    if(chosen.length >= coreSlots) return;
    if(chosen.indexOf(c) < 0) chosen.push(c);
  });

  chosen.forEach(function(c){
    var sets = mode === 'easy' ? 2 : 3;
    blocks.push({
      name:c.n, role:'core', sets:sets, reps:c.reps,
      dose: c.reps.indexOf('\u00d7') > -1 ? c.reps : sets + ' \u00d7 ' + c.reps,
      why: 'Braced core work \u2014 your trunk resists movement rather than creating it.',
      note: c.note
    });
  });

  return {
    focus:'Cardio & core', mode:mode, flags:flags, blocks:blocks,
    warm:0, cardio:0, cardioDay:true, primary:primary.n,
    totalSets: blocks.filter(function(b){ return b.role === 'core'; })
                     .reduce(function(a,b){ return a + b.sets; }, 0),
    est: Math.round(used + coreSlots * 2.5 + 6), variant:v, pool:pool,
    rest:'30-45 sec between core sets. The machine work is continuous \u2014 no stopping between the two blocks.',
    swapped:'Leg raises, reverse crunches and sit-ups are deliberately not here. They load your lower back '
      + 'in the one direction it likes least. Everything above trains the same muscles with your spine supported.',
    lastDone: lastTrained('Cardio & core')
  };
}

function designSession(opts){
  var focus = opts.focus === 'auto' ? pickFocus() : opts.focus;
  var mode = opts.mode, mins = opts.minutes;
  var back = recentBack();
  var flags = [];

  var dstat = deloadStatus();
  if(dstat.due && mode === 'hard'){
    mode = 'easy';
    flags.push('You have trained ' + dstat.run + ' weeks straight. This is the deload version — lighter on purpose.');
  }

  var rec = recoveryMode();
  if(rec === 'low' && mode === 'hard'){
    mode = 'steady';
    flags.push('Your sleep or readiness was low, so this is the steady version rather than a push day.');
  }

  if(back === 'Achy' || back === 'Sore'){
    if(mode !== 'easy'){ mode = 'easy'; flags.push('Your last back check said "'+back+'", so this is the eased version.'); }
    if(focus === 'Legs — hamstring/glute'){
      focus = 'Legs — quad';
      flags.push('Swapped off hinging to machine-based leg work.');
    }
  }

  if(focus === 'Cardio & core') return designCardioDay(opts, mode, flags);

  var pool = (POOLS[focus] || POOLS['Full body']).slice()
             .filter(function(x){ return !isHidden(x.n); });
  if(mode === 'easy') pool = pool.filter(function(x){ return x.n !== 'Romanian deadlift'; });

  /* rotate within each role so a rebuild surfaces genuinely different work,
     while keeping compounds ahead of accessories and core at the end */
  var v = (opts.variant || 0) + timesDone(focus);
  function rotate(list){
    if(!list.length || !v) return list;
    var n = v % list.length;
    return list.slice(n).concat(list.slice(0, n));
  }
  var mains = rotate(pool.filter(function(x){ return x.role === 'main'; }));
  var accs  = rotate(pool.filter(function(x){ return x.role === 'acc'; }));
  var cores = rotate(pool.filter(function(x){ return x.role === 'core'; }));
  pool = mains.slice(0,2).concat(accs, mains.slice(2), cores);

  var warm = 5;
  var cardio = mins >= 60 ? 15 : (mins >= 45 ? 10 : 5);
  var perEx = mode === 'hard' ? 4.5 : 4;
  var room = Math.max(3, Math.floor((mins - warm - cardio) / perEx));
  var picks = [], regionCount = {};
  pool.forEach(function(x){
    if(picks.length >= room) return;
    var rg = regionOf(x.n);
    var cap = (x.role === 'core') ? 1 : 2;
    if((regionCount[rg]||0) >= cap) return;
    regionCount[rg] = (regionCount[rg]||0) + 1;
    picks.push(x);
  });
  if(picks.length < Math.min(room, pool.length)){          /* top up if the cap was too tight */
    pool.forEach(function(x){
      if(picks.length >= room) return;
      if(picks.indexOf(x) < 0) picks.push(x);
    });
  }
  /* always finish on a core movement when there is space for one */
  if(picks.length >= 4 && !picks.some(function(x){ return x.role === 'core'; }) && cores.length){
    picks[picks.length-1] = cores[0];
  }

  var blocks = picks.map(function(x, i){
    var setCount = (mode === 'easy') ? 2 : (x.role === 'main' && mode === 'hard' ? 4 : 3);
    var p = prescribe(x.n, mode);
    return {
      name:x.n, sets:setCount, reps:x.reps, load:p.load, eq:p.eq || guessEquip(x.n, 0),
      ps:p.ps, why:p.why, note:x.note, ss:x.ss, role:x.role
    };
  });

  var totalSets = blocks.reduce(function(a,b){ return a + b.sets; }, 0);
  var est = warm + cardio + Math.round(blocks.reduce(function(a,b){
    return a + b.sets * (b.role === 'main' ? 1.6 : 1.2); }, 0));

  return {
    focus:focus, mode:mode, flags:flags, blocks:blocks, warm:warm, cardio:cardio,
    variant:v, pool:pool,
    totalSets:totalSets, est:est,
    rest: mode === 'hard' ? '90-120 sec on the main lifts, 60 sec on the rest'
                          : '60-90 sec, and less on the paired exercises',
    lastDone: lastTrained(focus)
  };
}

/* ============ exercise suggestions ============ */
function knownExercises(){
  var seen = {}, out = [];
  LIBRARY.forEach(function(n){ if(!seen[n.toLowerCase()]){ seen[n.toLowerCase()]=1; out.push(n); } });
  Object.keys(state.sessions||{}).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      var key = (it.name||'').toLowerCase();
      if(key && !seen[key]){ seen[key]=1; out.push(it.name); }
    });
  });
  return out;
}

function matchExercises(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return [];
  var words = q.split(/\s+/);
  var scored = [];
  knownExercises().forEach(function(n){
    if(isHidden(n)) return;
    var low = n.toLowerCase();
    // every typed word must appear somewhere in the name
    for(var i=0;i<words.length;i++){ if(low.indexOf(words[i]) < 0) return; }
    var score = 3;
    if(low.indexOf(q) === 0) score = 0;                       // name starts with what you typed
    else if(low.split(/\s+/).some(function(w){ return w.indexOf(words[0])===0; })) score = 1;
    else if(low.indexOf(q) > -1) score = 2;
    scored.push({ n:n, s:score });
  });
  scored.sort(function(a,b){ return a.s - b.s || a.n.length - b.n.length || a.n.localeCompare(b.n); });
  return scored.slice(0, 8).map(function(x){ return x.n; });
}

function highlight(name, q){
  var i = name.toLowerCase().indexOf((q||'').trim().toLowerCase());
  if(i < 0 || !q.trim()) return esc(name);
  var n = q.trim().length;
  return esc(name.slice(0,i)) + '<em>' + esc(name.slice(i,i+n)) + '</em>' + esc(name.slice(i+n));
}

function renderSuggestions(q){
  var box = document.getElementById('sugg');
  if(!box) return;
  var hits = matchExercises(q);
  if(!q || !q.trim()){ box.innerHTML = ''; return; }

  var html = hits.map(function(n){
    var lab = patternLabel(n);
    return '<button type="button" data-act="pickex" data-n="'+esc(n)+'">'
      + '<span class="sname">'+highlight(n, q)+'</span>'
      + '<span class="spat">'+esc(lab)+'</span></button>';
  }).join('');

  var exact = hits.some(function(n){ return n.toLowerCase() === q.trim().toLowerCase(); });
  if(!exact){
    html += '<button type="button" data-act="pickex" data-n="'+esc(q.trim())+'">'
      + '<span class="sname">'+esc(q.trim())+'</span>'
      + '<span class="spat snew">Add as new</span></button>';
  }
  box.innerHTML = html;
}

/* ============ paste parser ============ */
var NOWEIGHT = /(without|no)\s*weight|body\s*weight|\bbw\b/i;

function parseLines(text){
  var out = [];
  text.split(/\n+/).forEach(function(raw){
    var line = raw.replace(/^[\s\-\u2013\u2014\u2022*]+/,'').replace(/\s+/g,' ').trim();
    if(!line) return;
    var low = line.toLowerCase();

    if(guessKind(low)==='cardio'){
      var mn=/([\d.]+)\s*(?:min|minute)/.exec(low),
          ic=/([\d.]+)\s*(?:incl|incline|%)/.exec(low),
          sp=/([\d.]+)\s*(?:mph|speed)/.exec(low);
      var cname = cleanName(/^([^\d]*)/.exec(line)[0]);
      if(!cname){
        var tail = line.replace(/[\d.]+\s*(?:min|minute|mph|incl|incline|speed|%|s)?/gi,' ')
                       .replace(/\s+/g,' ').trim();
        cname = cleanName(tail) || 'Cardio';
      }
      cname = cname.charAt(0).toUpperCase()+cname.slice(1);
      out.push({id:uid(), name:cname, kind:'cardio',
        minutes:mn?+mn[1]:0, incline:ic?+ic[1]:0, speed:sp?+sp[1]:0});
      return;
    }

    var head = /^([^\d]*)/.exec(line)[0];
    var name = cleanName(head) || cleanName(line);
    var data = line.slice(head.length);

    if(/sec|second/.test(low) || guessKind(low)==='hold'){
      var nums = (data.match(/[\d.]+/g)||[]).map(Number);
      var secs;
      if(nums.length===2 && nums[0]<=6 && nums[1]>=5){ secs=[]; for(var q=0;q<nums[0];q++) secs.push(nums[1]); }
      else if(nums.length){ secs = nums; }
      else secs = [null,null,null];
      out.push({id:uid(), name:name, kind:'hold', eq:guessEquip(name,0), sets:secs.slice(0,8)});
      return;
    }

    var sets=[], loads=[], lastLoad=0;
    data.split(/[,;]+/).forEach(function(chunk){
      var c = chunk.trim(); if(!c) return;
      if(NOWEIGHT.test(c)) lastLoad = 0;
      var lm = /([\d.]+)\s*(?:lbs|lb|#|pounds)/i.exec(c);
      if(lm){ lastLoad = +lm[1]; c = c.replace(lm[0], ' '); }
      var reps = (c.match(/[\d.]+/g)||[]).map(Number).filter(function(n){ return n>0 && n<=60; });
      reps.forEach(function(n){ sets.push(Math.round(n)); loads.push(lastLoad); });
    });
    if(!sets.length){ sets=[null,null,null]; loads=[lastLoad,lastLoad,lastLoad]; }
    out.push({id:uid(), name:name, kind:'lift', eq:guessEquip(name, lastLoad),
              sets:sets.slice(0,8), loads:loads.slice(0,8)});
  });
  return out;
}
function cleanName(t){
  return t.replace(/[\s\-\u2013\u2014:*x\u00d7=]+$/i,'').replace(/^[\s\-]+/,'').trim();
}

/* ============ render ============ */
var view = document.getElementById('view');

function render(){
  if(tab==='log') renderLog();
  else if(tab==='history') renderHistory();
  else if(tab==='progress') renderProgress();
  else if(tab==='plan') renderPlan();
  else renderLibrary();
}

function renderLog(){
  var s = session(cur), st = sessionStats(s);
  var h = '';

  h += '<div class="datebar">'
    + '<button class="nav" data-act="day" data-d="-1" aria-label="Previous day">&lsaquo;</button>'
    + '<div class="datefield"><div class="dow">'+esc(DOW[parseKey(cur).getDay()])+'</div>'
    + '<div class="dnum">'+esc(fmtLong(cur))+'</div>'
    + '<input type="date" value="'+cur+'" data-act="pickdate" aria-label="Choose date"></div>'
    + '<button class="nav" data-act="day" data-d="1" aria-label="Next day">&rsaquo;</button>'
    + '</div>';

  var plates='', cap=28, total=Math.min(st.sets,cap);
  for(var i=0;i<cap;i++) plates += '<div class="plate'+(i<total?'':' empty')+'"></div>';

  h += '<div class="session-head"><div class="sh-top"><select data-act="type">'
    + '<option value="">— session type —</option>';
  TYPES.forEach(function(t){ h += '<option'+(s.type===t?' selected':'')+'>'+esc(t)+'</option>'; });
  h += '</select><div class="sh-stats">'
    + '<span><b>'+st.sets+'</b> <u id="setword">set'+(st.sets===1?'':'s')+'</u></span>'
    + '<span><b>'+st.reps+'</b> reps</span>'
    + '<span><b>'+(st.vol?st.vol.toLocaleString():'—')+'</b> lb</span>'
    + '</div></div><div class="stackbar">'+plates+'</div></div>';

  if(BACKEND === 'none'){
    h += '<div class="alarm"><strong>Nothing is being saved</strong>'
      + '<p>This copy cannot store anything, so today\'s entries will be gone when you close it. '
      + 'Download a backup before you leave, and load it back next time.</p>'
      + '<button class="btn btn-solid btn-wide" data-act="download">Download backup file</button></div>';
  }

  var det = detectType(s);

  h += '<div class="modebar">';
  [['solo','Solo'],['trainer','With trainer'],['rest','Rest day']].forEach(function(o){
    h += '<button data-act="mode" data-v="'+o[0]+'" aria-pressed="'+((s.mode||'solo')===o[0])+'">'+esc(o[1])+'</button>';
  });
  h += '</div>';

  h += '<div class="recov"><div class="lbl">Recovery &mdash; from your ring or watch</div><div class="fields">'
    + '<div class="fld sleepfld"><span>Sleep</span><div class="hm">'
    + '<input inputmode="numeric" data-act="rec" data-k="sleepH" value="'+sleepH(s.sleep)+'" placeholder="7" aria-label="Sleep hours">'
    + '<i>h</i>'
    + '<input inputmode="numeric" data-act="rec" data-k="sleepM" value="'+sleepM(s.sleep)+'" placeholder="13" aria-label="Sleep minutes">'
    + '<i>m</i></div></div>'
    + '<div class="fld"><span>Readiness</span><input inputmode="numeric" data-act="rec" data-k="ready" value="'+(s.ready||'')+'" placeholder="\u2014"></div>'
    + '<div class="fld"><span>Resting HR</span><input inputmode="numeric" data-act="rec" data-k="rhr" value="'+(s.rhr||'')+'" placeholder="\u2014"></div>'
    + '</div>'
    + '<div class="lbl" style="margin-top:11px">Body \u2014 log when you weigh in</div><div class="fields">'
    + '<div class="fld"><span>Weight lb</span><input inputmode="decimal" data-act="rec" data-k="bw" value="'+(s.bw||'')+'" placeholder="\u2014"></div>'
    + '<div class="fld"><span>Waist in</span><input inputmode="decimal" data-act="rec" data-k="waist" value="'+(s.waist||'')+'" placeholder="\u2014"></div>'
    + '<div class="fld"><span>Hips in</span><input inputmode="decimal" data-act="rec" data-k="hips" value="'+(s.hips||'')+'" placeholder="\u2014"></div>'
    + '</div>';
  var bv = bodyVerdict();
  if(bv) h += '<div class="verdict'+(bv.tone==='warn'?' warn':'')+'">'+esc(bv.text)+'</div>';
  var rv = recoveryVerdict(s);
  h += '<div class="verdict'+(rv && rv.warn ? ' warn' : '')+'">'+(rv ? esc(rv.text) : '')+'</div>';

  h += '<div class="phaseseg">';
  PHASES.forEach(function(ph){
    h += '<button data-act="phase" data-v="'+esc(ph)+'" aria-pressed="'+(s.phase===ph)+'">'
      + esc(ph === 'Menstrual' ? 'Period' : ph) + '</button>';
  });
  h += '</div>';

  var ci = cycleInfo(cur);
  if(s.phase){
    h += '<div class="cycleline"><b>'+esc(s.phase)+'</b> phase &middot; as reported by your ring'
      + (ci && ci.day ? ' &middot; cycle day ' + ci.day : '') + '</div>';
  } else if(ci){
    h += '<div class="cycleline">Cycle day <b>'+ci.day+'</b> &middot; likely <b>'+esc(ci.phase.toLowerCase())
      + '</b> phase &middot; estimated from a '+ci.len+'-day cycle</div>';
  }

  h += '<button class="cyclebtn'+(s.periodStart?' on':'')+'" data-act="period">'
    + (s.periodStart ? '\u25cf Period started this day' : 'Mark period start \u2014 optional, only if you are not reading it off Oura')
    + '</button></div>';

  var BACK = ['Fine','Aware','Achy','Sore'];
  h += '<div class="backcheck"><div class="lbl">Back check</div><div class="opts">';
  BACK.forEach(function(b){
    h += '<button data-act="back" data-v="'+b+'" aria-pressed="'+(s.back===b)+'">'+b+'</button>';
  });
  h += '</div></div>';

  if(!s.items.length){
    h += '<div class="empty"><strong>Nothing logged yet</strong>Add an exercise below, copy your last session, '
      + 'or load a day from the Plan tab.</div>'
      + '<button class="btn btn-ghost btn-wide" data-act="copylast" style="margin-bottom:10px">Copy my last session</button>';
  }

  var lastKind = null;
  s.items.forEach(function(it, idx){
    var band = (it.kind === 'prep') ? 'Warm up' : (it.kind === 'cool' ? 'Stretch' : 'Workout');
    if(band !== lastKind){
      h += '<div class="seclabel">'+esc(band)+'</div>';
      lastKind = band;
    }
    var cls = it.kind==='cardio' ? ' cardio'
            : (it.kind==='hold' ? ' hold'
            : (it.kind==='prep' ? ' prep' : (it.kind==='cool' ? ' cool' : '')));
    if(it.ss) cls += ' ss';
    if((it.kind==='prep' || it.kind==='cool') && it.done) cls += ' done';
    h += '<div class="card'+cls+'" data-cid="'+it.id+'">'
      + '<div class="card-top"><div class="idx">'+pad(idx+1)+'</div>'
      + '<h3>'+esc((it.kind==='prep'||it.kind==='cool') ? mobName(it.name) : it.name)
      + ((it.kind==='prep'||it.kind==='cool') && it.detail
          ? ' <span class="mobdose">'+esc(it.detail)+'</span>' : '') + '</h3>'
      + ((it.kind==='prep'||it.kind==='cool')
          ? '<button class="tick'+(it.done?' on':'')+'" data-act="tick" data-id="'+it.id+'" '
            + 'aria-pressed="'+(!!it.done)+'" aria-label="Mark '+esc(it.name)+' done">&#10003;</button>'
          : '')
      + '<button class="insbtn" data-act="insertafter" data-id="'+it.id+'" '
      + 'aria-label="Add an exercise after '+esc(it.name)+'" title="Insert here">+</button>'
      + '<button class="notebtn'+(it.note?' has':'')+'" data-act="notetoggle" data-id="'+it.id+'" '
      + 'aria-label="Note for '+esc(it.name)+'">NOTE</button>'
      + ((it.kind==='prep'||it.kind==='cool'||it.kind==='cardio') ? '' :
         '<button class="setupbtn'+(it.setup?' has':'')+'" data-act="setuptoggle" data-id="'+it.id+'" '
         + 'aria-label="Machine setup for '+esc(it.name)+'">SETUP</button>')
      + ((it.kind==='cardio' || it.kind==='prep' || it.kind==='cool') ? '' :
         '<button class="ssbadge'+(it.ss?'':' off')+'" data-act="ss" data-id="'+it.id+'" '
         + 'aria-label="Superset group">'+(it.ss ? 'SS '+esc(it.ss) : 'SS')+'</button>')
      + '<span class="movebtns">'
      + '<button class="movebtn" data-act="moveup" data-id="'+it.id+'"'+(idx===0?' disabled':'')
      + ' aria-label="Move '+esc(it.name)+' earlier">&#9650;</button>'
      + '<button class="movebtn" data-act="movedn" data-id="'+it.id+'"'+(idx===s.items.length-1?' disabled':'')
      + ' aria-label="Move '+esc(it.name)+' later">&#9660;</button></span>'
      + '<button class="kill" data-act="delitem" data-id="'+it.id+'" aria-label="Remove '+esc(it.name)+'">&times;</button></div>';

    var pr = isPR(it, cur);
    h += '<div class="prslot" id="pr-'+it.id+'" style="margin-left:22px">'
      + (pr ? '<span class="prbadge">PR &middot; '+esc(pr)+'</span>' : '') + '</div>';

    if(it.kind === 'prep' || it.kind === 'cool'){
      if(!it.detail && mobDose(it.name)){
        h += '<div class="mobdose" style="margin-left:22px">'+esc(mobDose(it.name))+'</div>';
      }
      h += '</div>';
      return;
    }

    if(it.kind !== 'prep' && it.kind !== 'cool' && it.kind !== 'cardio'){
      if(it.setup){
        h += '<div class="setupline">Setup &middot; <b>'+esc(it.setup)+'</b></div>';
      } else {
        var ls = lastSetup(it.name, shiftKey(cur, -1));
        if(ls) h += '<div class="setupline">Last setup &middot; <b>'+esc(ls.v)+'</b> '
          + '<button class="setupbtn" data-act="usesetup" data-id="'+it.id+'" data-v="'+esc(ls.v)+'">Use this</button></div>';
      }
    }
    if(openSetup === it.id){
      h += '<div class="setupbox"><input type="text" data-act="setupval" data-id="'+it.id+'" '
        + 'value="'+esc(it.setup||'')+'" placeholder="Seat 4, pin 3, feet high…"></div>';
    }

    if(openNote === it.id){
      h += '<input class="exnote" data-act="exnote" data-id="'+it.id+'" value="'+esc(it.note||'')+'" '
        + 'placeholder="Seat at 4, felt it in the left shoulder, machine was taken\u2026">';
    } else if(it.note){
      h += '<div class="exnoteline">'+esc(it.note)+'</div>';
    }

    var mn = moveNote(it.name);
    if(mn) h += '<div class="carenote">'+esc(mn)+'</div>';

    if(it.tgt) h += '<div class="lastline">Target &middot; <b>'+esc(it.tgt)+'</b></div>';

    var prev = prevPerformance(it.name, cur);
    if(prev){
      h += '<div class="lastline">Last &middot; '+fmtShort(prev.k)+' &middot; <b>'+esc(summarise(prev.it))+'</b></div>';
    }

    if(it.kind==='cardio'){
      var segs = segsOf(it);
      var mf = machineFields(it.name);
      segs.forEach(function(g, gi){
        h += '<div class="segrow">'
          + '<span class="segn">'+(gi+1)+'</span>';
        mf.forEach(function(f){
          h += '<label>'+esc(f.label)+'</label>'
            + '<input class="num'+(f.step==='text'?' wide':'')+'" '
            + (f.step === 'text' ? 'type="text"' : 'inputmode="'+f.step+'"')
            + ' value="'+esc(g[f.k] === 0 || g[f.k] === undefined ? '' : g[f.k])+'"'
            + ' data-act="seg" data-id="'+it.id+'" data-i="'+gi+'" data-k="'+f.k+'"'
            + ' aria-label="'+esc(it.name+' segment '+(gi+1)+' '+f.label)+'">';
        });
        h += (segs.length > 1
              ? '<button class="segdel" data-act="segdel" data-id="'+it.id+'" data-i="'+gi+'" aria-label="Remove segment '+(gi+1)+'">&times;</button>'
              : '')
          + '</div>';
      });
      h += '<div class="segfoot">'
        + '<button class="segadd" data-act="segadd" data-id="'+it.id+'">+ Change of pace</button>'
        + (cardioMins(it) ? '<span class="segtot">'+cardioMins(it)+' min total</span>' : '')
        + '</div>';
      h += '<div class="eqrow" style="margin-top:2px">'
        + '<label>Avg HR</label><input class="num" inputmode="numeric" value="'+(it.hr||'')+'" data-act="f" data-id="'+it.id+'" data-k="hr">'
        + '</div>';
    } else {
      if(it.kind==='hold'){
        h += '<div class="eqrow"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)">Seconds held per set</label></div>';
        var live = hold && hold.id === it.id;
        var nextSlot = 0;
        (it.sets||[]).forEach(function(r,ix){ if(+r>0) nextSlot = ix+1; });
        h += '<div class="holdtimer'+(live?' live':'')+'">'
          + '<span class="clock" id="'+(live?'holdclock':'')+'">'+fmtClock(live?holdElapsed():0)+'</span>'
          + (live
              ? '<button class="tbtn stop" data-act="holdstop">Stop &amp; log</button>'
              : '<button class="tbtn" data-act="holdstart" data-id="'+it.id+'" data-i="'+nextSlot+'">Start set '+(nextSlot+1)+'</button>')
          + '</div>';
      } else {
        var tl = topLoad(it);
        h += '<div class="eqrow"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)">Equipment</label>'
          + '<select class="eqsel" data-act="eq" data-id="'+it.id+'" aria-label="Equipment used">';
        EQUIP.forEach(function(q){
          h += '<option'+((it.eq||guessEquip(it.name, tl))===q?' selected':'')+'>'+esc(q)+'</option>';
        });
        h += '</select>'
          + '<button class="psbtn'+(it.ps?'':' off')+'" data-act="ps" data-id="'+it.id+'" '
          + 'aria-pressed="'+(!!it.ps)+'" title="Weight is loaded on both sides">'
          + (it.ps ? '\u00d72 PER SIDE' : 'PER SIDE?') + '</button></div>';
        if(it.kind!=='hold'){
          h += '<div class="loadrow"><label>Reps &middot; load lb per set'
            + (tl ? ' &middot; ' + (isAssisted(it.name) ? 'least assistance ' : 'top ') + tl + ' lb' + (it.ps ? ' each side = ' + (tl*2) + ' lb total' : '') : ' &middot; bodyweight')
            + '</label></div>';
        }
      }
      h += '<div class="sets">';
      (it.sets||[]).forEach(function(r, si){
        h += '<div class="setchip"><em>'+(it.kind==='hold'?'SEC ':'SET ')+(si+1)+'</em>'
          + '<input inputmode="numeric" placeholder="'+(it.kind==='hold'?'sec':'reps')+'" value="'+(r?r:'')+'" data-act="set" data-id="'+it.id+'" data-i="'+si+'" aria-label="Set '+(si+1)+(it.kind==='hold'?' seconds':' reps')+'">'
          + (it.kind==='hold' ? '' :
             '<input class="setload" inputmode="decimal" placeholder="BW" value="'+(loadAt(it,si)||'')+'" data-act="load" data-id="'+it.id+'" data-i="'+si+'" aria-label="Set '+(si+1)+' load in pounds">')
          + '</div>';
      });
      h += '<div class="setbtns">'
        + '<button class="setbtn" data-act="addset" data-id="'+it.id+'" aria-label="Add set">+</button>'
        + (it.sets && it.sets.length ? '<button class="setbtn" data-act="delset" data-id="'+it.id+'" aria-label="Remove last set">&minus;</button>' : '')
        + '</div></div>';
    }
    h += '</div>';
  });

  h += '<div class="adder">'
    + '<input type="text" id="newname" placeholder="'+(insertAt ? 'Insert after '+esc(nameOf(s, insertAt))+'\u2026' : 'Add an exercise\u2026')+'" autocomplete="off" '
    + 'autocorrect="off" autocapitalize="words" spellcheck="false">'
    + '<button class="btn btn-solid" data-act="additem">Add</button></div>'
    + '<div class="sugg" id="sugg"></div>'
    + '<div class="kindtog">'
    + '<button data-act="kind" data-v="lift" aria-pressed="'+(newKind==='lift')+'">Strength</button>'
    + '<button data-act="kind" data-v="cardio" aria-pressed="'+(newKind==='cardio')+'">Cardio</button>'
    + '</div>';

  if(pasteOpen){
    h += '<div class="coach" style="margin-top:12px">'
      + '<textarea id="pastebox" style="min-height:130px" placeholder="Paste your notes, one exercise per line:&#10;Leg curl 55lb*12, 70lb*15, 85lb*12&#10;Knee pushups 12, 10, 8&#10;Treadmill 10 min 9 incline 2.4 mph&#10;Planks 3 30 sec"></textarea>'
      + '<button class="btn btn-solid btn-wide" data-act="dopaste" style="margin:8px 0 6px">Read it in</button>'
      + '</div>';
  } else {
    h += '<button class="btn btn-ghost btn-wide" data-act="paste" style="margin-top:10px">Paste from notes</button>';
  }

  if(s.items.length){
    h += '<div class="footnote" style="margin-top:2px">'
      + '<strong>SS</strong> marks a superset &mdash; two exercises done back to back with no rest between them, '
      + 'then a rest before repeating. Tap SS on both exercises until they show the same letter to pair them.</div>';
  }

  var dl = deloadStatus();
  if(dl.due && s.mode !== 'rest' && !s.deload){
    h += '<div class="alarm"><strong>Time for an easier week</strong><p>'+esc(dl.text)+'</p>'
      + '<button class="btn btn-solid btn-wide" data-act="markdeload">Make this a deload week</button></div>';
  }
  if(s.deload){
    h += '<div class="rxflag"><strong>Deload week.</strong> Two sets instead of three, and about 15% off your '
      + 'usual weights. Same movements, same days \u2014 you are practising, not proving.</div>';
  }

  if(s.mode !== 'rest'){
    h += '<button class="nextbtn" data-act="nextup">'
      + (nextOpen ? 'Hide suggestions' : 'What should I do next?') + '</button>';
    if(nextOpen){
      var nx = nextUp(s);
      h += '<div class="nextwrap"><div class="nextstage">'+esc(nx.stage)
        + ' &middot; ' + nx.done + ' exercise' + (nx.done===1?'':'s') + ' in</div>';
      if(nx.guard){
        h += '<div class="rxflag">Your last back check was not great, so hinging and loaded squatting '
          + 'have been pushed down the list.</div>';
      }
      if(!nx.list.length){
        h += '<div class="nextwhy">Nothing obvious left — you have covered a lot today. '
          + 'Finish with a walk and stretch.</div>';
      }
      nx.list.forEach(function(c, i){
        h += '<button class="nextcard" data-act="addnext" data-n="'+esc(c.name)+'" data-l="'+(c.load===null?'':c.load)+'">'
          + '<span class="nextrank">'+pad(i+1)+'</span><span style="flex:1;min-width:0">'
          + '<span class="nextname">'+esc(c.name)+'</span>'
          + '<span class="nextdose">'+esc(c.dose)+'</span>'
          + '<span class="nextwhy">'+esc(c.why)+'</span>'
          + '<span class="nextadd">Tap to add</span>'
          + '</span></button>';
      });
      h += '<div class="nextrule"><strong>Why this order:</strong> '+esc(ORDER_RULE)+'</div></div>';
    }
  }

  if(s.mode !== 'rest'){
    var hasPrep = s.items.some(function(it){ return it.kind === 'prep'; });
    var hasCool = s.items.some(function(it){ return it.kind === 'cool'; });
    var lifts = s.items.filter(function(it){ return it.kind !== 'prep' && it.kind !== 'cool'; }).length;
    if(!hasPrep || (!hasCool && lifts)){
      h += '<div style="display:flex;gap:8px;margin-top:12px">';
      if(!hasPrep) h += '<button class="addmob" data-act="addwarm">+ Add warm up</button>';
      if(!hasCool && lifts) h += '<button class="addmob" data-act="addcool">+ Add stretches</button>';
      h += '</div>';
    }
  }

  if(s.items.length){
    h += '<button class="finishbtn" data-act="finish">'
      + (reviewFor === cur ? 'Hide review' : 'Workout finished') + '</button>';
    if(reviewFor === cur) h += reviewHtml(cur);
  }

  h += '<div class="eyebrow">Coach notes</div>'
    + '<div class="coach"><textarea data-act="coach" placeholder="Feedback on this session — what to hold, what to load up, what to watch.">'
    + esc(s.coach||'') + '</textarea></div>';

  h += '<div class="eyebrow">How it felt</div>'
    + '<textarea class="notes" data-act="notes" placeholder="Energy, aches, machine settings, seat height…">'+esc(s.notes||'')+'</textarea>';

  view.innerHTML = h;
}

function renderHistory(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return state.sessions[k].items && state.sessions[k].items.length;
  }).sort().reverse();

  var h = '';
  h += '<button class="btn btn-ghost btn-wide" data-act="shareopen" style="margin-bottom:12px">'
    + (shareOpen ? 'Hide' : 'Share with my trainer') + '</button>';
  if(shareOpen){
    h += '<div class="rangeseg">';
    [[7,'7 days'],[14,'2 weeks'],[30,'30 days'],[9999,'Everything']].forEach(function(o){
      h += '<button data-act="sharerange" data-v="'+o[0]+'" aria-pressed="'+(shareDays===o[0])+'">'+esc(o[1])+'</button>';
    });
    h += '</div>';
    var from = shareDays >= 9999 ? '0000-00-00' : shareKeyFrom(shareDays);
    h += '<textarea class="sharebox" id="sharebox" readonly onclick="this.select()">'
      + esc(shareText(from, todayKey())) + '</textarea>'
      + '<button class="btn btn-solid btn-wide" data-act="sharecopy" style="margin:8px 0 14px">Copy</button>'
      + '<div class="footnote" style="margin-top:-6px">Tap Copy, then paste it into a message or email. '
      + 'Every set, weight and note, in plain text your trainer can read on any phone.</div>';
  }

  h += '<div class="eyebrow">Logged sessions · '+keys.length+'</div>';
  if(!keys.length){
    h += '<div class="empty"><strong>No sessions yet</strong>Anything you log shows up here, newest first.</div>';
  }
  keys.forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    var exCount = (s.items||[]).filter(function(i){ return i.kind !== 'cardio'; }).length;
    // a session logged without rep counts would otherwise read as almost no work
    var tail = (st.sets >= exCount) ? (st.sets + ' sets') : (exCount + ' ex \u00b7 ' + st.sets + ' set' + (st.sets===1?'':'s'));
    h += '<button class="row" data-act="open" data-k="'+k+'">'
      + '<span class="rdate">'+fmtShort(k)+'</span>'
      + '<span class="rtype">'+esc(sessionLabel(s))
      + (s.mode==='trainer' ? ' <span class="spat">trainer</span>' : '')
      + (s.mode==='rest' ? ' <span class="spat">rest</span>' : '')+'</span>'
      + '<span class="rsets">'+((s.back==='Achy'||s.back==='Sore')?'<span class="flag">\u25cf </span>':'')+tail+'</span></button>';
  });

  var week = 0, cutoff = shiftKey(todayKey(), -6);
  keys.forEach(function(k){ if(k >= cutoff) week += sessionStats(state.sessions[k]).sets; });
  h += '<div class="footnote">Last 7 days: <strong>'+week+'</strong> working sets across '
    + keys.filter(function(k){return k>=cutoff;}).length + ' sessions.</div>';
  view.innerHTML = h;
}

function renderProgress(){
  var names = {};
  Object.keys(state.sessions).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind==='lift'||!it.kind) names[it.name] = true;
    });
  });
  var list = Object.keys(names).sort();
  if(!progressPick || list.indexOf(progressPick)<0) progressPick = list[0]||'';

  var h = '';

  var span = dataSpanDays();
  h += '<div class="eyebrow">Overview</div><div class="rangeseg">';
  RANGES.forEach(function(r){
    var locked = span < r.need;
    h += '<button data-act="ovrange" data-v="'+r.d+'" aria-pressed="'+(ovRange===r.d)+'"'
      + (locked?' disabled title="Needs about '+Math.ceil((r.need-span)/7)+' more weeks of data"':'')
      + '>'+esc(r.label)+'</button>';
  });
  h += '</div>';

  var lockedNext = RANGES.filter(function(r){ return span < r.need; })[0];
  if(lockedNext){
    h += '<div class="footnote" style="margin-top:-6px">The '+esc(lockedNext.label)+' view unlocks in about '
      + Math.ceil((lockedNext.need - span)/7) + ' weeks, once there is enough logged to say anything honest.</div>';
  }

  var ov = overviewStats(ovRange);
  h += '<div class="ovgrid">'
    + '<div><b>'+ov.sessions+'</b><span>sessions</span></div>'
    + '<div><b>'+ov.sets+'</b><span>working sets</span></div>'
    + '<div><b>'+(ov.vol>=1000?Math.round(ov.vol/1000)+'k':ov.vol)+'</b><span>lb lifted</span></div>'
    + '<div><b>'+ov.perWeek+'</b><span>per week</span></div>'
    + '<div><b>'+ov.cardio+'</b><span>min cardio</span></div>'
    + '<div><b>'+ov.prs+'</b><span>records</span></div>'
    + '</div>';

  if(ov.bwFrom && ov.bwTo && ov.bwFrom !== ov.bwTo){
    var diff = ov.bwTo - ov.bwFrom;
    h += '<div class="footnote" style="margin-top:-4px">Weight '+(diff<0?'down':'up')+' '
      + Math.abs(diff).toFixed(1)+' lb over this period, '+ov.bwFrom+' to '+ov.bwTo+'.</div>';
  }

  var stk = weekStreak();
  var pips = '';
  for(var q=0;q<Math.max(stk.target, stk.thisWeek);q++) pips += '<div class="pip'+(q<stk.thisWeek?' on':'')+'"></div>';
  h += '<div class="streak"><div class="big">'+stk.current+'</div><div class="txt">'
    + '<b>week'+(stk.current===1?'':'s')+' running</b> with at least '+stk.target+' sessions. '
    + 'Best so far: '+stk.best+'. '
    + (stk.thisWeek >= stk.target
        ? 'This week is already counted.'
        : (stk.target - stk.thisWeek) + ' more session' + ((stk.target-stk.thisWeek)===1?'':'s') + ' keeps it alive this week.')
    + '<div class="pips">'+pips+'</div></div></div>';

  h += '<div class="footnote" style="margin-top:-6px">Streaks here count <strong>weeks</strong>, not days &mdash; '
    + 'so rest days, deloads and a bad night never break one. A streak you can only keep by training through pain '
    + 'is a streak worth losing.</div>';

  var pc = phaseComparison();
  if(pc){
    h += '<div class="eyebrow" style="margin-top:22px">Your own numbers by cycle phase</div>'
      + '<table class="wktable"><thead><tr><th>Phase</th><th>Sessions</th><th>Avg sets</th><th>Avg volume</th></tr></thead><tbody>';
    PHASES.forEach(function(ph){
      var b = pc[ph];
      h += '<tr><td class="ph">'+esc(ph)+'</td><td>'+b.sessions+'</td><td>'
        + (b.sessions? b.avgSets : '\u2014')+'</td><td>'
        + (b.sessions? b.avgVol.toLocaleString()+' lb' : '\u2014')+'</td></tr>';
    });
    h += '</tbody></table>'
      + '<div class="footnote">Give this a few months before reading anything into it. Large reviews find '
      + 'no consistent effect of cycle phase on strength, so nothing in this app changes your prescribed '
      + 'weights by phase &mdash; but if a clear pattern shows up in <em>your</em> numbers, that is worth knowing.</div>';
  }

  var wl = [];
  var seenEx = {};
  Object.keys(state.sessions).sort().reverse().forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind !== 'lift' || seenEx[it.name]) return;
      var done = (it.sets||[]).map(function(r,i){ return { r:+r||0, l:loadAt(it,i) }; })
                              .filter(function(x){ return x.r>0; });
      if(!done.length) return;
      seenEx[it.name] = 1;
      wl.push({ name:it.name, eq:it.eq||'', load:Math.max.apply(null, done.map(function(x){ return x.l; })),
                ps:!!it.ps, k:k });
    });
  });
  if(wl.length){
    wl.sort(function(a,b){ return (a.eq||'').localeCompare(b.eq||'') || a.name.localeCompare(b.name); });
    var ms = milestones();
  var got = ms.filter(function(x){ return x.done; });
  var next = ms.filter(function(x){ return !x.done; }).slice(0,4);
  h += '<div class="eyebrow" style="margin-top:24px">Milestones &middot; '+got.length+' of '+ms.length+'</div>'
    + '<div class="badges">';
  got.concat(next).forEach(function(x){
    var pct = Math.min(100, Math.round(x.have / x.need * 100));
    h += '<div class="badge'+(x.done?' got':'')+'">'
      + '<div class="bn">'+(x.done?'\u2605 ':'')+esc(x.name)+'</div>'
      + '<div class="bb">'+esc(x.blurb)+'</div>'
      + (x.done ? '' :
         '<div class="bp">'+x.have.toLocaleString()+' of '+x.need.toLocaleString()+(x.unit?' '+x.unit:'')+'</div>'
         + '<div class="track"><i style="width:'+pct+'%"></i></div>')
      + '</div>';
  });
  h += '</div>';
  if(next.length){
    h += '<div class="footnote">Showing what you have earned plus the next few in reach. '
      + 'The rest appear as you close on them.</div>';
  }

  h += '<div class="eyebrow" style="margin-top:22px">Your working weights</div>'
      + '<table class="wktable"><thead><tr><th>Exercise</th><th>Equipment</th><th>Last load</th></tr></thead><tbody>';
    wl.forEach(function(x){
      h += '<tr><td>'+esc(x.name)+'</td><td style="color:var(--steel)">'+esc(x.eq||'\u2014')+'</td>'
        + '<td class="strong">'+(x.load ? x.load+' lb'+(x.ps?'/side':'') : 'BW')+'</td></tr>';
    });
    h += '</tbody></table>'
      + '<div class="footnote">These numbers are not comparable with each other, and they are not supposed to be. '
      + 'A cable stack, a plate-loaded machine and a dumbbell each move a different amount of resistance for the '
      + 'same effort &mdash; 30 lb on a cable curl and 15 lb on a preacher curl can be the same work for your biceps. '
      + 'Leverage, cable pulleys and machine friction all differ. Every prediction and record in this app compares '
      + 'an exercise only against itself.</div>';
  }

  h += '<div class="eyebrow" style="margin-top:22px">Exercise history</div>';
  if(!list.length){
    view.innerHTML = h + '<div class="empty"><strong>Nothing to chart yet</strong>Log a couple of sessions and progress shows up here.</div>';
    return;
  }
  h += '<select class="picker" data-act="pick">';
  list.forEach(function(n){ h += '<option'+(n===progressPick?' selected':'')+'>'+esc(n)+'</option>'; });
  h += '</select>';

  var pb = bestEver(progressPick, null);
  if(pb.reps){
    h += '<div class="lastline" style="margin-left:0">Best so far &middot; <b>'
      + (pb.load ? pb.load+' lb' : 'bodyweight') + ' &times; ' + pb.reps + ' reps</b></div>';
  }

  var rows = [];
  Object.keys(state.sessions).sort().forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.name!==progressPick || (it.kind && it.kind!=='lift')) return;
      var reps=0, vol=0;
      (it.sets||[]).forEach(function(r,i){ reps += (+r||0); vol += (+r||0)*loadAt(it,i); });
      rows.push({ k:k, w:topLoad(it), sets:(it.sets||[]).length, reps:reps, vol:vol,
                  best:Math.max.apply(null,(it.sets||[0]).map(Number)) });
    });
  });

  var metricVol = rows.some(function(r){ return r.w>0; });
  var maxv = Math.max.apply(null, rows.map(function(r){ return metricVol?r.vol:r.reps; }).concat([1]));
  var recent = rows.slice(-10);

  h += '<div class="eyebrow" style="margin-top:18px">'+(metricVol?'Volume per session (lb)':'Total reps per session')+'</div>';
  h += '<div class="bars">';
  recent.forEach(function(r){
    var v = metricVol?r.vol:r.reps;
    h += '<div class="bar" style="height:'+Math.max(3, Math.round(v/maxv*108))+'px" title="'+v+'"></div>';
  });
  h += '</div><div class="barlabels">';
  recent.forEach(function(r){ h += '<span>'+parseKey(r.k).getDate()+'/'+(parseKey(r.k).getMonth()+1)+'</span>'; });
  h += '</div>';

  h += '<table class="ptable"><thead><tr><th>Date</th><th>Load</th><th>Sets</th><th>Reps</th><th>Best set</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){
    h += '<tr><td>'+fmtShort(r.k)+'</td><td class="strong">'+(r.w?r.w+' lb':'BW')+'</td><td>'+r.sets+'</td><td>'+r.reps+'</td><td>'+r.best+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="footnote">Add one rep to a set, or step the stack up 5&nbsp;lb, once you finish every set at the top of your rep range with clean form.</div>';

  var tally = groupTally(14);
  var peak = Math.max.apply(null, GROUPS.map(function(g){ return tally[g]; }).concat([1]));
  h += '<div class="eyebrow" style="margin-top:24px">Balance &middot; sets per muscle group, last 14 days</div><div class="bars2">';
  GROUPS.forEach(function(g){
    var v = tally[g], pct = Math.round(v/peak*100);
    h += '<div class="grprow"><span class="grpname">'+esc(g)+'</span>'
      + '<span class="grptrack"><i class="'+(v < peak*0.34 ? 'low' : '')+'" style="width:'+Math.max(pct,2)+'%"></i></span>'
      + '<span class="grpnum">'+v+'</span></div>';
  });
  h += '</div>';
  var starved = GROUPS.filter(function(g){ return tally[g] < peak*0.34; });
  h += '<div class="footnote">'
    + (starved.length
        ? 'Running light on <strong>'+esc(starved.join(', '))+'</strong> compared with your heaviest group. '
          + 'Red bars are the ones to feed next.'
        : 'Reasonably even across the board over the last two weeks.')
    + '</div>';

  view.innerHTML = h;
}

function renderLibrary(){
  var groups = libraryByDay();
  var order = ['Pull','Push','Legs','Core','Cardio','Other'];
  var blurb = {
    Pull:'Back and biceps \u2014 pull days, and the pulling half of an upper or full-body session.',
    Push:'Chest, shoulders and triceps \u2014 push days, and the pressing half of upper or full body.',
    Legs:'Quads, hamstrings, glutes and calves \u2014 leg days and the lower half of full body.',
    Core:'Trunk work \u2014 mostly on cardio days, and to finish a strength session.',
    Cardio:'The machines. Minutes rather than reps.',
    Other:'Everything that does not sit neatly in one day.'
  };

  var total = 0, off = 0;
  order.forEach(function(g){
    (groups[g]||[]).forEach(function(x){ total++; if(isHidden(x.name)) off++; });
  });

    + '<div class="footnote" style="margin-top:0">Grouped by the day they belong to. Tap a name for the '
    + 'full muscle list and its diagram. Switch one off and it stops appearing in plans, suggestions and search.</div>';

    h += '<div class="libgroup"><div class="libhead">'+esc(g)+' <span>'+list.length+'</span></div>'
      + '<div class="libblurb">'+esc(blurb[g]||'')+'</div>'
      + '<table class="libtable"><thead><tr><th>Exercise</th><th>Muscles worked</th><th>Use</th></tr></thead><tbody>';

    list.forEach(function(x){
      var hid = isHidden(x.name);
      var open = (libOpen === x.name);
      var prim = x.muscles.primary;
      var shown = prim.slice(0,2).join(', ') + (prim.length > 2 ? ' +' + (prim.length-2) : '');
      h += '<tr class="'+(hid?'off':'')+'">'
        + '<td><button class="libname" data-act="libopen" data-n="'+esc(x.name)+'" aria-expanded="'+open+'">'
        + esc(x.name)
        + (hybridKeys(x.name) ? '<span class="libtag">combo</span>' : '')

        + '<td class="libmus">'+esc(shown || '\u2014')+'</td>'
        + '<td><button class="libtoggle'+(hid?'':' on')+'" data-act="libtoggle" data-n="'+esc(x.name)+'" '
        + 'aria-pressed="'+(!hid)+'" aria-label="'+(hid?'Show ':'Hide ')+esc(x.name)+'">'
        + (hid ? 'OFF' : 'ON') + '</button></td></tr>';

      if(open){
        var m = x.muscles;
        h += '<tr class="libdetailrow"><td colspan="3"><div class="libdetail">'
          + (m.primary.length ? '<div><b>Works</b> '+esc(m.primary.join(', '))+'</div>' : '')
          + (m.secondary.length ? '<div><b>Also</b> '+esc(m.secondary.join(', '))+'</div>' : '')
          + '<div><b>Days</b> '+esc(x.tags.join(' \u00b7 '))+'</div>'
          + (m.keys.length > 1 ? '<div class="libcombo">Two movements in one: '
              + esc(m.keys.map(function(k){ return MOVE_LABELS[k] || k; }).join(' + '))+'</div>' : '')
          + '</div>'
          + (moveNote(x.name) ? '<div class="libcare">'+esc(moveNote(x.name))+'</div>' : '')
          + '<div class="demorow">'+demoLinks(x.name)+'</div>'
          + '</td></tr>';
      }
    });
    h += '</tbody></table></div>';
  });

  view.innerHTML = h;
}
