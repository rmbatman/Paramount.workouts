<style>
:root{
  --bone:#E9EAE6;
  --paper:#F8F8F5;
  --ink:#14171A;
  --steel:#767C80;
  --pine:#1E4F43;
  --pine-deep:#123128;
  --brass:#C08F1F;
  --brass-lite:#E3B84A;
  --rule:#D3D4CE;
  --warn:#8C3A24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html{overflow-x:hidden}
body{
  max-width:100%;overflow-x:hidden;
  background:var(--bone);
  color:var(--ink);
  font-family:'Barlow',system-ui,sans-serif;
  font-size:16px;line-height:1.4;
  padding-bottom:64px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;width:100%;overflow-x:hidden}
main{max-width:100%}
.card,.drill,.rx,.review,.recov,.guide,.coachbox{max-width:100%;overflow-wrap:anywhere}
.card-top{flex-wrap:wrap}

/* ---------- masthead ---------- */
.mast{
  background:var(--pine-deep);
  color:var(--paper);
  padding:18px 18px 14px;
  border-bottom:3px solid var(--brass);
}
.mast h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:30px;line-height:1;
  letter-spacing:.14em;text-transform:uppercase;
}
.sstat{margin-top:5px !important}
.sstat.ok{color:rgba(248,248,245,.55) !important}
.sstat.busy{color:var(--brass-lite) !important}
.sstat.bad{color:#F0A08A !important}
.mast p{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brass-lite);margin-top:7px;
}

/* ---------- tabs ---------- */
.tabs{display:flex;background:var(--pine);border-bottom:1px solid var(--pine-deep)}
.tab{
  flex:1;min-width:0;appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13.5px;
  letter-spacing:.08em;text-transform:uppercase;
  color:rgba(248,248,245,.6);padding:14px 2px 12px;
  border-bottom:3px solid transparent;
}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass-lite)}
.tab:focus-visible{outline:2px solid var(--brass-lite);outline-offset:-4px}

main{padding:14px 14px 40px}

/* ---------- date bar ---------- */
.datebar{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.datebar .nav{
  width:46px;flex:0 0 46px;background:var(--paper);border:1px solid var(--rule);
  border-radius:2px;font-size:20px;color:var(--ink);cursor:pointer;line-height:1;
}
.datefield{
  flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:5px 12px;text-align:center;position:relative;
}
.datefield .dow{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:var(--steel);text-transform:uppercase;
}
.datefield .dnum{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;
  letter-spacing:.06em;text-transform:uppercase;line-height:1.1;
}
.datefield input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}

/* ---------- session head ---------- */
.session-head{
  background:var(--pine);color:var(--paper);border-radius:2px;
  padding:9px 12px 8px;margin-bottom:12px;
}
.sh-top{display:flex;align-items:baseline;gap:10px}
.session-head select{
  flex:1;min-width:0;appearance:none;background:transparent;border:0;
  color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;
  letter-spacing:.07em;text-transform:uppercase;padding:0;cursor:pointer;
}
.session-head select option{color:#14171A}
.sh-stats{display:flex;gap:11px;flex:0 0 auto}
.sh-stats span{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(248,248,245,.55);
}
.sh-stats b{color:#fff;font-weight:500;font-size:12px}
.sh-stats u{text-decoration:none}
.stackbar{display:flex;gap:2px;height:10px;margin-top:7px;align-items:stretch}
.plate{flex:1;background:var(--brass);border-radius:1px;min-width:2px}
.plate.empty{background:rgba(248,248,245,.13)}

/* ---------- exercise card ---------- */
.card{
  background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--pine);
  border-radius:2px;padding:12px 12px 10px;margin-bottom:10px;position:relative;
}
.card.cardio{border-left-color:var(--brass)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.idx{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);
  font-weight:600;padding-top:4px;
}
.card h3{
  flex:1 1 auto;min-width:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;
  letter-spacing:.03em;text-transform:uppercase;line-height:1.15;overflow-wrap:anywhere;
}
.movebtns{display:flex;flex-direction:column;gap:2px;margin-top:1px}
.movebtn{
  appearance:none;border:1px solid var(--rule);background:#fff;color:var(--steel);
  width:26px;height:21px;border-radius:2px;cursor:pointer;line-height:1;font-size:11px;padding:0;
}
.movebtn:hover:not(:disabled){border-color:var(--pine);color:var(--pine);background:#F1F2EE}
.movebtn:disabled{opacity:.28;cursor:default}
.movebtns{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.movebtn{
  appearance:none;border:1px solid var(--rule);background:#fff;color:var(--steel);
  width:26px;height:21px;border-radius:2px;cursor:pointer;line-height:1;font-size:11px;padding:0;
}
.movebtn:hover:not(:disabled){border-color:var(--pine);color:var(--pine);background:#F1F2EE}
.movebtn:disabled{opacity:.28;cursor:default}
.kill{
  appearance:none;border:0;background:transparent;color:var(--steel);
  font-size:20px;line-height:1;padding:2px 4px;cursor:pointer;
}
.kill:hover{color:var(--warn)}
.card.hold{border-left-color:var(--steel)}
.card.ss{border-left-style:double;border-left-width:6px}
.ssbadge{
  appearance:none;border:1px solid var(--brass);background:var(--brass);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  padding:4px 6px;border-radius:2px;cursor:pointer;line-height:1;margin-top:3px;
}
.ssbadge.off{background:transparent;color:var(--steel);border-color:var(--rule)}
.segrow{display:flex;align-items:center;gap:6px;margin:6px 0 0 22px;flex-wrap:wrap}
.segrow .segn{
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);
  width:12px;flex:0 0 12px;
}
.segrow label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--steel);
}
.segrow .num{width:52px;height:34px}
.segrow .num.wide{width:66px}
.segdel{
  appearance:none;border:0;background:transparent;color:var(--steel);
  font-size:17px;line-height:1;padding:2px 4px;cursor:pointer;
}
.segdel:hover{color:var(--warn)}
.segfoot{display:flex;align-items:center;gap:10px;margin:7px 0 2px 22px;flex-wrap:wrap}
.segadd{
  appearance:none;border:1px dashed var(--steel);background:transparent;color:var(--steel);
  border-radius:2px;padding:7px 10px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
}
.segadd:hover{border-color:var(--brass);color:var(--brass)}
.segtot{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--pine);font-weight:600}
.loadrow{display:flex;align-items:center;gap:6px;margin:8px 0 2px 22px}
.loadrow label{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--steel);
}
input.num{
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--ink);
  background:#fff;border:1px solid var(--rule);border-radius:2px;
  padding:6px 4px;text-align:center;width:58px;height:34px;
}
input.num:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}

.sets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 22px;align-items:flex-end}
.setchip{width:56px}
.setchip em{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-style:normal;
  letter-spacing:.14em;color:var(--steel);text-align:center;margin-bottom:3px;
}
.setchip input::placeholder{color:#C3C6C0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.setchip input{
  width:56px;height:46px;font-size:19px;
  font-family:'IBM Plex Mono',monospace;font-weight:500;
  background:#fff;border:1px solid var(--rule);border-radius:2px;text-align:center;color:var(--ink);
}
.setchip input:focus{outline:2px solid var(--brass);outline-offset:-1px}
.setchip input::placeholder{color:#C3C6C0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.setchip input.setload{
  height:30px;font-size:12px;color:var(--steel);margin-top:3px;
  background:#F1F1EC;border-top:0;
}
.setchip input.setload:focus{color:var(--ink)}
.setbtns{display:flex;gap:6px}
.setbtn{
  width:46px;height:46px;border:1px dashed var(--steel);background:transparent;
  border-radius:2px;font-size:22px;color:var(--steel);cursor:pointer;line-height:1;
}
.setbtn:hover{border-color:var(--pine);color:var(--pine)}

/* ---------- buttons ---------- */
.btn{
  appearance:none;cursor:pointer;border-radius:2px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.12em;text-transform:uppercase;padding:13px 16px;
}
.btn-solid{background:var(--pine);color:#fff;border:1px solid var(--pine)}
.btn-solid:hover{background:var(--pine-deep)}
.btn-ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.btn-ghost:hover{background:rgba(30,79,67,.07)}
.btn-wide{display:block;width:100%;margin-top:6px}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.adder{display:flex;gap:8px;margin-top:14px}
.adder input[type=text]{
  flex:1;min-width:0;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:12px;font-family:'Barlow',sans-serif;font-size:16px;color:var(--ink);
}
.adder input[type=text]:focus{outline:2px solid var(--brass);outline-offset:-1px}
.sugg{margin-top:6px}
.sugg:empty{display:none}
.sugg button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--paper);border:1px solid var(--rule);border-bottom:0;
  padding:12px 12px;color:var(--ink);
}
.sugg button:last-child{border-bottom:1px solid var(--rule)}
.sugg button:first-child{border-radius:2px 2px 0 0}
.sugg button:last-child{border-radius:0 0 2px 2px}
.sugg button:hover,.sugg button:focus-visible{background:#fff;outline:none;border-left:3px solid var(--brass);padding-left:9px}
.sugg .sname{
  flex:1;font-family:'Barlow',sans-serif;font-size:15.5px;line-height:1.2;
}
.sugg .sname em{font-style:normal;font-weight:600;color:var(--pine);background:#EDE4C6;border-radius:2px}
.sugg .spat{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--steel);
}
.sugg .snew{color:var(--brass)}
.kindtog{display:flex;gap:0;margin-top:8px}
.kindtog button{
  flex:1;background:var(--paper);border:1px solid var(--rule);color:var(--steel);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:9px 4px;cursor:pointer;
}
.kindtog button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.backcheck{margin:-4px 0 12px}
.backcheck .lbl{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--steel);margin-bottom:5px;
}
.backcheck .opts{display:flex;gap:0}
.backcheck button{
  flex:1;background:var(--paper);border:1px solid var(--rule);color:var(--steel);
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 2px;cursor:pointer;
}
.backcheck button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.backcheck button[aria-pressed="true"][data-v="Achy"],
.backcheck button[aria-pressed="true"][data-v="Sore"]{background:var(--warn);border-color:var(--warn)}

.eqrow{display:flex;align-items:center;gap:8px;margin:8px 0 2px 22px;flex-wrap:wrap}
select.eqsel{
  appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0h8L4 6z' fill='%23767C80'/></svg>") no-repeat right 8px center;
  border:1px solid var(--rule);border-radius:2px;padding:7px 24px 7px 9px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink);cursor:pointer;
}
select.eqsel:focus{outline:2px solid var(--brass);outline-offset:-1px}
.psbtn{
  appearance:none;border:1px solid var(--rule);background:#fff;color:var(--steel);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.08em;
  padding:7px 8px;border-radius:2px;cursor:pointer;line-height:1;
}
.psbtn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#fff}
.formbtn{
  appearance:none;border:1px solid var(--rule);background:#fff;color:var(--steel);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  padding:4px 7px;border-radius:2px;cursor:pointer;line-height:1;margin-top:3px;
}
.insbtn{
  appearance:none;border:1px solid var(--rule);background:#fff;color:var(--steel);
  font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;line-height:1;
  padding:4px 7px;border-radius:2px;cursor:pointer;margin-top:3px;
}
.insbtn:hover{border-color:var(--brass);color:var(--brass)}
.formbtn[aria-expanded="true"]{background:var(--pine);border-color:var(--pine);color:#fff}










.carenote{
  font-size:13px;line-height:1.45;color:var(--warn);margin:5px 0 0 22px;
  padding-left:8px;border-left:2px solid var(--warn);
}
.libcare{color:var(--warn);font-size:13px;line-height:1.45;margin-top:5px}
.demorow{display:flex;gap:14px;align-items:baseline;margin-top:7px}
.demolink{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--pine);text-decoration:none;
  border-bottom:1px solid var(--brass);padding-bottom:2px;
}
.demolink:hover{color:var(--brass)}
.demolink.alt{color:var(--steel);border-bottom-color:var(--rule);font-size:9.5px}
.demolink.alt:hover{color:var(--pine)}
.rxopen .pat{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin-bottom:4px}
.lastline{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.02em;
  color:var(--steel);margin:6px 0 0 22px;
}
.lastline b{color:var(--pine);font-weight:600}
.prslot:empty{display:none}
.prbadge{
  display:inline-block;background:var(--brass);color:#fff;border-radius:2px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.1em;
  padding:3px 5px;margin-top:3px;line-height:1;
}
.holdtimer{
  display:flex;align-items:center;gap:8px;margin:10px 0 2px 22px;
}
.holdtimer .clock{
  font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--pine);
  min-width:74px;letter-spacing:.02em;
}
.holdtimer.live .clock{color:var(--brass)}
.tbtn{
  appearance:none;border:1px solid var(--pine);background:var(--pine);color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;padding:11px 16px;border-radius:2px;cursor:pointer;
}
.tbtn.stop{background:var(--warn);border-color:var(--warn)}
.tbtn.ghost{background:transparent;color:var(--pine)}
#rest{
  position:fixed;left:0;right:0;bottom:0;background:var(--pine-deep);color:#fff;
  transform:translateY(110%);transition:transform .25s ease;z-index:60;
  border-top:3px solid var(--brass);padding:11px 14px;
  display:flex;align-items:center;gap:10px;
}
#rest.show{transform:translateY(0)}
#rest .rclock{
  font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;min-width:64px;
}
#rest .rlabel{
  flex:1;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass-lite);
}
#rest button{
  appearance:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:11px;padding:9px 10px;border-radius:2px;cursor:pointer;
}
.bars2{margin-top:4px}
.grprow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.grpname{
  flex:0 1 104px;min-width:74px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--steel);
}
.grptrack{flex:1;height:14px;background:#E3E5E0;border-radius:2px;overflow:hidden}
.grptrack i{display:block;height:100%;background:var(--pine);border-radius:2px}
.grptrack i.low{background:var(--warn)}
.grpnum{
  flex:0 0 30px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);
}
.flag{color:var(--warn);font-family:'IBM Plex Mono',monospace;font-size:11px}
.cyclebtn{
  appearance:none;width:100%;margin-top:9px;padding:9px;border:1px dashed var(--rule);
  background:transparent;border-radius:2px;cursor:pointer;color:var(--steel);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
}
.cyclebtn.on{border-style:solid;border-color:#A8506B;background:#F7EDF1;color:#8C3A55}
.phaseseg{display:flex;gap:0;margin-top:8px}
.phaseseg button{
  flex:1;background:#fff;border:1px solid var(--rule);color:var(--steel);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 2px;line-height:1.2;
}
.phaseseg button[aria-pressed="true"]{background:#A8506B;border-color:#A8506B;color:#fff}
.cycleline{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  color:#8C3A55;margin-top:7px}
.cycleline b{font-weight:600}
.rangeseg{display:flex;margin-bottom:10px}
.rangeseg button{
  flex:1;background:var(--paper);border:1px solid var(--rule);color:var(--steel);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:10px 2px;
}
.rangeseg button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.rangeseg button:disabled{opacity:.4;cursor:default}

<body>
<div class="wrap">
  <header class="mast">
    <h1>Paramount Log</h1>

  </header>
  <nav class="tabs" role="tablist">

    <button class="tab" role="tab" data-tab="history" aria-selected="false">History</button>

    <button class="tab" role="tab" data-tab="plan" aria-selected="false">Plan</button>

  <button data-rest="-15">&minus;15s</button>
  <button data-rest="15">+15s</button>
  <button data-rest="skip">Done</button>
</div>

<script>
/* ============ state ============ */
var KEY = 'paramountlog:v1';
var state = { sessions: {} };
var cur = todayKey();
var tab = 'log';
var newKind = 'lift';
var progressPick = '';
var pasteOpen = false;
var openForm = '';
var backupOpen = false;
var libOpen = '';
var planWeek = 0;
var shareOpen = false;
var shareDays = 14;
var reviewFor = '';
var ovRange = 28;
var openNote = '';
var openSetup = '';
var nextOpen = false;
var insertAt = '';
var rxFocus = 'auto', rxMin = 45, rxMode = 'steady', rxPlan = null, rxOpen = '', rxVariant = 0;
var saveTimer = null;

var TYPES = ['Pull','Push','Legs — quad','Legs — hamstring/glute','Upper','Full body','Cardio & core','Cardio only','Rest'];

var LIBRARY = [
/* back */ 'Lat pull down','Wide grip lat pull down','Close grip lat pull down','Assisted pull up','Pull up','Chin up',
'Seated row','Chest supported row','T-bar row','Single arm dumbbell row','Bent over row','Inverted row',
'Straight arm pull down','Face pull','Reverse fly','Rear delt fly machine','Back extension','Shrug',
/* chest */ 'Chest press machine','Incline chest press','Decline chest press','Bench press','Incline bench press',
'Dumbbell bench press','Dumbbell chest fly','Chest fly machine','Cable crossover','Pec deck','Pushups on knee',
'Push up','Incline push up','Bench reverse push ups','Dip',
/* shoulders */ 'Shoulder press machine','Dumbbell shoulder press','Arnold press','Lateral raise','Front shoulder raise',
'Cable lateral raise','Upright row','Landmine press',
/* arms */ 'Bicep curl','Dumbbell bicep curl','Barbell bicep curl','Hammer curl','Concentration bicep curl',
'Preacher curl','Machine seated bicep curl','Cable bicep curl','Incline dumbbell curl',
'Cable tricep pull down','Rope tricep pushdown','Overhead tricep curl','Skull crusher','Tricep kickback','Bench dip',
/* legs */ 'Squats','Goblet squat','Hack squat','Leg press','Leg extension','Seated leg curl','Lying leg curl',
'Romanian deadlift','Walking lunges','Reverse lunge','Bulgarian split squat','Step up','Wall sit',
'Hip thrust','Glute extension','Glute cable kickback','Hip abduction','Hip adduction',
'Standing calf raise','Seated calf raise','Sumo squat','Curtsy lunge',
/* core */ 'Plank','Side plank','Dead bug','Bird dog','Pallof press','Kneeling ab rollout','Farmer carry',
'Suitcase carry','Bear crawl','Glute bridge',
/* cardio */ 'Treadmill','Incline walk','Stationary bike','Stairmaster','Rowing machine'];

var CARDIO_WORDS = ['treadmill','walk','bike','stair','rowing machine','row erg','rower','elliptical','run','cardio'];

var PLANS = [
  {name:'Pull', tag:'Day 1 · back, rear delts, biceps',
   items:['Lat pull down','Seated row','Chest supported row','Face pull','Cable bicep curl','Back extension','Plank']},
  {name:'Legs — quad', tag:'Day 2 · no spinal loading',
   items:['Leg press','Hack squat','Leg extension','Seated leg curl','Standing calf raise','Bird dog']},
  {name:'Push', tag:'Day 3 · chest, shoulders, triceps',
   items:['Chest press machine','Incline chest press','Shoulder press machine','Lateral raise','Cable tricep pull down','Pushups on knee','Dead bug']},
  {name:'Legs — hamstring/glute', tag:'Day 4 · posterior chain',
   items:['Seated leg curl','Glute kickback machine','Hip abduction','Leg press','Standing calf raise','Pallof press']},
  {name:'Full body', tag:'Day 5 · one compound per pattern',
   items:['Lat pull down','Chest press machine','Leg press','Seated row','Shoulder press machine','Back extension','Plank']}
];

/* ============ helpers ============ */
function pad(n){ return (n<10?'0':'')+n; }
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftKey(k,days){ var d=parseKey(k); d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtLong(k){ var d=parseKey(k); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
function fmtShort(k){ var d=parseKey(k); return DOW[d.getDay()].slice(0,3).toUpperCase()+' '+pad(d.getDate())+' '+MON[d.getMonth()].toUpperCase(); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
var HOLD_WORDS = ['plank','hold','dead hang','wall sit'];
function guessKind(name){
  var n = (name||'').toLowerCase(), i;
  /* match whole words: "crunch" contains "run", "trunk" contains "run" */
  var words = n.split(/[^a-z0-9]+/).filter(Boolean);
  function hasWord(w){ return words.indexOf(w) > -1; }
  function hasPhrase(p){ return n.indexOf(p) > -1; }

  /* a lifting word wins outright: "walking lunges" is a leg exercise, not a walk */
  var LIFT_WORDS = ['lunge','lunges','squat','squats','press','row','rows','curl','curls','raise','raises',
    'extension','fly','flies','crossover','pulldown','pushdown','deadlift','thrust','shrug','dip','dips',
    'pushup','pushups','crunch','crunches','rollout','bridge','abduction','adduction','kickback','taps','slides'];
  for(i=0;i<LIFT_WORDS.length;i++){ if(hasWord(LIFT_WORDS[i])) return 'lift'; }

  for(i=0;i<CARDIO_WORDS.length;i++){
    var c = CARDIO_WORDS[i];
    if(c.indexOf(' ') > -1){ if(hasPhrase(c)) return 'cardio'; continue; }
    if(hasWord(c)) return 'cardio';
    /* a word that starts with it: stairmaster, running, treadmills */
    for(var q=0;q<words.length;q++){ if(words[q].indexOf(c) === 0) return 'cardio'; }
  }
  for(i=0;i<HOLD_WORDS.length;i++){
    var hw = HOLD_WORDS[i];
    if(hw.indexOf(' ') > -1 ? hasPhrase(hw) : hasWord(hw)) return 'hold';
  }
  return 'lift';
}
function session(k){
  if(!state.sessions[k]) state.sessions[k] = { type:'', notes:'', items:[] };
  return state.sessions[k];
}
/* Cardio is logged in segments: 10 min at 9.5% and 2.5 mph, then 2 min at 3% and 4 mph.
   Older entries with a single minutes/incline/speed are read as one segment. */
function segsOf(it){
  if(it.segs && it.segs.length) return it.segs;
  if(it.minutes || it.incline || it.speed){
    return [{ m:+it.minutes||0, i:+it.incline||0, s:+it.speed||0 }];
  }
  return [{ m:0, i:0, s:0 }];
}

function cardioMins(it){
  return segsOf(it).reduce(function(a,g){ return a + (+g.m||0); }, 0);
}

function cardioSummary(it){
  var segs = segsOf(it).filter(function(g){ return +g.m > 0; });
  if(!segs.length) return '';
  return segs.map(function(g){ return segLabel(it.name, g); }).join('  \u2192  ');
}

function loadAt(it, i){
  if(it.loads && it.loads[i]!==undefined && it.loads[i]!==null) return +it.loads[i]||0;
  return +it.weight||0;
}
function loadTotal(it, i){
  return loadAt(it, i) * (it.ps ? 2 : 1);
}
function topLoad(it){
  var m=0; (it.sets||[]).forEach(function(_,i){ m=Math.max(m, loadAt(it,i)); }); return m;
}
function migrate(){
  Object.keys(state.sessions||{}).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind==='cardio'||it.kind==='prep'||it.kind==='cool') return;
      if(it.kind==='hold'){ if(!it.eq) it.eq = guessEquip(it.name,0); return; }
      if(!it.loads) it.loads = (it.sets||[]).map(function(){ return +it.weight||0; });
      if(!it.eq) it.eq = guessEquip(it.name, topLoad(it));
      if(it.eq==='Bodyweight' && /back extension|hyperextension/i.test(it.name) && topLoad(it)>0){
        it.eq = 'Weight plate';
      }
    });
  });
}
function sessionStats(s){
  var sets=0, reps=0, vol=0;
  (s.items||[]).forEach(function(it){
    if(it.kind==='cardio'||it.kind==='prep'||it.kind==='cool') return;
    (it.sets||[]).forEach(function(r, i){
      if(+r > 0) sets++;                    // only count sets actually performed
      if(it.kind==='hold') return;
      reps += (+r||0); vol += (+r||0) * loadTotal(it, i);
    });
  });
  return {sets:sets, reps:reps, vol:vol};
}

/* ============ storage backends ============ */
/* Try the host's storage first; fall back to this browser's own storage;
   fall back again to memory-only. Whichever is live is reported in the header. */
var BACKEND = 'none';

function lsUsable(){
  try {
    var k = '__pl_probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch(e){ return false; }
}

function pickBackend(){
  if(window.storage && typeof window.storage.get === 'function') return 'host';
  if(lsUsable()) return 'local';
  return 'none';
}

function sget(key){
  if(BACKEND === 'host'){
    return window.storage.get(key).then(function(r){
      return (r && r.value) ? r.value : null;
    });
  }
  if(BACKEND === 'local'){
    try { return Promise.resolve(window.localStorage.getItem(key)); }
    catch(e){ return Promise.reject(e); }
  }
  return Promise.resolve(null);
}

function sset(key, val){
  if(BACKEND === 'host'){
    return window.storage.set(key, val).catch(function(e){
      // host storage is present but not working — demote once and keep the data
      if(lsUsable()){
        BACKEND = 'local';
        try { window.localStorage.setItem(key, val); return; } catch(e2){}
      }
      throw e;
    });
  }
  if(BACKEND === 'local'){
    try { window.localStorage.setItem(key, val); return Promise.resolve(); }
    catch(e){ return Promise.reject(e); }
  }
  return Promise.reject(new Error('no backend'));
}

function backendLabel(){
  if(BACKEND === 'host')  return 'Saving to Claude storage';
  if(BACKEND === 'local') return 'Saving to this browser';
  return 'Not saving — memory only';
}

/* ============ storage ============ */
/* Read result is one of: {ok:true,data} | {ok:true,empty:true} | {ok:false}
   A failed READ must never trigger a write, or a transient error overwrites good data. */
var pending = false, retryTimer = null, readOK = false;
var SNAPKEY = 'paramountlog:snaps';
var snaps = [];

function loadSnaps(){
  if(BACKEND === 'none') return Promise.resolve([]);
  return sget(SNAPKEY).then(function(v){
    if(v){ try { return JSON.parse(v)||[]; } catch(e){ return []; } }
    return [];
  }).catch(function(){ return []; });
}
function pushSnap(raw, label){
  if(!raw || BACKEND === 'none') return;
  if(snaps.length && snaps[0].raw === raw) return;      // unchanged, skip
  snaps.unshift({ t:Date.now(), label:label||'', raw:raw });
  snaps = snaps.slice(0,5);
  sset(SNAPKEY, JSON.stringify(snaps)).catch(function(){});
}

function load(){
  BACKEND = pickBackend();
  if(BACKEND === 'none') return Promise.resolve({ok:false, why:'nostore'});
  return sget(KEY).then(function(v){
    if(v){
      try { return {ok:true, data:JSON.parse(v)}; }
      catch(e){ return {ok:false, why:'corrupt'}; }
    }
    return {ok:true, empty:true};
  }).catch(function(e){
    var msg = String((e && e.message) || e || '');
    if(/not found|no such|missing|404/i.test(msg)) return {ok:true, empty:true};
    return {ok:false, why:'read'};
  });
}

function save(){
  if(!readOK) return;           // never write over data we failed to read
  pending = true;
  setStatus('unsaved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}

function flush(){
  clearTimeout(saveTimer);
  if(!pending || !readOK) return;
  if(BACKEND === 'none'){ setStatus('nostore'); return; }
  var payload;
  try { payload = JSON.stringify(state); } catch(e){ setStatus('error'); return; }
  pending = false;
  setStatus('saving');
  sset(KEY, payload).then(function(){
    setStatus('saved');
  }).catch(function(){
    pending = true;
    setStatus('error');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flush, 3000);
  });
}

function pad2(n){ return (n<10?'0':'')+n; }
function setStatus(k){
  var el = document.getElementById('sstat');
  if(!el) return;
  var d = new Date(), t = pad2(d.getHours())+':'+pad2(d.getMinutes());
  var map = {
    saved:   ['Saved '+t+' &middot; '+backendLabel(), 'ok'],
    saving:  ['Saving…', 'busy'],
    unsaved: ['Unsaved changes', 'busy'],
    error:   ['Save failed — retrying', 'bad'],
    nostore: ['Nothing is being saved — download a backup before you close', 'bad'],
    read:    ['Could not read saved data', 'bad']
  };
  var m = map[k] || map.saved;
  el.innerHTML = m[0];
  el.className = 'sstat ' + m[1];
}

/* flush before anything that could end the session */
window.addEventListener('pagehide', flush);
window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', function(){

/* ============ cycle tracking ============ */
/* Logging only. The evidence does not support prescribing training by cycle phase,
   so nothing here changes a single prescribed weight — it exists so patterns can be seen. */
function cycleStarts(){
  return Object.keys(state.sessions).filter(function(k){
    return state.sessions[k].periodStart; }).sort();
}

function avgCycleLength(){
  var st = cycleStarts();
  if(st.length < 2) return 28;
  var gaps = [];
  for(var i=1;i<st.length;i++){
    var g = Math.round((parseKey(st[i]) - parseKey(st[i-1])) / 86400000);
    if(g >= 18 && g <= 45) gaps.push(g);
  }
  if(!gaps.length) return 28;
  return Math.round(gaps.reduce(function(a,b){ return a+b; },0) / gaps.length);
}

function statedPhase(key){
  var s = state.sessions[key];
  return (s && s.phase) ? s.phase : '';
}

/* carry a stated phase forward for a few days, so one tap covers the days around it */
function phaseFor(key){
  var direct = statedPhase(key);
  if(direct) return { phase:direct, stated:true };
  var keys = Object.keys(state.sessions).filter(function(k){
    return k <= key && state.sessions[k].phase; }).sort();
  if(keys.length){
    var last = keys[keys.length-1];
    if(daysSince(last) - daysSince(key) <= 4){
      return { phase:state.sessions[last].phase, stated:true, from:last };
    }
  }
  var ci = cycleInfo(key);
  return ci ? { phase:ci.phase, stated:false, day:ci.day } : null;
}

function cycleInfo(key){
  var st = cycleStarts();
  if(!st.length) return null;
  var last = null;
  st.forEach(function(k){ if(k <= key) last = k; });
  if(!last) return null;
  var day = Math.round((parseKey(key) - parseKey(last)) / 86400000) + 1;
  var len = avgCycleLength();
  if(day > len + 12) return null;                  /* stale — probably just not logged */
  var phase;
  if(day <= 5) phase = 'Menstrual';
  else if(day <= Math.round(len*0.46)) phase = 'Follicular';
  else if(day <= Math.round(len*0.57)) phase = 'Ovulatory';
  else phase = 'Luteal';
  return { day:day, phase:phase, len:len, start:last };
}

var PHASES = ['Menstrual','Follicular','Ovulatory','Luteal'];

/* what her own numbers say, rather than what the internet says */
function phaseComparison(){
  var buckets = {};
  PHASES.forEach(function(p){ buckets[p] = { sessions:0, vol:0, sets:0 }; });
  var any = false;
  Object.keys(state.sessions).forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    if(!st.sets) return;
    var c = phaseFor(k);
    if(!c || !buckets[c.phase]) return;
    any = true;
    var b = buckets[c.phase];
    b.sessions++; b.vol += st.vol; b.sets += st.sets;
  });
  if(!any) return null;
  PHASES.forEach(function(p){
    var b = buckets[p];
    b.avgVol = b.sessions ? Math.round(b.vol / b.sessions) : 0;
    b.avgSets = b.sessions ? Math.round(b.sets / b.sessions) : 0;
  });
  return buckets;
}

/* ============ recovery ============ */
/* sleep is held as decimal hours but typed however feels natural: 7:13, 7h13, 7.2 or 7 */

function sleepH(dec){
  if(dec === '' || dec === null || dec === undefined || isNaN(+dec) || !+dec) return '';
  return Math.floor(Math.round(+dec * 60) / 60);
}
function sleepM(dec){
  if(dec === '' || dec === null || dec === undefined || isNaN(+dec) || !+dec) return '';
  return Math.round(+dec * 60) % 60;
}

function recoveryVerdict(s){
  var sl = +s.sleep || 0, rd = +s.ready || 0;
  if(!sl && !rd) return null;
  if((rd && rd < 65) || (sl && sl < 6)){
    return { warn:true, text:'Short on recovery. Keep the loads where they were, cut a set from the '
      + 'accessories, and let the walk do the extra work. Pushing for a record today costs more than it buys.' };
  }
  if((rd && rd >= 85) || (sl && sl >= 8)){
    return { warn:false, text:'Well recovered. This is the day to go after a heavier top set.' };
  }
  return { warn:false, text:'Normal recovery. Train as planned and let the numbers decide.' };
}

function recoveryMode(){
  var keys = Object.keys(state.sessions).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var s = state.sessions[keys[i]];
    if(s.sleep || s.ready){
      if(daysSince(keys[i]) > 1) return null;
      if((+s.ready && +s.ready < 65) || (+s.sleep && +s.sleep < 6)) return 'low';
      if((+s.ready && +s.ready >= 85) || (+s.sleep && +s.sleep >= 8)) return 'high';
      return 'normal';
    }
  }
  return null;
}

var COMPOUND = {vpull:1,hpull:1,hpress:1,vpress:1,legpress:1,squat:1,lunge:1,hinge:1,pushup:1};
/* the movements that genuinely deserve to go first */
var OPENERS = ['Lat pull down','Wide grip lat pull down','Close grip lat pull down','Pull up','Assisted pull up',

var ORDER_RULE = 'Big movements first, small ones after, core near the end and walking last. '
  + 'Compound lifts need the most co-ordination and the freshest you, and tiring the small muscles early '
  + 'means they give out before the big ones get their work.';

function regionOf(name){
  var m = MUSCLES[moveKey(name)];
  return m && m.p.length ? (REGION[m.p[0]] || 'Other') : 'Other';
}

function nextUp(sess){
  var t = muscleTally(sess), reg = t.regions;
  var items = (sess.items||[]);
  var doneNames = {}, lastLift = null, nCompound = 0, nIso = 0, nCore = 0, nLift = 0;

  items.forEach(function(it){
    doneNames[it.name.toLowerCase()] = 1;
    var k = moveKey(it.name);
    if(it.kind === 'cardio' || it.kind === 'prep' || it.kind === 'cool') return;
    nLift++;
    if(COMPOUND[k]) nCompound++;
    if(ISO[k]) nIso++;
    if(CORE_K[k]) nCore++;
    lastLift = k;
  });

  var back = recentBack();
  var guard = (back === 'Achy' || back === 'Sore');
  var tenDay = groupTally(10);

  /* only suggest from the curated list — custom one-off names make poor recommendations */
  var pool = LIBRARY.filter(function(n){
    return MUSCLES[moveKey(n)] && !doneNames[n.toLowerCase()]
      && guessKind(n) !== 'hold' && !isHidden(n);
  });

  var scored = [];
  pool.forEach(function(n){
    var k = moveKey(n), r = regionOf(n), sc = 0;
    var lastR = lastLift && MUSCLES[lastLift] ? (REGION[MUSCLES[lastLift].p[0]] || '') : '';
    var todayVol = reg[r] || 0;
    var isOpener = OPENERS.indexOf(n) > -1;
    var lateOnly = LATE_ONLY.indexOf(n) > -1;
    var reasons = [];

    if(k === 'walk'){
      if(nLift < 4) return;
      scored.push({ n:n, k:k, r:r, sc:40,
        why:'Finish on the treadmill \u2014 cardio belongs after the weights, not before.' });
      return;
    }

    /* --- scoring --- */
    if(lateOnly && nLift < 2) sc -= 30;

    if(COMPOUND[k] && isOpener)      sc += (nCompound < 2) ? 36 : 12;
    else if(COMPOUND[k])             sc += (nCompound < 2) ? 16 : 10;
    else if(CORE_K[k]){ if(nLift < 3) return; sc += 26; }
    else                             sc += (nCompound >= 1) ? 24 : 6;

    if(todayVol === 0)      sc += 22;
    else if(todayVol < 4)   sc += 8;
    else                    sc -= 12;

    if(lastR && r === lastR) sc += (todayVol >= 6) ? -18 : 4;

    var PUSH_REG = ['Chest','Shoulders'], PULL_REG = ['Back'];
    var opposing = (PUSH_REG.indexOf(lastR) > -1 && PULL_REG.indexOf(r) > -1)
                || (PULL_REG.indexOf(lastR) > -1 && PUSH_REG.indexOf(r) > -1);
    if(opposing) sc += 14;

    var gm = { Back:'Back', Chest:'Chest', Shoulders:'Shoulders', Arms:'Arms',
               Legs:'Legs', Glutes:'Glutes & hams', Hamstrings:'Glutes & hams', Core:'Core' }[r];
    var vol10 = gm ? (tenDay[gm] || 0) : 99;
    if(gm) sc += Math.max(0, 18 - vol10 * 2);

    if(guard && (k === 'hinge' || k === 'squat' || k === 'rollout' || k === 'core')) sc -= 40;

    var p = prescribe(n, 'steady');
    if(prevAny(n, shiftKey(todayKey(), 1))) sc += 10; else sc -= 4;
    if(p.load) sc += 6;                       /* a known weight beats a guess */

    /* --- the reason, chosen by what matters most at this point --- */
    var why;
    if(opposing){
      why = (PULL_REG.indexOf(r) > -1)
        ? 'You have just pressed \u2014 pulling next balances the shoulder and lets the chest recover.'
        : 'You have just pulled \u2014 pressing next works the opposite side while your back rests.';
    } else if(CORE_K[k]){
      why = 'Core work belongs near the end, so it does not tire your trunk before the loaded lifts.';
    } else if(todayVol === 0 && nLift >= 1){
      why = 'Nothing today has touched your ' + r.toLowerCase() + ' yet.';
    } else if(nLift <= 2 && isOpener){
      why = 'A big movement while you are still fresh \u2014 these deserve your best effort.';
    } else if(vol10 <= 2){
      why = 'Your ' + r.toLowerCase() + ' had almost nothing in the last fortnight.';
    } else if(COMPOUND[k]){
      why = 'A solid compound choice for what you have left.';
    } else {
      why = 'Rounds out the ' + r.toLowerCase() + ' work you have started.';
    }

    scored.push({ n:n, k:k, r:r, sc:sc, why:why, p:p });
  });

  scored.sort(function(a,b){ return b.sc - a.sc || a.n.localeCompare(b.n); });

  /* three genuinely different options, not three rows */
  var out = [], seenRegion = {};
  function take(c){
    var p = c.p || prescribe(c.n, 'steady');
    out.push({
      name: c.n, region: c.r, why: c.why,
      dose: (COMPOUND[c.k] ? '3 \u00d7 8-12' : (CORE_K[c.k] ? '3 \u00d7 30-45 sec' : '3 \u00d7 10-15'))
            + (p.load ? ' @ ' + p.load + ' lb'
               : (p.load === 0 ? ' @ bodyweight' : ' \u2014 find your weight')),
      load: p.load, note: p.why
    });
  }
  scored.forEach(function(c){
    if(out.length >= 3 || seenRegion[c.r]) return;
    seenRegion[c.r] = 1; take(c);
  });
  scored.forEach(function(c){                 /* top up if the pool was thin */
    if(out.length >= 3) return;
    if(out.some(function(o){ return o.name === c.n; })) return;
    take(c);
  });

  var stage = !nLift ? 'Start of the session'
    : (nLift <= 2 ? 'Still early \u2014 big movements first'
    : (nLift <= 5 ? 'Middle of the session' : 'Towards the end'));

  return { list: out, stage: stage, guard: guard,
           done: nLift, compounds: nCompound, iso: nIso, core: nCore };
}

/* ============ overview, streaks, milestones ============ */
function dataSpanDays(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return sessionStats(state.sessions[k]).sets; }).sort();
  if(!keys.length) return 0;
  return Math.round((parseKey(todayKey()) - parseKey(keys[0])) / 86400000) + 1;
}

var RANGES = [
  { d:28,  label:'4 weeks',   need:0   },
  { d:90,  label:'3 months',  need:42  },
  { d:365, label:'12 months', need:140 }
];

function overviewStats(days){
  var cutoff = shiftKey(todayKey(), -(days-1));
  var out = { sessions:0, sets:0, vol:0, cardio:0, prs:0, groups:{}, weeks:{}, bwFrom:0, bwTo:0, trainer:0 };
  GROUPS.forEach(function(g){ out.groups[g] = 0; });

  Object.keys(state.sessions).sort().forEach(function(k){
    if(k < cutoff) return;
    var s = state.sessions[k], st = sessionStats(s);
    if(s.bw){ if(!out.bwFrom) out.bwFrom = +s.bw; out.bwTo = +s.bw; }
    if(!st.sets) return;
    out.sessions++; out.sets += st.sets; out.vol += st.vol;
    out.weeks[weekKey(k)] = (out.weeks[weekKey(k)] || 0) + 1;
    if(s.mode === 'trainer') out.trainer++;
    (s.items||[]).forEach(function(it){
      if(it.kind === 'cardio'){ out.cardio += cardioMins(it); return; }
      if(it.kind === 'prep' || it.kind === 'cool') return;
      if(isPR(it, k)) out.prs++;
      var g = GROUP_OF[moveKey(it.name)];
      if(!g || g === 'Cardio') return;
      (it.sets||[]).forEach(function(r){ if(+r>0) out.groups[g]++; });
    });
  });

  var span = Math.min(days, dataSpanDays() || days);
  var possibleWeeks = Math.max(1, Math.ceil(span/7));
  out.activeWeeks = Object.keys(out.weeks).length;
  out.consistency = Math.round(out.activeWeeks / possibleWeeks * 100);
  out.perWeek = out.activeWeeks ? Math.round(out.sessions / out.activeWeeks * 10)/10 : 0;
  return out;
}

/* Weeks, not days. A streak you can only keep by training through pain
   is a streak that will eventually hurt you. Rest days never break this. */
var STREAK_TARGET = 2;

function weekStreak(){
  var counts = {};
  Object.keys(state.sessions).forEach(function(k){
    if(sessionStats(state.sessions[k]).sets) counts[weekKey(k)] = (counts[weekKey(k)]||0) + 1;
  });
  var cursor = weekKey(todayKey()), current = 0, i;
  /* this week still counts as live if it is not finished yet */
  if((counts[cursor]||0) >= STREAK_TARGET){ current = 1; cursor = shiftKey(cursor, -7); }
  else cursor = shiftKey(cursor, -7);
  for(i=0;i<520;i++){
    if((counts[cursor]||0) >= STREAK_TARGET){ current++; cursor = shiftKey(cursor, -7); }
    else break;
  }
  var keys = Object.keys(counts).sort(), best = 0, run = 0, prev = null;
  keys.forEach(function(k){
    if(counts[k] < STREAK_TARGET){ run = 0; prev = k; return; }
    run = (prev && shiftKey(prev, 7) === k) ? run + 1 : 1;
    if(run > best) best = run;
    prev = k;
  });
  return { current:current, best:Math.max(best, current), target:STREAK_TARGET,
           thisWeek: counts[weekKey(todayKey())] || 0 };
}

function totalStats(){
  var t = { sessions:0, sets:0, vol:0, cardio:0, prs:0, backChecks:0, deloads:0, weeks:{} };
  Object.keys(state.sessions).forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    if(s.back) t.backChecks++;
    if(s.deload) t.deloads++;
    if(!st.sets) return;
    t.sessions++; t.sets += st.sets; t.vol += st.vol;
    t.weeks[weekKey(k)] = 1;
    (s.items||[]).forEach(function(it){
      if(it.kind === 'cardio'){ t.cardio += cardioMins(it); return; }
      if(it.kind === 'prep' || it.kind === 'cool') return;
      if(isPR(it, k)) t.prs++;
    });
  });
  return t;
}

/* ============ assistance vs resistance ============ */
/* On an assisted pull-up or dip the stack carries you: more weight is easier,
   so progress runs downwards. Everything that judges "better" has to know. */
function isAssisted(name){
  return /assisted|counterweight|band assisted/i.test(name || '');
}

function betterLoad(name, a, b){        /* is a better than b? */
  return isAssisted(name) ? (a < b) : (a > b);
}

/* ============ cardio machines ============ */
/* Each machine reports what it reports. A rower has no incline and a
   stairmaster has no mph, so asking for them just invites nonsense. */
var MACHINE_FIELDS = {
  treadmill: [
    { k:'m',   label:'Min',   step:'decimal' },
    { k:'i',   label:'Incl %',step:'decimal' },
    { k:'s',   label:'Mph',   step:'decimal' }
  ],
  stair: [
    { k:'m',   label:'Min',   step:'decimal' },
    { k:'lvl', label:'Level', step:'numeric' },
    { k:'spm', label:'Steps/min', step:'numeric' }
  ],
  row: [
    { k:'m',   label:'Min',   step:'decimal' },
    { k:'dist',label:'Metres',step:'numeric' },
    { k:'split',label:'/500m', step:'text' },
    { k:'spm', label:'S/min', step:'numeric' }
  ],
  bike: [
    { k:'m',   label:'Min',   step:'decimal' },
    { k:'lvl', label:'Level', step:'numeric' },
    { k:'rpm', label:'RPM',   step:'numeric' }
  ],
  generic: [
    { k:'m',   label:'Min',   step:'decimal' },
    { k:'lvl', label:'Level', step:'numeric' }
  ]
};

function machineType(name){
  var n = (name||'').toLowerCase();
  if(/tread|incline walk|walk|run/.test(n)) return 'treadmill';
  if(/stair/.test(n)) return 'stair';
  if(/row/.test(n)) return 'row';
  if(/bike|cycle|spin/.test(n)) return 'bike';
  return 'generic';
}

function machineFields(name){
  return MACHINE_FIELDS[machineType(name)] || MACHINE_FIELDS.generic;
}

function segLabel(name, g){
  var out = [], t = machineType(name);
  if(+g.m) out.push((+g.m) + ' min');
  if(t === 'treadmill'){
    if(+g.i) out.push(g.i + '% incline');
    if(+g.s) out.push(g.s + ' mph');
  } else if(t === 'stair'){
    if(+g.lvl) out.push('level ' + g.lvl);
    if(+g.spm) out.push(g.spm + ' steps/min');
  } else if(t === 'row'){
    if(+g.dist) out.push(g.dist + ' m');
    if(g.split) out.push(g.split + ' /500m');
    if(+g.spm) out.push(g.spm + ' s/min');
  } else if(t === 'bike'){
    if(+g.lvl) out.push('level ' + g.lvl);
    if(+g.rpm) out.push(g.rpm + ' rpm');
  } else if(+g.lvl){
    out.push('level ' + g.lvl);
  }
  return out.join(' \u00b7 ');
}

/* ============ hybrid movements ============ */
/* "Kneeling Pallof press to overhead press" is two jobs in one rep. Split the
   name on the joining word and count both halves. */
function hybridParts(name){
  var raw = String(name || '');
  var parts = raw.split(/\s+(?:to|into|\+|then|\/|&)\s+/i).map(function(x){ return x.trim(); })
                 .filter(function(x){ return x.length > 2; });
  return parts.length > 1 ? parts : null;
}

function hybridKeys(name){
  var parts = hybridParts(name);
  if(!parts) return null;
  var keys = parts.map(function(p){ return moveKey(p); }).filter(Boolean);
  var uniq = keys.filter(function(v,i,a){ return a.indexOf(v) === i; });
  return uniq.length > 1 ? uniq : null;
}

/* ============ exercise library ============ */
function isHidden(name){
  return !!(state.hidden && state.hidden[name.toLowerCase()]);
}
function setHidden(name, on){
  state.hidden = state.hidden || {};
  if(on) state.hidden[name.toLowerCase()] = 1;
  else delete state.hidden[name.toLowerCase()];
}

function allExercises(){
  var seen = {}, out = [];
  function add(n){
    if(!n || seen[n.toLowerCase()]) return;
    seen[n.toLowerCase()] = 1; out.push(n);
  }
  LIBRARY.forEach(add);
  Object.keys(POOLS).forEach(function(f){ POOLS[f].forEach(function(x){ add(x.n); }); });
  Object.keys(state.sessions||{}).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind !== 'prep' && it.kind !== 'cool') add(it.name);
    });
  });
  return out;
}

function musclesFor(name){
  var keys = hybridKeys(name) || [moveKey(name)].filter(Boolean);
  var prim = [], sec = [];
  keys.forEach(function(k){
    var m = MUSCLES[k];
    if(!m) return;
    m.p.forEach(function(x){ if(prim.indexOf(x) < 0) prim.push(x); });
    (m.s||[]).forEach(function(x){ if(sec.indexOf(x) < 0) sec.push(x); });
  });
  sec = sec.filter(function(x){ return prim.indexOf(x) < 0; });
  return { primary:prim, secondary:sec, keys:keys };
}

/* Which training day an exercise belongs to, and every session type it can appear in. */
var DAY_OF_KEY = {
  wu_bridge:'Legs', wu_legswing:'Legs', wu_catcow:'Core', wu_armcircle:'Push',
  wu_pullapart:'Pull', wu_wallpush:'Push',
  vpull:'Pull', hpull:'Pull', curl:'Pull',
  hpress:'Push', fly:'Push', pushup:'Push', vpress:'Push', raise:'Push', tri:'Push',
  squat:'Legs', legpress:'Legs', legext:'Legs', lunge:'Legs', calf:'Legs',
  hinge:'Legs', legcurl:'Legs', abduction:'Legs',
  plank:'Core', core:'Core', rollout:'Core',
  walk:'Cardio'
};

function dayGroupOf(name){
  if(guessKind(name) === 'cardio') return 'Cardio';
  var keys = hybridKeys(name) || [moveKey(name)].filter(Boolean);
  for(var i=0;i<keys.length;i++){ if(DAY_OF_KEY[keys[i]]) return DAY_OF_KEY[keys[i]]; }
  return 'Other';
}

function dayTags(name){
  var g = dayGroupOf(name);
  if(g === 'Pull')   return ['Pull','Upper','Full'];
  if(g === 'Push')   return ['Push','Upper','Full'];
  if(g === 'Legs')   return ['Legs','Lower','Full'];
  if(g === 'Core')   return ['Core','Cardio','Full'];
  if(g === 'Cardio') return ['Cardio'];
  return ['Full'];
}

function libraryByDay(){
  var groups = {};
  allExercises().forEach(function(n){
    var g = dayGroupOf(n);
    (groups[g] = groups[g] || []).push({ name:n, muscles:musclesFor(n), tags:dayTags(n) });
  });
  Object.keys(groups).forEach(function(g){
    groups[g].sort(function(a,b){ return a.name.localeCompare(b.name); });
  });
  return groups;
}

/* ============ week planner ============ */
function weekDays(startKey){
  var out = [];
  for(var i=0;i<7;i++) out.push(shiftKey(startKey, i));
  return out;
}

function dayMix(days){
  var mix = { rest:0, trainer:0, solo:0, empty:0, cardio:0, strength:0 };
  days.forEach(function(k){
    var s = state.sessions[k];
    if(!s || (!(s.items||[]).length && s.mode !== 'rest')){ mix.empty++; return; }
    if(s.mode === 'rest'){ mix.rest++; return; }
    if(s.mode === 'trainer') mix.trainer++; else mix.solo++;
    if(sessionCategory(k) === 'cardio') mix.cardio++;
    else if(sessionCategory(k) === 'strength') mix.strength++;
  });
  return mix;
}

function mixOver(days){
  var cut = shiftKey(todayKey(), -(days-1));
  var mix = { rest:0, trainer:0, solo:0, cardio:0, strength:0 };
  Object.keys(state.sessions).forEach(function(k){
    if(k < cut || k > todayKey()) return;
    var s = state.sessions[k];
    if(s.mode === 'rest'){ mix.rest++; return; }
    if(!(s.items||[]).length) return;
    if(s.mode === 'trainer') mix.trainer++; else mix.solo++;
    var c = sessionCategory(k);
    if(c === 'cardio') mix.cardio++; else if(c === 'strength') mix.strength++;
  });
  return mix;
}

/* ============ sharing with a trainer ============ */
function shareKeyFrom(days){ return shiftKey(todayKey(), -(days-1)); }

function shareText(fromKey, toKey){
  var L = [], keys = Object.keys(state.sessions).sort()
    .filter(function(k){ return k >= fromKey && k <= toKey && (state.sessions[k].items||[]).length; });
  L.push('TRAINING LOG  ' + fmtShort(fromKey) + ' to ' + fmtShort(toKey));
  L.push('');
  keys.forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    L.push(fmtShort(k).toUpperCase() + '  \u00b7  ' + sessionLabel(s)
      + (s.mode === 'trainer' ? '  (with trainer)' : '')
      + (s.deload ? '  (deload)' : ''));
    (s.items||[]).forEach(function(it){
      if(it.kind === 'prep' || it.kind === 'cool') return;
      if(it.kind === 'cardio'){
        L.push('   ' + it.name + ' \u2014 ' + (cardioSummary(it) || 'not recorded'));
        return;
      }
      var done = (it.sets||[]).map(function(r,i){ return { r:+r||0, l:loadAt(it,i) }; })
                              .filter(function(x){ return x.r > 0; });
      if(!done.length) return;
      var loads = done.map(function(x){ return x.l; });
      var same = loads.every(function(l){ return l === loads[0]; });
      var body = same
        ? done.map(function(x){ return x.r; }).join(', ')
          + (loads[0] ? '  @ ' + loads[0] + ' lb' + (it.ps ? '/side' : '') : '  bodyweight')
        : done.map(function(x){ return x.r + '@' + (x.l || 'BW'); }).join(', ');
      L.push('   ' + it.name + (it.eq ? ' (' + it.eq + ')' : '') + ' \u2014 '
        + (it.kind === 'hold' ? body + ' sec' : body)
        + (it.ss ? '  [superset ' + it.ss + ']' : ''));
      if(it.setup) L.push('      setup: ' + it.setup);
      if(it.note)  L.push('      note: ' + it.note);
    });
    L.push('   ' + st.sets + ' working sets \u00b7 ' + st.reps + ' reps'
      + (st.vol ? ' \u00b7 ' + st.vol.toLocaleString() + ' lb' : ''));
    if(s.back) L.push('   back felt: ' + s.back);
    L.push('');
  });
  if(!keys.length) L.push('(nothing logged in this range)');
  return L.join('\n');
}

/* ============ machine setup memory ============ */
function lastSetup(name, beforeKey){
  var keys = Object.keys(state.sessions).filter(function(k){ return k <= beforeKey; }).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var items = state.sessions[keys[i]].items || [];
    for(var j=0;j<items.length;j++){
      if(items[j].name === name && items[j].setup) return { k:keys[i], v:items[j].setup };
    }
  }
  return null;
}

/* ============ body measurements ============ */
function bodyLog(){
  var out = [];
  Object.keys(state.sessions).sort().forEach(function(k){
    var s = state.sessions[k];
    if(s.bw || s.waist || s.hips) out.push({ k:k, bw:+s.bw||0, waist:+s.waist||0, hips:+s.hips||0 });
  });
  return out;
}

/* scale weight swings daily; only the trend means anything */
function bodyTrend(){
  var log = bodyLog().filter(function(x){ return x.bw; });
  if(log.length < 2) return null;
  var smooth = log.map(function(x, i){
    var win = log.slice(Math.max(0, i-6), i+1);
    return { k:x.k, v: win.reduce(function(a,b){ return a+b.bw; },0) / win.length };
  });
  var first = smooth[0], last = smooth[smooth.length-1];
  var days = Math.max(1, Math.round((parseKey(last.k) - parseKey(first.k)) / 86400000));
  var perWeek = (last.v - first.v) / days * 7;
  return { n:log.length, from:first.v, to:last.v, days:days, perWeek:perWeek,
           latest:log[log.length-1] };
}

function bodyVerdict(){
  var t = bodyTrend();
  if(!t) return null;
  if(t.days < 14) return { text:'Keep logging. Two weeks of readings is the minimum before a trend means anything.', tone:'flat' };
  var r = t.perWeek;
  if(r <= -1.6) return { text:'Dropping about ' + Math.abs(r).toFixed(1) + ' lb a week. That is faster than ideal — at this rate you start losing muscle alongside the fat. Eat a little more.', tone:'warn' };
  if(r <= -0.4) return { text:'Down about ' + Math.abs(r).toFixed(1) + ' lb a week. That is the right pace: fat comes off, strength stays.', tone:'good' };
  if(r < 0.4) return { text:'Holding steady. If the scale is flat but your lifts are climbing, that is recomposition and it counts.', tone:'flat' };
  return { text:'Up about ' + r.toFixed(1) + ' lb a week. Worth a look at portions, though a jump after a heavy or salty day is usually water.', tone:'warn' };
}

/* ============ deload ============ */
function trainingWeeks(){
  var weeks = {}, out = 0;
  Object.keys(state.sessions).forEach(function(k){
    if(sessionStats(state.sessions[k]).sets) weeks[weekKey(k)] = 1;
  });
  var cursor = weekKey(todayKey());
  for(var i=0;i<20;i++){
    if(!weeks[cursor]) break;
    out++; cursor = shiftKey(cursor, -7);
  }
  return out;
}

function lastDeload(){
  var found = null;
  Object.keys(state.sessions).sort().reverse().forEach(function(k){
    if(!found && state.sessions[k].deload) found = k;
  });
  return found;
}

function deloadStatus(){
  var run = trainingWeeks();
  var last = lastDeload();
  var since = last ? Math.floor(daysSince(last)/7) : null;
  var due = run >= 6 || (since !== null && since >= 8);
  return { run:run, last:last, since:since, due:due,
    text: due
      ? 'You have trained ' + run + ' weeks straight. A lighter week now is not lost ground — it is when the adaptations actually land, and it is the cheapest way to avoid the flare you are trying to dodge.'
      : (run >= 4
          ? run + ' weeks in. Plan an easier week after week six.'
          : run + ' week' + (run===1?'':'s') + ' of consistent training.') };
}

/* ============ session quality analysis ============ */
/* Reads how each exercise actually went, not just whether the number went up.
   Loads are only ever compared against the same exercise — a 30 lb cable curl
   and a 15 lb preacher curl are different machines, not progress or regress. */
function analyseExercise(it, key){
  var done = (it.sets||[]).map(function(r,i){ return { r:+r||0, l:loadAt(it,i) }; })
                          .filter(function(x){ return x.r > 0; });
  if(!done.length) return null;

  var reps = done.map(function(x){ return x.r; });
  var first = reps[0], last = reps[reps.length-1];
  var top = Math.max.apply(null, reps), low = Math.min.apply(null, reps);
  var drop = first ? Math.round((first - last) / first * 100) : 0;
  var loads = done.map(function(x){ return x.l; });
  var loadVaried = loads.some(function(l){ return l !== loads[0]; });

  /* show the load per set when it changed during the exercise */
  var display = loadVaried
    ? done.map(function(x){ return x.r + (x.l ? '@' + x.l : ''); }).join(', ')
      + (loads.some(function(l){ return l; }) ? ' lb' : '')
    : reps.join(', ') + (loads[0] ? ' @ ' + loads[0] + ' lb' : ' bodyweight');

  var verdict, tag;
  if(done.length === 1){
    verdict = 'Only one set logged. One hard set is better than none, but two or three is where the work is.';
    tag = 'thin';
  } else if(low >= 14){
    verdict = 'Every set finished at ' + low + '+ reps without slowing down. That is endurance work rather than strength work — the weight is too light to be challenging.';
    tag = 'light';
  } else if(last >= 14 && drop <= 10){
    verdict = 'You finished as strong as you started, ' + last + ' reps on the last set. Nothing was left on the table because nothing was asked of you — add weight.';
    tag = 'light';
  } else if(drop <= 8 && top <= 13){
    verdict = 'Reps held steady at ' + reps.join(', ') + '. Well-judged weight — you were working, and nothing fell apart.';
    tag = 'good';
  } else if(drop >= 35){
    verdict = 'Reps fell sharply, ' + first + ' down to ' + last + '. Either the first set was too ambitious or you were not resting long enough between them.';
    tag = 'fatigue';
  } else if(drop > 8){
    verdict = 'A natural slide from ' + first + ' to ' + last + ' reps. That is honest fatigue and exactly what a working set should look like.';
    tag = 'good';
  } else if(loadVaried){
    verdict = 'You adjusted the weight mid-exercise rather than grinding through. Good judgement.';
    tag = 'good';
  } else {
    verdict = 'Reps ' + reps.join(', ') + '.';
    tag = 'ok';
  }
  return { name:it.name, sets:done.length, reps:reps, topLoad:Math.max.apply(null, loads),
           display:display, varied:loadVaried, verdict:verdict, tag:tag, eq:it.eq || '' };
}

/* how this exercise has moved over its own history */
function trendFor(name, key){
  var pts = [];
  Object.keys(state.sessions).sort().forEach(function(k){
    if(k > key) return;
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.name !== name || it.kind === 'cardio' || it.kind === 'prep' || it.kind === 'cool') return;
      var done = (it.sets||[]).map(function(r,i){ return { r:+r||0, l:loadAt(it,i) }; })
                              .filter(function(x){ return x.r>0; });
      if(!done.length) return;
      var L = Math.max.apply(null, done.map(function(x){ return x.l; }));
      var vol = done.reduce(function(a,x){ return a + x.r * (x.l || 1); }, 0);
      pts.push({ k:k, load:L, vol:vol });
    });
  });
  if(pts.length < 3) return null;
  var recent = pts.slice(-3);
  var firstL = recent[0].load, lastL = recent[recent.length-1].load;
  if(lastL > firstL) return { dir:'up', from:firstL, to:lastL, n:pts.length };
  if(lastL < firstL) return { dir:'down', from:firstL, to:lastL, n:pts.length };
  return { dir:'flat', at:lastL, n:pts.length };
}

function sessionNarrative(key){
  var s = session(key);
  var per = [], light = [], stalled = [], strong = [], thin = [];
  (s.items||[]).forEach(function(it){
    if(it.kind === 'cardio' || it.kind === 'prep' || it.kind === 'cool' || it.kind === 'hold') return;
    var a = analyseExercise(it, key);
    if(!a) return;
    a.trend = trendFor(it.name, key);
    per.push(a);
    if(a.tag === 'light') light.push(a.name);
    if(a.tag === 'thin') thin.push(a.name);
    if(a.tag === 'good') strong.push(a.name);
    if(a.trend && a.trend.dir === 'flat' && a.trend.n >= 3) stalled.push(a.name + ' (3 sessions at ' + a.trend.at + ' lb)');
  });
  return { per:per, light:light, stalled:stalled, strong:strong, thin:thin };
}

/* ============ session review ============ */
function reviewSession(key){
  var s = session(key), st = sessionStats(s);
  var out = { stats:st, prs:[], up:[], down:[], stuck:[], notes:[], next:[], cardio:0, holds:0, missing:[] };

  var prevSame = null;
  Object.keys(state.sessions).sort().reverse().forEach(function(k){
    if(prevSame || k >= key) return;
    if(state.sessions[k].type === s.type && (state.sessions[k].items||[]).length) prevSame = k;
  });

  (s.items||[]).forEach(function(it){
    if(it.kind === 'cardio'){ out.cardio += cardioMins(it); return; }
    var done = (it.sets||[]).filter(function(r){ return +r>0; });
    if(!done.length){ out.missing.push(it.name); return; }
    if(it.kind === 'hold'){ out.holds += done.length; return; }

    var pr = isPR(it, key);
    if(pr) out.prs.push({ name:it.name, what:pr });

    var prev = prevPerformance(it.name, key);
    if(!prev) return;
    var oldL = topLoad(prev.it), newL = topLoad(it);
    var oldR = 0, newR = 0;
    (prev.it.sets||[]).forEach(function(r,i){ if(loadAt(prev.it,i)===oldL && +r>oldR) oldR = +r; });
    (it.sets||[]).forEach(function(r,i){ if(loadAt(it,i)===newL && +r>newR) newR = +r; });

    if(newL > oldL) out.up.push(it.name+' '+oldL+' → '+newL+' lb');
    else if(newL < oldL) out.down.push(it.name+' dropped from '+oldL+' to '+newL+' lb');
    else if(newR > oldR) out.up.push(it.name+' same weight, '+oldR+' → '+newR+' reps');
    else if(newR < oldR) out.down.push(it.name+' '+oldR+' → '+newR+' reps at '+(newL||'bodyweight')+(newL?' lb':''));
    else out.stuck.push(it.name);

    /* ready for more? */
    var allTop = done.length >= 2 && done.every(function(r){ return +r >= 14; });
    if(allTop && newL){
      var step = (newL < 25) ? 2.5 : increment(it.eq || guessEquip(it.name, newL));
      out.next.push(it.name+' → '+(newL+step)+' lb next time; '+done.join(', ')+' reps was comfortable');
    } else if(allTop){
      out.next.push(it.name+' → add resistance or slow the tempo; bodyweight is no longer challenging');
    }
  });

  if(prevSame){
    var pst = sessionStats(state.sessions[prevSame]);
    out.vs = { k:prevSame, sets:st.sets - pst.sets, vol:st.vol - pst.vol,
               pct: pst.vol ? Math.round((st.vol - pst.vol)/pst.vol*100) : null };
  }

  var tally = groupTally(14);
  var peak = Math.max.apply(null, GROUPS.map(function(g){ return tally[g]; }).concat([1]));
  out.starved = GROUPS.filter(function(g){ return tally[g] < peak*0.34; });
  out.nextFocus = pickFocus();
  out.back = s.back || '';
  return out;
}

  }

  var focus = [];

  }

  if(!r.back) recs.push('Set the back check for today while it is fresh — that record is what makes a flare readable afterwards.');

  recs.push('Next session, the app would pick ' + r.nextFocus + '.');

  h += '<div class="rvblock rec"><h4>For next time</h4><ul>';
  recs.forEach(function(t){ h += '<li>'+esc(t)+'</li>'; });
  h += '</ul></div>';

  h += '<button class="btn btn-ghost btn-wide" data-act="rvsave" data-k="'+key+'">Save this to coach notes</button>';
  h += '</div>';
  return h;
}

/* ============ history lookups, PRs, timers ============ */
function prevPerformance(name, beforeKey){
  var keys = Object.keys(state.sessions).filter(function(k){ return k < beforeKey; }).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var items = state.sessions[keys[i]].items || [];
    for(var j=0;j<items.length;j++){
      var it = items[j];
      if(it.name === name && (it.sets||[]).some(function(r){ return +r>0; })){
        return { k:keys[i], it:it };
      }
    }
  }
  return null;
}

function summarise(it){
  if(it.kind === 'cardio'){
    return cardioSummary(it) || '—';
  }
  var parts = [], loads = [];
  (it.sets||[]).forEach(function(r,i){
    if(+r<=0) return;
    parts.push(r);
    loads.push(loadAt(it,i));
  });
  if(!parts.length) return '—';
  var uniq = loads.filter(function(v,i,a){ return a.indexOf(v)===i; });
  var head = (uniq.length===1)
      ? (uniq[0] ? uniq[0]+' lb'+(it.ps?'/side':'')+' × ' : '')
      : '';
  if(uniq.length > 1){
    return parts.map(function(r,i){ return (loads[i]||'BW')+'×'+r; }).join(', ');
  }
  return head + parts.join(', ') + (it.kind==='hold' ? ' sec' : '');
}

function bestEver(name, beforeKey){
  var best = { load:0, reps:0 };
  Object.keys(state.sessions).forEach(function(k){
    if(beforeKey && k >= beforeKey) return;
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.name !== name || it.kind === 'cardio' || it.kind === 'prep' || it.kind === 'cool') return;
      (it.sets||[]).forEach(function(r,i){
        if(+r<=0) return;
        var L = loadAt(it,i);
        if(!best.reps || betterLoad(name, L, best.load) || (L === best.load && +r > best.reps)){
          if(betterLoad(name, L, best.load) || !best.reps) best = { load:L, reps:+r };
          else best.reps = +r;
        }
      });
    });
  });
  return best;
}

function isPR(it, key){
  if(it.kind === 'cardio') return false;
  var prior = bestEver(it.name, key);
  if(!prior.load && !prior.reps) return false;
  var now = { load:0, reps:0 };
  (it.sets||[]).forEach(function(r,i){
    if(+r<=0) return;
    var L = loadAt(it,i);
    if(!now.reps || betterLoad(it.name, L, now.load) || (L === now.load && +r > now.reps)){
      if(betterLoad(it.name, L, now.load) || !now.reps) now = { load:L, reps:+r }; else now.reps = +r;
    }
  });
  if(!now.reps) return false;
  if(betterLoad(it.name, now.load, prior.load)){
    return isAssisted(it.name) ? 'least assistance yet' : 'heaviest yet';
  }
  if(now.load === prior.load && now.reps > prior.reps) return 'most reps at '+(now.load||'bodyweight')+(now.load?' lb':'');
  return false;
}

/* ---- hold timer (counts up, writes the result into the set) ---- */
var hold = null;        // { id, i, start }
var holdTick = null;

function holdElapsed(){
  return hold ? Math.round((Date.now() - hold.start)/1000) : 0;
}
function startHold(id, i){
  stopHold(true);
  hold = { id:id, i:i, start:Date.now() };
  holdTick = setInterval(function(){
    var el = document.getElementById('holdclock');
    if(el) el.textContent = fmtClock(holdElapsed());
  }, 250);
  render();
}
function stopHold(silent){
  if(holdTick){ clearInterval(holdTick); holdTick = null; }
  if(!hold) return;
  var secs = holdElapsed(), h = hold;
  hold = null;
  if(silent) return;
  if(secs > 0){
    var it = find(session(cur), h.id);
    if(it && it.sets){
      while(it.sets.length <= h.i) it.sets.push(0);
      it.sets[h.i] = secs;
      save();
    }
    toast(secs + ' seconds logged');
  }
  render();                      // always redraw, even on a 0-second stop
}
function fmtClock(sec){
  var m = Math.floor(sec/60), r = sec%60;
  return m + ':' + (r<10?'0':'') + r;
}

/* ---- rest timer ---- */
var rest = null, restTick = null, REST_DEFAULT = 90;

function beep(){
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    var ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 660; g.gain.value = 0.12;
    o.start(); setTimeout(function(){ o.stop(); ctx.close(); }, 260);
  } catch(e){}
  try { if(navigator.vibrate) navigator.vibrate([120,80,120]); } catch(e){}
}

function startRest(secs){
  rest = { end: Date.now() + (secs||REST_DEFAULT)*1000 };
  document.getElementById('rest').classList.add('show');
  if(restTick) clearInterval(restTick);
  restTick = setInterval(tickRest, 250);
  tickRest();
}
function tickRest(){
  if(!rest) return;
  var left = Math.round((rest.end - Date.now())/1000);
  var el = document.getElementById('rclock');
  if(el) el.textContent = left > 0 ? fmtClock(left) : 'Go';
  if(left <= 0){
    clearInterval(restTick); restTick = null;
    beep();
    setTimeout(endRest, 2200);
  }
}
function endRest(){
  rest = null;
  if(restTick){ clearInterval(restTick); restTick = null; }
  var el = document.getElementById('rest');
  if(el) el.classList.remove('show');
}
document.getElementById('rest').addEventListener('click', function(e){
  var b = e.target.closest('[data-rest]'); if(!b) return;
  var v = b.dataset.rest;
  if(v === 'skip'){ endRest(); return; }
  if(rest){ rest.end += (+v)*1000; tickRest(); }
});

/* which broad region each muscle belongs to */
var REGION = {
  'Lats':'Back','Mid-back':'Back','Rhomboids':'Back','Rear delts':'Back','Spinal erectors':'Back','Traps':'Back',
  'Chest':'Chest','Upper chest':'Chest',
  'Front delts':'Shoulders','Side delts':'Shoulders',
  'Biceps':'Arms','Triceps':'Arms','Forearms':'Arms',
  'Quads':'Legs','Adductors':'Legs','Calves':'Legs',
  'Glutes':'Glutes','Glute medius':'Glutes','Hamstrings':'Hamstrings',
  'Abs':'Core','Deep core':'Core','Hip flexors':'Core',
  'Heart & lungs':'Conditioning'
};

function muscleTally(s){
  var m = {}, reg = {};
  (s.items||[]).forEach(function(it){
    var done = (it.sets||[]).filter(function(r){ return +r>0; }).length;
    if(it.kind === 'cardio') done = cardioMins(it) > 0 ? 1 : 0;
    if(!done) return;
    var key = moveKey(it.name), map = MUSCLES[key];
    if(!map) return;
    map.p.forEach(function(n){ m[n] = (m[n]||0) + done; });
    map.s.forEach(function(n){ m[n] = (m[n]||0) + done*0.4; });
  });
  Object.keys(m).forEach(function(n){
    m[n] = Math.round(m[n]*10)/10;
    var r = REGION[n] || 'Other';
    reg[r] = Math.round(((reg[r]||0) + m[n])*10)/10;
  });
  return { muscles:m, regions:reg };
}

/* names the session from what was actually logged */
var UPPER_R = ['Back','Chest','Shoulders','Arms'];
var LOWER_R = ['Legs','Glutes','Hamstrings'];

function detectType(s){
  if(s.mode === 'rest') return { label:'Rest day', detail:'recovery', regions:{}, muscles:{} };
  var t = muscleTally(s), reg = t.regions;
  var sum = function(list){ return list.reduce(function(a,r){ return a + (reg[r]||0); }, 0); };
  var up = sum(UPPER_R), lo = sum(LOWER_R), core = reg['Core'] || 0;
  var tot = up + lo + core;

  if(!tot){
    return (reg['Conditioning'])
      ? { label:'Cardio', detail:'conditioning only', regions:reg, muscles:t.muscles }
      : { label:'', detail:'', regions:{}, muscles:{} };
  }

  /* how much of this session was actually the machines */
  var cardioMin = 0;
  (s.items||[]).forEach(function(it){ if(it.kind === 'cardio') cardioMin += cardioMins(it); });

  var label;
  /* core first: a session that is mostly trunk work is a core session, whatever
     incidental glute or shoulder support the holds picked up along the way */
  if(core > up * 1.2 && core > lo * 1.2){
    label = cardioMin >= 8 ? 'Cardio & core' : 'Core';
  } else if(cardioMin >= 15 && core >= (up + lo)){
    label = 'Cardio & core';
  } else if(up/tot >= 0.20 && lo/tot >= 0.20){
    label = 'Full body';
  } else if(lo > up){
    var quad = reg['Legs'] || 0, post = (reg['Glutes']||0) + (reg['Hamstrings']||0);
    label = (post > quad*1.4) ? 'Glutes & hamstrings' : (quad > post*1.6 ? 'Quads' : 'Legs');
  } else if(up >= core){
    var back = reg['Back'] || 0, push = (reg['Chest']||0) + (reg['Shoulders']||0), arms = reg['Arms'] || 0;
    if(back >= up*0.28 && push >= up*0.28)      label = 'Upper body';
    else if(back > push && back > arms)         label = 'Pull';
    else if(push > back && push > arms)         label = (reg['Chest']||0) >= (reg['Shoulders']||0) ? 'Push' : 'Shoulders';
    else                                         label = 'Arms';
  } else {
    label = 'Core';
  }

  var detail = Object.keys(reg)
    .filter(function(r){ return r !== 'Conditioning' && reg[r] >= tot*0.15; })
    .sort(function(a,b){ return reg[b] - reg[a]; })
    .slice(0,4).map(function(r){ return r.toLowerCase(); }).join(' + ');

  return { label:label, detail:detail, regions:reg, muscles:t.muscles };
}

function sessionLabel(s){
  if(s.typeManual && s.type) return s.type;
  var d = detectType(s);
  return d.label || s.type || 'Untitled';
}

var GROUP_OF = {
  vpull:'Back', hpull:'Back',
  hpress:'Chest', fly:'Chest', pushup:'Chest',
  vpress:'Shoulders', raise:'Shoulders',
  curl:'Arms', tri:'Arms',
  squat:'Legs', lunge:'Legs', legpress:'Legs', legext:'Legs', calf:'Legs',
  hinge:'Glutes & hams', legcurl:'Glutes & hams', abduction:'Glutes & hams',
  plank:'Core', core:'Core', rollout:'Core',
  walk:'Cardio'
};
var GROUPS = ['Back','Chest','Shoulders','Arms','Legs','Glutes & hams','Core'];

function groupTally(days){
  var cutoff = shiftKey(todayKey(), -(days-1)), out = {};
  GROUPS.forEach(function(g){ out[g] = 0; });
  Object.keys(state.sessions).forEach(function(k){
    if(k < cutoff) return;
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind === 'cardio' || it.kind === 'prep' || it.kind === 'cool') return;
      var g = GROUP_OF[moveKey(it.name)];
      if(!g || g === 'Cardio') return;
      (it.sets||[]).forEach(function(r){ if(+r>0) out[g]++; });
    });
  });
  return out;
}
