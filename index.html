function lastTrained(focus){
  var keys = Object.keys(state.sessions).filter(function(k){
    return (state.sessions[k].items||[]).length; }).sort().reverse();
  for(var i=0;i<keys.length;i++){ if(state.sessions[keys[i]].type === focus) return keys[i]; }
  return null;
}

function daysSince(k){
  if(!k) return 99;
  return Math.round((parseKey(todayKey()) - parseKey(k)) / 86400000);
}

function recentBack(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return state.sessions[k].back; }).sort().reverse();
  return keys.length ? state.sessions[keys[0]].back : '';
}

function cardioDaysRecently(days){
  var cutoff = shiftKey(todayKey(), -(days-1)), n = 0;
  Object.keys(state.sessions).forEach(function(k){
    if(k < cutoff) return;
    var s = state.sessions[k];
    var mins = 0, lifts = 0;
    (s.items||[]).forEach(function(it){
      if(it.kind === 'cardio') mins += cardioMins(it);
      else if(it.kind === 'lift') lifts++;
    });
    if(mins >= 20 && lifts <= 2) n++;
  });
  return n;
}

function pickFocus(){
  /* the trainer's split is four strength days to two cardio days */
  if(cardioDaysRecently(7) < 2){
    var strengthThisWeek = 0, cutoff = shiftKey(todayKey(), -6);
    Object.keys(state.sessions).forEach(function(k){
      if(k >= cutoff && sessionStats(state.sessions[k]).sets >= 8) strengthThisWeek++;
    });
    if(strengthThisWeek >= 2) return 'Cardio & core';
  }
  var tally = groupTally(10), scored = [];
  Object.keys(POOLS).forEach(function(f){
    if(f === 'Full body' || f === 'Cardio & core') return;
    var groups = FOCUS_GROUPS[f];
    if(!groups) return;
    var vol = groups.reduce(function(a,g){ return a + (tally[g]||0); }, 0) / groups.length;
    var rest = daysSince(lastTrained(f));
    if(rest < 2) return;                                   // give it 48 hours
    scored.push({ f:f, vol:vol, rest:rest });
  });
  if(!scored.length) return 'Full body';
  scored.sort(function(a,b){ return a.vol - b.vol || b.rest - a.rest; });
  return scored[0].f;
}

/* rounding to what the gym actually offers */
function increment(eq){
  if(eq === 'Dumbbell') return 2.5;
  if(eq === 'Weight plate') return 2.5;
  if(eq === 'Barbell') return 5;
  return 5;                                                 // stacks
}
function roundTo(v, step){ return Math.round(v/step)*step; }

/* any prior appearance, even one logged without rep counts */
function prevAny(name, beforeKey){
  var keys = Object.keys(state.sessions).filter(function(k){ return k < beforeKey; }).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var items = state.sessions[keys[i]].items || [];
    for(var j=0;j<items.length;j++){
      if(items[j].name === name) return { k:keys[i], it:items[j] };
    }
  }
  return null;
}

/* the prescription itself */
function prescribe(name, mode){
  var horizon = shiftKey(todayKey(), 1);
  var eqGuess = guessEquip(name, 0);
  var prev = prevPerformance(name, horizon);

  if(!prev){
    var seen = prevAny(name, horizon);
    if(seen){
      var sl = topLoad(seen.it);
      if(sl) return { load:sl, eq:seen.it.eq || eqGuess, ps:!!seen.it.ps,
                      why:'you used '+sl+' lb last time but the reps went unrecorded — match it and write them down' };
      if((seen.it.eq || eqGuess) === 'Bodyweight'){
        return { load:0, eq:'Bodyweight', why:'bodyweight — take the last two reps to genuinely hard' };
      }
      return { load:null, eq:seen.it.eq || eqGuess,
               why:'you have done this but never logged the weight — note it today so it can be tracked' };
    }
    if(eqGuess === 'Bodyweight'){
      return { load:0, eq:'Bodyweight', why:'bodyweight — quality over speed, stop when the position breaks' };
    }
    return { load:null, eq:eqGuess, why:'new to you — find a weight where the last two reps are hard' };
  }

  var it = prev.it, L = topLoad(it), eq = it.eq || eqGuess;
  var top = 0;
  (it.sets||[]).forEach(function(r,i){ if(loadAt(it,i) === L && +r > top) top = +r; });

  if(!L){
    if(eq === 'Bodyweight' || eq === 'Cardio machine'){
      return { load:0, eq:eq, ps:!!it.ps, why:'bodyweight — last time '+top+' reps, aim for '+(top+2) };
    }
    return { load:null, eq:eq, ps:!!it.ps,
             why:'the weight was never written down — record it today and this gets a real target' };
  }

  /* light loads need finer jumps than a 5 lb pin */
  var step = (L < 25) ? 2.5 : increment(eq);
  var out, why;

  function bump(pct){
    var t = roundTo(L*pct, step);
    return (t > L) ? t : L + step;
  }

  if(mode === 'easy'){
    out = roundTo(L*0.85, step);
    why = 'eased back from '+L+' lb while your back settles';
  } else if(top >= 15){
    out = bump(1.10);
    why = 'you got '+top+' clean reps at '+L+' lb — that is too light';
  } else if(top >= 12){
    if(mode === 'hard'){ out = bump(1.05); why = 'stepping up from '+L+' lb after '+top+' solid reps'; }
    else { out = L; why = 'hold '+L+' lb and add a rep to each set'; }
  } else if(top >= 8){
    out = L;
    why = 'hold '+L+' lb — last time topped out at '+top+' reps';
  } else {
    out = Math.max(step, roundTo(L*0.92, step));
    why = 'back off slightly from '+L+' lb, you only managed '+top;
  }
  return { load:out, eq:eq, ps:!!it.ps, why:why };
}

/* Cardio days run on minutes, not sets — so they get their own builder.
   Core work here is anti-extension and anti-rotation only. */
function designCardioDay(opts, mode, flags){
  var mins = opts.minutes, v = opts.variant || 0;
  var pool = POOLS['Cardio & core'];

  function rot(list){
    if(!list.length || !v) return list;
    var n = v % list.length;
    return list.slice(n).concat(list.slice(0, n));
  }
  var machines = rot(pool.filter(function(x){ return x.role === 'cardio'; }));
  var cores    = rot(pool.filter(function(x){ return x.role === 'core'; }));

  /* roughly two thirds of the session on the machines */
  var target = Math.round((mins - 8) * (mode === 'easy' ? 0.5 : 0.62));
  var blocks = [], used = 0;
  machines.forEach(function(m){
    if(used >= target) return;
    var take = Math.min(m.mins, Math.max(6, target - used));
    if(take < 5) return;
    blocks.push({
      name:m.n, role:'cardio', mins:take,
      inc:m.inc || 0, mph:m.mph || 0,
      dose: take + ' min' + (m.inc ? ' \u00b7 ' + m.inc + '% incline \u00b7 ' + m.mph + ' mph' : ' \u00b7 steady'),
      why: blocks.length === 0
        ? 'Start here and settle into a rhythm you could hold a conversation at.'
        : 'A second machine keeps the effort up without pounding the same joints.',
      note:m.note
    });
    used += take;
  });

  var coreSlots = mode === 'easy' ? 2 : (mins >= 45 ? 4 : 3);
  cores.slice(0, coreSlots).forEach(function(c){
    var sets = mode === 'easy' ? 2 : 3;
    blocks.push({
      name:c.n, role:'core', sets:sets, reps:c.reps,
      dose: c.reps.indexOf('\u00d7') > -1 ? c.reps : sets + ' \u00d7 ' + c.reps,
      why: 'Braced core work \u2014 your trunk resists movement rather than creating it.'
    });
  });

  var est = 5 + used + coreSlots * 2.5 + 5;
  est = Math.round(est);
  return {
    focus:'Cardio & core', mode:mode, flags:flags, blocks:blocks,
    warm:5, cardio:0, cardioDay:true,
    totalSets: blocks.filter(function(b){ return b.role === 'core'; })
                     .reduce(function(a,b){ return a + b.sets; }, 0),
    est:est, variant:v, pool:pool,
    rest:'30-45 sec between core sets, and no rush between machines',
    swapped:'Leg raises, reverse crunches and sit-ups are deliberately not here. They load your lower back '
      + 'in the one direction it likes least. Everything above trains the same muscles with your spine supported.',
    lastDone: lastTrained('Cardio & core')
  };
}

function designSession(opts){
  var focus = opts.focus === 'auto' ? pickFocus() : opts.focus;
  var mode = opts.mode, mins = opts.minutes;
  var back = recentBack();
  var flags = [];

  var dstat = deloadStatus();
  if(dstat.due && mode === 'hard'){
    mode = 'easy';
    flags.push('You have trained ' + dstat.run + ' weeks straight. This is the deload version — lighter on purpose.');
  }

  var rec = recoveryMode();
  if(rec === 'low' && mode === 'hard'){
    mode = 'steady';
    flags.push('Your sleep or readiness was low, so this is the steady version rather than a push day.');
  }

  if(back === 'Achy' || back === 'Sore'){
    if(mode !== 'easy'){ mode = 'easy'; flags.push('Your last back check said "'+back+'", so this is the eased version.'); }
    if(focus === 'Legs — hamstring/glute'){
      focus = 'Legs — quad';
      flags.push('Swapped off hinging to machine-based leg work.');
    }
  }

  if(focus === 'Cardio & core') return designCardioDay(opts, mode, flags);

  var pool = (POOLS[focus] || POOLS['Full body']).slice();
  if(mode === 'easy') pool = pool.filter(function(x){ return x.n !== 'Romanian deadlift'; });

  /* rotate within each role so a rebuild surfaces genuinely different work,
     while keeping compounds ahead of accessories and core at the end */
  var v = opts.variant || 0;
  function rotate(list){
    if(!list.length || !v) return list;
    var n = v % list.length;
    return list.slice(n).concat(list.slice(0, n));
  }
  var mains = rotate(pool.filter(function(x){ return x.role === 'main'; }));
  var accs  = rotate(pool.filter(function(x){ return x.role === 'acc'; }));
  var cores = rotate(pool.filter(function(x){ return x.role === 'core'; }));
  pool = mains.slice(0,2).concat(accs, mains.slice(2), cores);

  var warm = 5;
  var cardio = mins >= 60 ? 15 : (mins >= 45 ? 10 : 5);
  var perEx = mode === 'hard' ? 4.5 : 4;
  var room = Math.max(3, Math.floor((mins - warm - cardio) / perEx));
  var picks = [], regionCount = {};
  pool.forEach(function(x){
    if(picks.length >= room) return;
    var rg = regionOf(x.n);
    var cap = (x.role === 'core') ? 1 : 2;
    if((regionCount[rg]||0) >= cap) return;
    regionCount[rg] = (regionCount[rg]||0) + 1;
    picks.push(x);
  });
  if(picks.length < Math.min(room, pool.length)){          /* top up if the cap was too tight */
    pool.forEach(function(x){
      if(picks.length >= room) return;
      if(picks.indexOf(x) < 0) picks.push(x);
    });
  }
  /* always finish on a core movement when there is space for one */
  if(picks.length >= 4 && !picks.some(function(x){ return x.role === 'core'; }) && cores.length){
    picks[picks.length-1] = cores[0];
  }

  var blocks = picks.map(function(x, i){
    var setCount = (mode === 'easy') ? 2 : (x.role === 'main' && mode === 'hard' ? 4 : 3);
    var p = prescribe(x.n, mode);
    return {
      name:x.n, sets:setCount, reps:x.reps, load:p.load, eq:p.eq || guessEquip(x.n, 0),
      ps:p.ps, why:p.why, note:x.note, ss:x.ss, role:x.role
    };
  });

  var totalSets = blocks.reduce(function(a,b){ return a + b.sets; }, 0);
  var est = warm + cardio + Math.round(blocks.reduce(function(a,b){
    return a + b.sets * (b.role === 'main' ? 1.6 : 1.2); }, 0));

  return {
    focus:focus, mode:mode, flags:flags, blocks:blocks, warm:warm, cardio:cardio,
    variant:v, pool:pool,
    totalSets:totalSets, est:est,
    rest: mode === 'hard' ? '90-120 sec on the main lifts, 60 sec on the rest'
                          : '60-90 sec, and less on the paired exercises',
    lastDone: lastTrained(focus)
  };
}

function knownExercises(){
  var seen = {}, out = [];
  LIBRARY.forEach(function(n){ if(!seen[n.toLowerCase()]){ seen[n.toLowerCase()]=1; out.push(n); } });
  Object.keys(state.sessions||{}).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      var key = (it.name||'').toLowerCase();
      if(key && !seen[key]){ seen[key]=1; out.push(it.name); }
    });
  });
  return out;
}

function matchExercises(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return [];
  var words = q.split(/\s+/);
  var scored = [];
  knownExercises().forEach(function(n){
    var low = n.toLowerCase();
    // every typed word must appear somewhere in the name
    for(var i=0;i<words.length;i++){ if(low.indexOf(words[i]) < 0) return; }
    var score = 3;
    if(low.indexOf(q) === 0) score = 0;                       // name starts with what you typed
    else if(low.split(/\s+/).some(function(w){ return w.indexOf(words[0])===0; })) score = 1;
    else if(low.indexOf(q) > -1) score = 2;
    scored.push({ n:n, s:score });
  });
  scored.sort(function(a,b){ return a.s - b.s || a.n.length - b.n.length || a.n.localeCompare(b.n); });
  return scored.slice(0, 8).map(function(x){ return x.n; });
}

function highlight(name, q){
  var i = name.toLowerCase().indexOf((q||'').trim().toLowerCase());
  if(i < 0 || !q.trim()) return esc(name);
  var n = q.trim().length;
  return esc(name.slice(0,i)) + '<em>' + esc(name.slice(i,i+n)) + '</em>' + esc(name.slice(i+n));
}

function renderSuggestions(q){
  var box = document.getElementById('sugg');
  if(!box) return;
  var hits = matchExercises(q);
  if(!q || !q.trim()){ box.innerHTML = ''; return; }

  var html = hits.map(function(n){
    var k = moveKey(n), lab = k && MOVES[k] ? MOVES[k].label : '';
    return '<button type="button" data-act="pickex" data-n="'+esc(n)+'">'
      + '<span class="sname">'+highlight(n, q)+'</span>'
      + '<span class="spat">'+esc(lab)+'</span></button>';
  }).join('');

  var exact = hits.some(function(n){ return n.toLowerCase() === q.trim().toLowerCase(); });
  if(!exact){
    html += '<button type="button" data-act="pickex" data-n="'+esc(q.trim())+'">'
      + '<span class="sname">'+esc(q.trim())+'</span>'
      + '<span class="spat snew">Add as new</span></button>';
  }
  box.innerHTML = html;
}

var NOWEIGHT = /(without|no)\s*weight|body\s*weight|\bbw\b/i;

function parseLines(text){
  var out = [];
  text.split(/\n+/).forEach(function(raw){
    var line = raw.replace(/^[\s\-\u2013\u2014\u2022*]+/,'').replace(/\s+/g,' ').trim();
    if(!line) return;
    var low = line.toLowerCase();

    if(guessKind(low)==='cardio'){
      var mn=/([\d.]+)\s*(?:min|minute)/.exec(low),
          ic=/([\d.]+)\s*(?:incl|incline|%)/.exec(low),
          sp=/([\d.]+)\s*(?:mph|speed)/.exec(low);
      var cname = cleanName(/^([^\d]*)/.exec(line)[0]);
      if(!cname){
        var tail = line.replace(/[\d.]+\s*(?:min|minute|mph|incl|incline|speed|%|s)?/gi,' ')
                       .replace(/\s+/g,' ').trim();
        cname = cleanName(tail) || 'Cardio';
      }
      cname = cname.charAt(0).toUpperCase()+cname.slice(1);
      out.push({id:uid(), name:cname, kind:'cardio',
        minutes:mn?+mn[1]:0, incline:ic?+ic[1]:0, speed:sp?+sp[1]:0});
      return;
    }

    var head = /^([^\d]*)/.exec(line)[0];
    var name = cleanName(head) || cleanName(line);
    var data = line.slice(head.length);

    if(/sec|second/.test(low) || guessKind(low)==='hold'){
      var nums = (data.match(/[\d.]+/g)||[]).map(Number);
      var secs;
      if(nums.length===2 && nums[0]<=6 && nums[1]>=5){ secs=[]; for(var q=0;q<nums[0];q++) secs.push(nums[1]); }
      else if(nums.length){ secs = nums; }
      else secs = [null,null,null];
      out.push({id:uid(), name:name, kind:'hold', eq:guessEquip(name,0), sets:secs.slice(0,8)});
      return;
    }

    var sets=[], loads=[], lastLoad=0;
    data.split(/[,;]+/).forEach(function(chunk){
      var c = chunk.trim(); if(!c) return;
      if(NOWEIGHT.test(c)) lastLoad = 0;
      var lm = /([\d.]+)\s*(?:lbs|lb|#|pounds)/i.exec(c);
      if(lm){ lastLoad = +lm[1]; c = c.replace(lm[0], ' '); }
      var reps = (c.match(/[\d.]+/g)||[]).map(Number).filter(function(n){ return n>0 && n<=60; });
      reps.forEach(function(n){ sets.push(Math.round(n)); loads.push(lastLoad); });
    });
    if(!sets.length){ sets=[null,null,null]; loads=[lastLoad,lastLoad,lastLoad]; }
    out.push({id:uid(), name:name, kind:'lift', eq:guessEquip(name, lastLoad),
              sets:sets.slice(0,8), loads:loads.slice(0,8)});
  });
  return out;
}
function cleanName(t){
  return t.replace(/[\s\-\u2013\u2014:*x\u00d7=]+$/i,'').replace(/^[\s\-]+/,'').trim();
}

/* ============ render ============ */
var view = document.getElementById('view');

function render(){
  if(tab==='log') renderLog();
  else if(tab==='history') renderHistory();
  else if(tab==='progress') renderProgress();
  else if(tab==='plan') renderPlan();
  else renderWhy();
}

function renderLog(){
  var s = session(cur), st = sessionStats(s);
  var h = '';

  h += '<div class="datebar">'
    + '<button class="nav" data-act="day" data-d="-1" aria-label="Previous day">&lsaquo;</button>'
    + '<div class="datefield"><div class="dow">'+esc(DOW[parseKey(cur).getDay()])+'</div>'
    + '<div class="dnum">'+esc(fmtLong(cur))+'</div>'
    + '<input type="date" value="'+cur+'" data-act="pickdate" aria-label="Choose date"></div>'
    + '<button class="nav" data-act="day" data-d="1" aria-label="Next day">&rsaquo;</button>'
    + '</div>';

  var plates='', cap=28, total=Math.min(st.sets,cap);
  for(var i=0;i<cap;i++) plates += '<div class="plate'+(i<total?'':' empty')+'"></div>';

  h += '<div class="session-head"><div class="sh-top"><select data-act="type">'
    + '<option value="">— session type —</option>';
  TYPES.forEach(function(t){ h += '<option'+(s.type===t?' selected':'')+'>'+esc(t)+'</option>'; });
  h += '</select><div class="sh-stats">'
    + '<span><b>'+st.sets+'</b> set'+(st.sets===1?'':'s')+'</span>'
    + '<span><b>'+st.reps+'</b> reps</span>'
    + '<span><b>'+(st.vol?st.vol.toLocaleString():'—')+'</b> lb</span>'
    + '</div></div><div class="stackbar">'+plates+'</div></div>';

  if(BACKEND === 'none'){
    h += '<div class="alarm"><strong>Nothing is being saved</strong>'
      + '<p>This copy cannot store anything, so today\'s entries will be gone when you close it. '
      + 'Download a backup before you leave, and load it back next time.</p>'
      + '<button class="btn btn-solid btn-wide" data-act="download">Download backup file</button></div>';
  }

  var det = detectType(s);

  h += '<div class="modebar">';
  [['solo','Solo'],['trainer','With trainer'],['rest','Rest day']].forEach(function(o){
    h += '<button data-act="mode" data-v="'+o[0]+'" aria-pressed="'+((s.mode||'solo')===o[0])+'">'+esc(o[1])+'</button>';
  });
  h += '</div>';

  h += '<div class="recov"><div class="lbl">Recovery &mdash; from your ring or watch</div><div class="fields">'
    + '<div class="fld"><span>Sleep h:mm</span><input type="text" inputmode="numeric" data-act="rec" data-k="sleep" '
    + 'value="'+fmtSleep(s.sleep)+'" placeholder="7:13"></div>'
    + '<div class="fld"><span>Readiness</span><input inputmode="numeric" data-act="rec" data-k="ready" value="'+(s.ready||'')+'" placeholder="\u2014"></div>'
    + '<div class="fld"><span>Resting HR</span><input inputmode="numeric" data-act="rec" data-k="rhr" value="'+(s.rhr||'')+'" placeholder="\u2014"></div>'
    + '</div>'
    + '<div class="lbl" style="margin-top:11px">Body \u2014 log when you weigh in</div><div class="fields">'
    + '<div class="fld"><span>Weight lb</span><input inputmode="decimal" data-act="rec" data-k="bw" value="'+(s.bw||'')+'" placeholder="\u2014"></div>'
    + '<div class="fld"><span>Waist in</span><input inputmode="decimal" data-act="rec" data-k="waist" value="'+(s.waist||'')+'" placeholder="\u2014"></div>'
    + '<div class="fld"><span>Hips in</span><input inputmode="decimal" data-act="rec" data-k="hips" value="'+(s.hips||'')+'" placeholder="\u2014"></div>'
    + '</div>';
  var bv = bodyVerdict();
  if(bv) h += '<div class="verdict'+(bv.tone==='warn'?' warn':'')+'">'+esc(bv.text)+'</div>';
  var rv = recoveryVerdict(s);
  h += '<div class="verdict'+(rv && rv.warn ? ' warn' : '')+'">'+(rv ? esc(rv.text) : '')+'</div>';

  h += '<div class="phaseseg">';
  PHASES.forEach(function(ph){
    h += '<button data-act="phase" data-v="'+esc(ph)+'" aria-pressed="'+(s.phase===ph)+'">'
      + esc(ph === 'Menstrual' ? 'Period' : ph) + '</button>';
  });
  h += '</div>';

  var ci = cycleInfo(cur);
  if(s.phase){
    h += '<div class="cycleline"><b>'+esc(s.phase)+'</b> phase &middot; as reported by your ring'
      + (ci && ci.day ? ' &middot; cycle day ' + ci.day : '') + '</div>';
  } else if(ci){
    h += '<div class="cycleline">Cycle day <b>'+ci.day+'</b> &middot; likely <b>'+esc(ci.phase.toLowerCase())
      + '</b> phase &middot; estimated from a '+ci.len+'-day cycle</div>';
  }

  h += '<button class="cyclebtn'+(s.periodStart?' on':'')+'" data-act="period">'
    + (s.periodStart ? '\u25cf Period started this day' : 'Mark period start \u2014 optional, only if you are not reading it off Oura')
    + '</button></div>';

  var BACK = ['Fine','Aware','Achy','Sore'];
  h += '<div class="backcheck"><div class="lbl">Back check</div><div class="opts">';
  BACK.forEach(function(b){
    h += '<button data-act="back" data-v="'+b+'" aria-pressed="'+(s.back===b)+'">'+b+'</button>';
  });
  h += '</div></div>';

  if(!s.items.length){
    h += '<div class="empty"><strong>Nothing logged yet</strong>Add an exercise below, copy your last session, '
      + 'or load a day from the Plan tab.</div>'
      + '<button class="btn btn-ghost btn-wide" data-act="copylast" style="margin-bottom:10px">Copy my last session</button>';
  }

  var lastKind = null;
  s.items.forEach(function(it, idx){
    var band = (it.kind === 'prep') ? 'Warm up' : (it.kind === 'cool' ? 'Stretch' : 'Workout');
    if(band !== lastKind){
      h += '<div class="seclabel">'+esc(band)+'</div>';
      lastKind = band;
    }
    var cls = it.kind==='cardio' ? ' cardio'
            : (it.kind==='hold' ? ' hold'
            : (it.kind==='prep' ? ' prep' : (it.kind==='cool' ? ' cool' : '')));
    if(it.ss) cls += ' ss';
    if((it.kind==='prep' || it.kind==='cool') && it.done) cls += ' done';
    h += '<div class="card'+cls+'" data-cid="'+it.id+'">'
      + '<div class="card-top"><div class="idx">'+pad(idx+1)+'</div>'
      + '<h3>'+esc((it.kind==='prep'||it.kind==='cool') ? mobName(it.name) : it.name)
      + ((it.kind==='prep'||it.kind==='cool') && it.detail
          ? ' <span class="mobdose">'+esc(it.detail)+'</span>' : '') + '</h3>'
      + ((it.kind==='prep'||it.kind==='cool')
          ? '<button class="tick'+(it.done?' on':'')+'" data-act="tick" data-id="'+it.id+'" '
            + 'aria-pressed="'+(!!it.done)+'" aria-label="Mark '+esc(it.name)+' done">&#10003;</button>'
          : '')
      + '<button class="insbtn" data-act="insertafter" data-id="'+it.id+'" '
      + 'aria-label="Add an exercise after '+esc(it.name)+'" title="Insert here">+</button>'
      + '<button class="formbtn" data-act="form" data-id="'+it.id+'" aria-expanded="'+(openForm===it.id)+'" '
      + 'aria-label="Show how to do '+esc(it.name)+'">FORM</button>'
      + '<button class="notebtn'+(it.note?' has':'')+'" data-act="notetoggle" data-id="'+it.id+'" '
      + 'aria-label="Note for '+esc(it.name)+'">NOTE</button>'
      + ((it.kind==='prep'||it.kind==='cool'||it.kind==='cardio') ? '' :
         '<button class="setupbtn'+(it.setup?' has':'')+'" data-act="setuptoggle" data-id="'+it.id+'" '
         + 'aria-label="Machine setup for '+esc(it.name)+'">SETUP</button>')
      + ((it.kind==='cardio' || it.kind==='prep' || it.kind==='cool') ? '' :
         '<button class="ssbadge'+(it.ss?'':' off')+'" data-act="ss" data-id="'+it.id+'" '
         + 'aria-label="Superset group">'+(it.ss ? 'SS '+esc(it.ss) : 'SS')+'</button>')
      + '<span class="movebtns">'
      + '<button class="movebtn" data-act="moveup" data-id="'+it.id+'"'+(idx===0?' disabled':'')
      + ' aria-label="Move '+esc(it.name)+' earlier">&#9650;</button>'
      + '<button class="movebtn" data-act="movedn" data-id="'+it.id+'"'+(idx===s.items.length-1?' disabled':'')
      + ' aria-label="Move '+esc(it.name)+' later">&#9660;</button></span>'
      + '<button class="kill" data-act="delitem" data-id="'+it.id+'" aria-label="Remove '+esc(it.name)+'">&times;</button></div>';

    var pr = isPR(it, cur);
    h += '<div class="prslot" id="pr-'+it.id+'" style="margin-left:22px">'
      + (pr ? '<span class="prbadge">PR &middot; '+esc(pr)+'</span>' : '') + '</div>';

    if(it.kind === 'prep' || it.kind === 'cool'){
      if(!it.detail && mobDose(it.name)){
        h += '<div class="mobdose" style="margin-left:22px">'+esc(mobDose(it.name))+'</div>';
      }
      if(openForm === it.id){
        h += (it.move && MOVES[it.move])
          ? formPanel(null, MOVES[it.move])
          : formPanel(mobName(it.name));
      }
      h += '</div>';
      return;
    }

    if(openForm===it.id){
      h += ((it.kind==='prep'||it.kind==='cool') && it.move && MOVES[it.move])
        ? formPanel(null, MOVES[it.move])
        : formPanel(it.name);
    }

    if(it.kind !== 'prep' && it.kind !== 'cool' && it.kind !== 'cardio'){
      if(it.setup){
        h += '<div class="setupline">Setup &middot; <b>'+esc(it.setup)+'</b></div>';
      } else {
        var ls = lastSetup(it.name, shiftKey(cur, -1));
        if(ls) h += '<div class="setupline">Last setup &middot; <b>'+esc(ls.v)+'</b> '
          + '<button class="setupbtn" data-act="usesetup" data-id="'+it.id+'" data-v="'+esc(ls.v)+'">Use this</button></div>';
      }
    }
    if(openSetup === it.id){
      h += '<div class="setupbox"><input type="text" data-act="setupval" data-id="'+it.id+'" '
        + 'value="'+esc(it.setup||'')+'" placeholder="Seat 4, pin 3, feet high…"></div>';
    }

    if(openNote === it.id){
      h += '<input class="exnote" data-act="exnote" data-id="'+it.id+'" value="'+esc(it.note||'')+'" '
        + 'placeholder="Seat at 4, felt it in the left shoulder, machine was taken\u2026">';
    } else if(it.note){
      h += '<div class="exnoteline">'+esc(it.note)+'</div>';
    }

    if(it.tgt) h += '<div class="lastline">Target &middot; <b>'+esc(it.tgt)+'</b></div>';

    var prev = prevPerformance(it.name, cur);
    if(prev){
      h += '<div class="lastline">Last &middot; '+fmtShort(prev.k)+' &middot; <b>'+esc(summarise(prev.it))+'</b></div>';
    }

    if(it.kind==='cardio'){
      var segs = segsOf(it);
      segs.forEach(function(g, gi){
        h += '<div class="segrow">'
          + '<span class="segn">'+(gi+1)+'</span>'
          + '<label>Min</label><input class="num" inputmode="decimal" value="'+(g.m||'')+'" data-act="seg" data-id="'+it.id+'" data-i="'+gi+'" data-k="m">'
          + '<label>Incl %</label><input class="num" inputmode="decimal" value="'+(g.i||'')+'" data-act="seg" data-id="'+it.id+'" data-i="'+gi+'" data-k="i">'
          + '<label>Mph</label><input class="num" inputmode="decimal" value="'+(g.s||'')+'" data-act="seg" data-id="'+it.id+'" data-i="'+gi+'" data-k="s">'
          + (segs.length > 1
              ? '<button class="segdel" data-act="segdel" data-id="'+it.id+'" data-i="'+gi+'" aria-label="Remove segment '+(gi+1)+'">&times;</button>'
              : '')
          + '</div>';
      });
      h += '<div class="segfoot">'
        + '<button class="segadd" data-act="segadd" data-id="'+it.id+'">+ Change of pace</button>'
        + (cardioMins(it) ? '<span class="segtot">'+cardioMins(it)+' min total</span>' : '')
        + '</div>';
      h += '<div class="eqrow" style="margin-top:2px">'
        + '<label>Avg HR</label><input class="num" inputmode="numeric" value="'+(it.hr||'')+'" data-act="f" data-id="'+it.id+'" data-k="hr">'
        + '</div>';
    } else {
      if(it.kind==='hold'){
        h += '<div class="eqrow"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)">Seconds held per set</label></div>';
        var live = hold && hold.id === it.id;
        var nextSlot = 0;
        (it.sets||[]).forEach(function(r,ix){ if(+r>0) nextSlot = ix+1; });
        h += '<div class="holdtimer'+(live?' live':'')+'">'
          + '<span class="clock" id="'+(live?'holdclock':'')+'">'+fmtClock(live?holdElapsed():0)+'</span>'
          + (live
              ? '<button class="tbtn stop" data-act="holdstop">Stop &amp; log</button>'
              : '<button class="tbtn" data-act="holdstart" data-id="'+it.id+'" data-i="'+nextSlot+'">Start set '+(nextSlot+1)+'</button>')
          + '</div>';
      } else {
        var tl = topLoad(it);
        h += '<div class="eqrow"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)">Equipment</label>'
          + '<select class="eqsel" data-act="eq" data-id="'+it.id+'" aria-label="Equipment used">';
        EQUIP.forEach(function(q){
          h += '<option'+((it.eq||guessEquip(it.name, tl))===q?' selected':'')+'>'+esc(q)+'</option>';
        });
        h += '</select>'
          + '<button class="psbtn'+(it.ps?'':' off')+'" data-act="ps" data-id="'+it.id+'" '
          + 'aria-pressed="'+(!!it.ps)+'" title="Weight is loaded on both sides">'
          + (it.ps ? '\u00d72 PER SIDE' : 'PER SIDE?') + '</button></div>';
        if(it.kind!=='hold'){
          h += '<div class="loadrow"><label>Reps &middot; load lb per set'
            + (tl ? ' &middot; top ' + tl + ' lb' + (it.ps ? ' each side = ' + (tl*2) + ' lb total' : '') : ' &middot; bodyweight')
            + '</label></div>';
        }
      }
      h += '<div class="sets">';
      (it.sets||[]).forEach(function(r, si){
        h += '<div class="setchip"><em>'+(it.kind==='hold'?'SEC ':'SET ')+(si+1)+'</em>'
          + '<input inputmode="numeric" placeholder="'+(it.kind==='hold'?'sec':'reps')+'" value="'+(r?r:'')+'" data-act="set" data-id="'+it.id+'" data-i="'+si+'" aria-label="Set '+(si+1)+(it.kind==='hold'?' seconds':' reps')+'">'
          + (it.kind==='hold' ? '' :
             '<input class="setload" inputmode="decimal" placeholder="BW" value="'+(loadAt(it,si)||'')+'" data-act="load" data-id="'+it.id+'" data-i="'+si+'" aria-label="Set '+(si+1)+' load in pounds">')
          + '</div>';
      });
      h += '<div class="setbtns">'
        + '<button class="setbtn" data-act="addset" data-id="'+it.id+'" aria-label="Add set">+</button>'
        + (it.sets && it.sets.length ? '<button class="setbtn" data-act="delset" data-id="'+it.id+'" aria-label="Remove last set">&minus;</button>' : '')
        + '</div></div>';
    }
    h += '</div>';
  });

  h += '<div class="adder">'
    + '<input type="text" id="newname" placeholder="'+(insertAt ? 'Insert after '+esc(nameOf(s, insertAt))+'\u2026' : 'Add an exercise\u2026')+'" autocomplete="off" '
    + 'autocorrect="off" autocapitalize="words" spellcheck="false">'
    + '<button class="btn btn-solid" data-act="additem">Add</button></div>'
    + '<div class="sugg" id="sugg"></div>'
    + '<div class="kindtog">'
    + '<button data-act="kind" data-v="lift" aria-pressed="'+(newKind==='lift')+'">Strength</button>'
    + '<button data-act="kind" data-v="cardio" aria-pressed="'+(newKind==='cardio')+'">Cardio</button>'
    + '</div>';

  if(pasteOpen){
    h += '<div class="coach" style="margin-top:12px">'
      + '<textarea id="pastebox" style="min-height:130px" placeholder="Paste your notes, one exercise per line:&#10;Leg curl 55lb*12, 70lb*15, 85lb*12&#10;Knee pushups 12, 10, 8&#10;Treadmill 10 min 9 incline 2.4 mph&#10;Planks 3 30 sec"></textarea>'
      + '<button class="btn btn-solid btn-wide" data-act="dopaste" style="margin:8px 0 6px">Read it in</button>'
      + '</div>';
  } else {
    h += '<button class="btn btn-ghost btn-wide" data-act="paste" style="margin-top:10px">Paste from notes</button>';
  }

  if(s.items.length){
    h += '<div class="footnote" style="margin-top:2px">'
      + '<strong>SS</strong> marks a superset &mdash; two exercises done back to back with no rest between them, '
      + 'then a rest before repeating. Tap SS on both exercises until they show the same letter to pair them.</div>';
  }

  var dl = deloadStatus();
  if(dl.due && s.mode !== 'rest' && !s.deload){
    h += '<div class="alarm"><strong>Time for an easier week</strong><p>'+esc(dl.text)+'</p>'
      + '<button class="btn btn-solid btn-wide" data-act="markdeload">Make this a deload week</button></div>';
  }
  if(s.deload){
    h += '<div class="rxflag"><strong>Deload week.</strong> Two sets instead of three, and about 15% off your '
      + 'usual weights. Same movements, same days \u2014 you are practising, not proving.</div>';
  }

  if(s.mode !== 'rest'){
    h += '<button class="nextbtn" data-act="nextup">'
      + (nextOpen ? 'Hide suggestions' : 'What should I do next?') + '</button>';
    if(nextOpen){
      var nx = nextUp(s);
      h += '<div class="nextwrap"><div class="nextstage">'+esc(nx.stage)
        + ' &middot; ' + nx.done + ' exercise' + (nx.done===1?'':'s') + ' in</div>';
      if(nx.guard){
        h += '<div class="rxflag">Your last back check was not great, so hinging and loaded squatting '
          + 'have been pushed down the list.</div>';
      }
      if(!nx.list.length){
        h += '<div class="nextwhy">Nothing obvious left — you have covered a lot today. '
          + 'Finish with a walk and stretch.</div>';
      }
      nx.list.forEach(function(c, i){
        h += '<button class="nextcard" data-act="addnext" data-n="'+esc(c.name)+'" data-l="'+(c.load===null?'':c.load)+'">'
          + '<span class="nextrank">'+pad(i+1)+'</span><span style="flex:1;min-width:0">'
          + '<span class="nextname">'+esc(c.name)+'</span>'
          + '<span class="nextdose">'+esc(c.dose)+'</span>'
          + '<span class="nextwhy">'+esc(c.why)+'</span>'
          + '<span class="nextadd">Tap to add</span>'
          + '</span></button>';
      });
      h += '<div class="nextrule"><strong>Why this order:</strong> '+esc(ORDER_RULE)+'</div></div>';
    }
  }

  if(s.mode !== 'rest'){
    var hasPrep = s.items.some(function(it){ return it.kind === 'prep'; });
    var hasCool = s.items.some(function(it){ return it.kind === 'cool'; });
    var lifts = s.items.filter(function(it){ return it.kind !== 'prep' && it.kind !== 'cool'; }).length;
    if(!hasPrep || (!hasCool && lifts)){
      h += '<div style="display:flex;gap:8px;margin-top:12px">';
      if(!hasPrep) h += '<button class="addmob" data-act="addwarm">+ Add warm up</button>';
      if(!hasCool && lifts) h += '<button class="addmob" data-act="addcool">+ Add stretches</button>';
      h += '</div>';
    }
  }

  if(s.items.length){
    h += '<button class="finishbtn" data-act="finish">'
      + (reviewFor === cur ? 'Hide review' : 'Workout finished') + '</button>';
    if(reviewFor === cur) h += reviewHtml(cur);
  }

  h += '<div class="eyebrow">Coach notes</div>'
    + '<div class="coach"><textarea data-act="coach" placeholder="Feedback on this session — what to hold, what to load up, what to watch.">'
    + esc(s.coach||'') + '</textarea></div>';

  h += '<div class="eyebrow">How it felt</div>'
    + '<textarea class="notes" data-act="notes" placeholder="Energy, aches, machine settings, seat height…">'+esc(s.notes||'')+'</textarea>';

  view.innerHTML = h;
}

function renderHistory(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return state.sessions[k].items && state.sessions[k].items.length;
  }).sort().reverse();

  var h = '<div class="eyebrow">Logged sessions · '+keys.length+'</div>';
  if(!keys.length){
    h += '<div class="empty"><strong>No sessions yet</strong>Anything you log shows up here, newest first.</div>';
  }
  keys.forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    var exCount = (s.items||[]).filter(function(i){ return i.kind !== 'cardio'; }).length;
    // a session logged without rep counts would otherwise read as almost no work
    var tail = (st.sets >= exCount) ? (st.sets + ' sets') : (exCount + ' ex \u00b7 ' + st.sets + ' set' + (st.sets===1?'':'s'));
    h += '<button class="row" data-act="open" data-k="'+k+'">'
      + '<span class="rdate">'+fmtShort(k)+'</span>'
      + '<span class="rtype">'+esc(sessionLabel(s))
      + (s.mode==='trainer' ? ' <span class="spat">trainer</span>' : '')
      + (s.mode==='rest' ? ' <span class="spat">rest</span>' : '')+'</span>'
      + '<span class="rsets">'+((s.back==='Achy'||s.back==='Sore')?'<span class="flag">\u25cf </span>':'')+tail+'</span></button>';
  });

  var week = 0, cutoff = shiftKey(todayKey(), -6);
  keys.forEach(function(k){ if(k >= cutoff) week += sessionStats(state.sessions[k]).sets; });
  h += '<div class="footnote">Last 7 days: <strong>'+week+'</strong> working sets across '
    + keys.filter(function(k){return k>=cutoff;}).length + ' sessions.</div>';
  view.innerHTML = h;
}

function renderProgress(){
  var names = {};
  Object.keys(state.sessions).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind==='lift'||!it.kind) names[it.name] = true;
    });
  });
  var list = Object.keys(names).sort();
  if(!progressPick || list.indexOf(progressPick)<0) progressPick = list[0]||'';

  var h = '';

  var span = dataSpanDays();
  h += '<div class="eyebrow">Overview</div><div class="rangeseg">';
  RANGES.forEach(function(r){
    var locked = span < r.need;
    h += '<button data-act="ovrange" data-v="'+r.d+'" aria-pressed="'+(ovRange===r.d)+'"'
      + (locked?' disabled title="Needs about '+Math.ceil((r.need-span)/7)+' more weeks of data"':'')
      + '>'+esc(r.label)+'</button>';
  });
  h += '</div>';

  var lockedNext = RANGES.filter(function(r){ return span < r.need; })[0];
  if(lockedNext){
    h += '<div class="footnote" style="margin-top:-6px">The '+esc(lockedNext.label)+' view unlocks in about '
      + Math.ceil((lockedNext.need - span)/7) + ' weeks, once there is enough logged to say anything honest.</div>';
  }

  var ov = overviewStats(ovRange);
  h += '<div class="ovgrid">'
    + '<div><b>'+ov.sessions+'</b><span>sessions</span></div>'
    + '<div><b>'+ov.sets+'</b><span>working sets</span></div>'
    + '<div><b>'+(ov.vol>=1000?Math.round(ov.vol/1000)+'k':ov.vol)+'</b><span>lb lifted</span></div>'
    + '<div><b>'+ov.perWeek+'</b><span>per week</span></div>'
    + '<div><b>'+ov.cardio+'</b><span>min cardio</span></div>'
    + '<div><b>'+ov.prs+'</b><span>records</span></div>'
    + '</div>';

  if(ov.bwFrom && ov.bwTo && ov.bwFrom !== ov.bwTo){
    var diff = ov.bwTo - ov.bwFrom;
    h += '<div class="footnote" style="margin-top:-4px">Weight '+(diff<0?'down':'up')+' '
      + Math.abs(diff).toFixed(1)+' lb over this period, '+ov.bwFrom+' to '+ov.bwTo+'.</div>';
  }

  var stk = weekStreak();
  var pips = '';
  for(var q=0;q<Math.max(stk.target, stk.thisWeek);q++) pips += '<div class="pip'+(q<stk.thisWeek?' on':'')+'"></div>';
  h += '<div class="streak"><div class="big">'+stk.current+'</div><div class="txt">'
    + '<b>week'+(stk.current===1?'':'s')+' running</b> with at least '+stk.target+' sessions. '
    + 'Best so far: '+stk.best+'. '
    + (stk.thisWeek >= stk.target
        ? 'This week is already counted.'
        : (stk.target - stk.thisWeek) + ' more session' + ((stk.target-stk.thisWeek)===1?'':'s') + ' keeps it alive this week.')
    + '<div class="pips">'+pips+'</div></div></div>';

  h += '<div class="footnote" style="margin-top:-6px">Streaks here count <strong>weeks</strong>, not days &mdash; '
    + 'so rest days, deloads and a bad night never break one. A streak you can only keep by training through pain '
    + 'is a streak worth losing.</div>';

  var pc = phaseComparison();
  if(pc){
    h += '<div class="eyebrow" style="margin-top:22px">Your own numbers by cycle phase</div>'
      + '<table class="wktable"><thead><tr><th>Phase</th><th>Sessions</th><th>Avg sets</th><th>Avg volume</th></tr></thead><tbody>';
    PHASES.forEach(function(ph){
      var b = pc[ph];
      h += '<tr><td class="ph">'+esc(ph)+'</td><td>'+b.sessions+'</td><td>'
        + (b.sessions? b.avgSets : '\u2014')+'</td><td>'
        + (b.sessions? b.avgVol.toLocaleString()+' lb' : '\u2014')+'</td></tr>';
    });
    h += '</tbody></table>'
      + '<div class="footnote">Give this a few months before reading anything into it. Large reviews find '
      + 'no consistent effect of cycle phase on strength, so nothing in this app changes your prescribed '
      + 'weights by phase &mdash; but if a clear pattern shows up in <em>your</em> numbers, that is worth knowing.</div>';
  }

  var wl = [];
  var seenEx = {};
  Object.keys(state.sessions).sort().reverse().forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind !== 'lift' || seenEx[it.name]) return;
      var done = (it.sets||[]).map(function(r,i){ return { r:+r||0, l:loadAt(it,i) }; })
                              .filter(function(x){ return x.r>0; });
      if(!done.length) return;
      seenEx[it.name] = 1;
      wl.push({ name:it.name, eq:it.eq||'', load:Math.max.apply(null, done.map(function(x){ return x.l; })),
                ps:!!it.ps, k:k });
    });
  });
  if(wl.length){
    wl.sort(function(a,b){ return (a.eq||'').localeCompare(b.eq||'') || a.name.localeCompare(b.name); });
    var ms = milestones();
  var got = ms.filter(function(x){ return x.done; });
  var next = ms.filter(function(x){ return !x.done; }).slice(0,4);
  h += '<div class="eyebrow" style="margin-top:24px">Milestones &middot; '+got.length+' of '+ms.length+'</div>'
    + '<div class="badges">';
  got.concat(next).forEach(function(x){
    var pct = Math.min(100, Math.round(x.have / x.need * 100));
    h += '<div class="badge'+(x.done?' got':'')+'">'
      + '<div class="bn">'+(x.done?'\u2605 ':'')+esc(x.name)+'</div>'
      + '<div class="bb">'+esc(x.blurb)+'</div>'
      + (x.done ? '' :
         '<div class="bp">'+x.have.toLocaleString()+' of '+x.need.toLocaleString()+(x.unit?' '+x.unit:'')+'</div>'
         + '<div class="track"><i style="width:'+pct+'%"></i></div>')
      + '</div>';
  });
  h += '</div>';
  if(next.length){
    h += '<div class="footnote">Showing what you have earned plus the next few in reach. '
      + 'The rest appear as you close on them.</div>';
  }

  h += '<div class="eyebrow" style="margin-top:22px">Your working weights</div>'
      + '<table class="wktable"><thead><tr><th>Exercise</th><th>Equipment</th><th>Last load</th></tr></thead><tbody>';
    wl.forEach(function(x){
      h += '<tr><td>'+esc(x.name)+'</td><td style="color:var(--steel)">'+esc(x.eq||'\u2014')+'</td>'
        + '<td class="strong">'+(x.load ? x.load+' lb'+(x.ps?'/side':'') : 'BW')+'</td></tr>';
    });
    h += '</tbody></table>'
      + '<div class="footnote">These numbers are not comparable with each other, and they are not supposed to be. '
      + 'A cable stack, a plate-loaded machine and a dumbbell each move a different amount of resistance for the '
      + 'same effort &mdash; 30 lb on a cable curl and 15 lb on a preacher curl can be the same work for your biceps. '
      + 'Leverage, cable pulleys and machine friction all differ. Every prediction and record in this app compares '
      + 'an exercise only against itself.</div>';
  }

  h += '<div class="eyebrow" style="margin-top:22px">Exercise history</div>';
  if(!list.length){
    view.innerHTML = h + '<div class="empty"><strong>Nothing to chart yet</strong>Log a couple of sessions and progress shows up here.</div>';
    return;
  }
  h += '<select class="picker" data-act="pick">';
  list.forEach(function(n){ h += '<option'+(n===progressPick?' selected':'')+'>'+esc(n)+'</option>'; });
  h += '</select>';

  h += formPanel(progressPick);

  var pb = bestEver(progressPick, null);
  if(pb.reps){
    h += '<div class="lastline" style="margin-left:0">Best so far &middot; <b>'
      + (pb.load ? pb.load+' lb' : 'bodyweight') + ' &times; ' + pb.reps + ' reps</b></div>';
  }

  var rows = [];
  Object.keys(state.sessions).sort().forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.name!==progressPick || (it.kind && it.kind!=='lift')) return;
      var reps=0, vol=0;
      (it.sets||[]).forEach(function(r,i){ reps += (+r||0); vol += (+r||0)*loadAt(it,i); });
      rows.push({ k:k, w:topLoad(it), sets:(it.sets||[]).length, reps:reps, vol:vol,
                  best:Math.max.apply(null,(it.sets||[0]).map(Number)) });
    });
  });

  var metricVol = rows.some(function(r){ return r.w>0; });
  var maxv = Math.max.apply(null, rows.map(function(r){ return metricVol?r.vol:r.reps; }).concat([1]));
  var recent = rows.slice(-10);

  h += '<div class="eyebrow" style="margin-top:18px">'+(metricVol?'Volume per session (lb)':'Total reps per session')+'</div>';
  h += '<div class="bars">';
  recent.forEach(function(r){
    var v = metricVol?r.vol:r.reps;
    h += '<div class="bar" style="height:'+Math.max(3, Math.round(v/maxv*108))+'px" title="'+v+'"></div>';
  });
  h += '</div><div class="barlabels">';
  recent.forEach(function(r){ h += '<span>'+parseKey(r.k).getDate()+'/'+(parseKey(r.k).getMonth()+1)+'</span>'; });
  h += '</div>';

  h += '<table class="ptable"><thead><tr><th>Date</th><th>Load</th><th>Sets</th><th>Reps</th><th>Best set</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){
    h += '<tr><td>'+fmtShort(r.k)+'</td><td class="strong">'+(r.w?r.w+' lb':'BW')+'</td><td>'+r.sets+'</td><td>'+r.reps+'</td><td>'+r.best+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="footnote">Add one rep to a set, or step the stack up 5&nbsp;lb, once you finish every set at the top of your rep range with clean form.</div>';

  var tally = groupTally(14);
  var peak = Math.max.apply(null, GROUPS.map(function(g){ return tally[g]; }).concat([1]));
  h += '<div class="eyebrow" style="margin-top:24px">Balance &middot; sets per muscle group, last 14 days</div><div class="bars2">';
  GROUPS.forEach(function(g){
    var v = tally[g], pct = Math.round(v/peak*100);
    h += '<div class="grprow"><span class="grpname">'+esc(g)+'</span>'
      + '<span class="grptrack"><i class="'+(v < peak*0.34 ? 'low' : '')+'" style="width:'+Math.max(pct,2)+'%"></i></span>'
      + '<span class="grpnum">'+v+'</span></div>';
  });
  h += '</div>';
  var starved = GROUPS.filter(function(g){ return tally[g] < peak*0.34; });
  h += '<div class="footnote">'
    + (starved.length
        ? 'Running light on <strong>'+esc(starved.join(', '))+'</strong> compared with your heaviest group. '
          + 'Red bars are the ones to feed next.'
        : 'Reasonably even across the board over the last two weeks.')
    + '</div>';

  view.innerHTML = h;
}

function renderWhy(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return (state.sessions[k].items||[]).length; }).sort();
  var sessions = keys.length;
  var sets = 0, reps = 0, vol = 0, cardio = 0, mus = {};
  keys.forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    sets += st.sets; reps += st.reps; vol += st.vol;
    (s.items||[]).forEach(function(it){ if(it.kind==='cardio') cardio += cardioMins(it); });
    var m = muscleTally(s).muscles;
    Object.keys(m).forEach(function(n){ mus[n] = (mus[n]||0) + m[n]; });
  });
  var span = keys.length ? Math.max(1, Math.round((parseKey(keys[keys.length-1]) - parseKey(keys[0]))/86400000)+1) : 0;
  var perWeek = span ? Math.round(sessions/span*7*10)/10 : 0;

  var prs = [];
  keys.forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      var p = isPR(it, k);
      if(p) prs.push(it.name);
    });
  });

  var heaviest = [];
  var names = {};
  keys.forEach(function(k){ (state.sessions[k].items||[]).forEach(function(it){
    if(it.kind==='lift') names[it.name] = true; }); });
  Object.keys(names).forEach(function(n){
    var b = bestEver(n, null);
    if(b.load) heaviest.push({ n:n, l:b.load, r:b.reps });
  });
  heaviest.sort(function(a,b){ return b.l - a.l; });

  var h = '<div class="whyhero">'
    + '<div class="whyeyebrow">Where you are</div>'
    + '<h2>'+sessions+' sessions, '+sets+' working sets, '
    + (vol>=1000 ? Math.round(vol/1000)+',000' : vol) + ' pounds moved.</h2>'
    + '<p>Over '+span+' days, averaging '+perWeek+' sessions a week, plus '+cardio+' minutes of walking. '
    + 'That is not a small thing after years away from a gym.</p></div>';

  h += '<div class="eyebrow">What we actually built</div>'
    + '<div class="whycard"><h3>A record instead of a memory</h3>'
    + '<p>The single reason people stall is that they cannot remember what they lifted last time, so they '
    + 'lift the same thing forever. Every exercise here shows you last week\'s numbers before you start. '
    + 'That one line is what turns exercise into training.</p></div>';

  h += '<div class="whycard"><h3>Progressive overload, calculated for you</h3>'
    + '<p>Muscle adapts to a demand slightly beyond what it has met before. Slightly. The Plan tab reads what you '
    + 'actually did and asks for a little more \u2014 ten percent when you sailed through fifteen reps, nothing at all '
    + 'when you scraped through eight. That judgement is the whole job of a coach, and it is now written down '
    + 'rather than guessed.</p></div>';

  h += '<div class="whycard"><h3>A spine that is protected, not avoided</h3>'
    + '<p>Your disc history shaped every choice in here. No barbell back squats, no conventional deadlifts, '
    + 'machines and supported positions where possible, core work that resists movement rather than crunching '
    + 'through it. Not because loading is dangerous \u2014 because the wrong loading is, and the right loading is '
    + 'the best protection you can buy. The strongest thing you can do for a vulnerable back is build the hips, '
    + 'glutes and trunk around it.</p></div>';

  h += '<div class="whycard"><h3>Warning signs written down before you need them</h3>'
    + '<p>The back check takes one tap. If a flare ever comes, the fortnight before it will be readable \u2014 '
    + 'what you loaded, what jumped, how you felt. And the flare protocol in the Plan tab was written while '
    + 'nothing hurt, which is the only time anyone thinks clearly about it.</p></div>';

  h += '<div class="eyebrow">What this earns you</div>';

  h += '<div class="whycard gain"><h3>Muscle kept while fat goes</h3>'
    + '<p>In a calorie deficit the body will take weight from wherever it likes, including muscle. Lifting is the '
    + 'signal that says keep this. Two people can lose the same twenty pounds and end up in completely different '
    + 'bodies; the difference is almost entirely whether they trained while they did it.</p></div>';

  h += '<div class="whycard gain"><h3>A metabolism that does not sink</h3>'
    + '<p>Muscle is expensive tissue to keep. Lose it and your maintenance calories fall, which is why weight lost '
    + 'through diet alone tends to come back. Holding your muscle holds the floor under everything.</p></div>';

  h += '<div class="whycard gain"><h3>Bone, joints and the next forty years</h3>'
    + '<p>Loaded exercise is one of very few things that increases bone density, and for a woman in her thirties '
    + 'that matters enormously \u2014 you are building the reserve you will draw on decades from now. Strong hips and '
    + 'hamstrings also mean the everyday moments that ambush a bad back, lifting a box or twisting for a seatbelt, '
    + 'stop being a gamble.</p></div>';

  h += '<div class="whycard gain"><h3>Endurance you feel outside the gym</h3>'
    + '<p>Incline walking after the machines builds the aerobic base with almost no impact. Stairs stop being an '
    + 'event. That is the change most people notice first, and it usually arrives before the scale moves.</p></div>';

  if(heaviest.length){
    h += '<div class="eyebrow">Your strongest lifts so far</div><table class="ptable"><tbody>';
    heaviest.slice(0,6).forEach(function(x){
      h += '<tr><td>'+esc(x.n)+'</td><td class="strong">'+x.l+' lb</td><td>'+x.r+' reps</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="footnote">An 85 lb leg curl is not a beginner number. Your legs are genuinely strong \u2014 '
      + 'it is your upper body that has catching up to do, and that is where the fastest gains are sitting.</div>';
  }

  var mn = Object.keys(mus).sort(function(a,b){ return mus[b]-mus[a]; });
  if(mn.length){
    h += '<div class="eyebrow">Everything you have trained</div><div class="mtags">';
    mn.forEach(function(n){
      h += '<span class="mtag">'+esc(n)+' <b>'+Math.round(mus[n])+'</b></span>';
    });
    h += '</div><div class="footnote">Numbers are weighted sets. Thin ones are not failures, just the next '
      + 'thing to feed.</div>';
  }

  h += '<div class="whycard last"><h3>The honest part</h3>'
    + '<p>This app cannot make you lose weight. The deficit comes from the kitchen and nothing here touches it. '
    + 'What it can do is make certain that while the weight comes off you are getting stronger rather than '
    + 'smaller and weaker \u2014 and give you a record clear enough that on the days it feels like nothing is '
    + 'happening, you can open it and see that something plainly is.</p></div>';

  view.innerHTML = h;
}

function renderPlan(){

  h += '<div class="ctrl"><div class="clbl">Time today</div><div class="seg">';

        + '<span class="rxtip" style="display:block">'+(open ? 'Tap to close' : 'Tap to see how it is done')+'</span>'

  h += '<div class="eyebrow">Your week \u00b7 4 strength, 2 cardio</div>'

    + 'Legs \u00b7 <strong>Cardio &amp; core</strong> \u00b7 rest. Put the cardio days between strength days rather than '

  h += '<div class="eyebrow">Rotation \u00b7 machine-led</div>';
  PLANS.forEach(function(p, i){
    h += '<div class="plan"><h3>'+esc(p.name)+'</h3><div class="tagline">'+esc(p.tag)+'</div><ol>';

    h += '</ol><button class="btn btn-ghost btn-wide" data-act="loadplan" data-i="'+i+'">Load into '+fmtShort(cur)+'</button></div>';
  });
  h += '<div class="protocol"><h3>If your back flares</h3>'
    + '<p>Written down now so you are not deciding in the middle of it.</p>'
    + '<h4>What usually sets one off</h4><ul>'
    + '<li>A jump in load or volume that is bigger than the week before.</li>'
    + '<li>A new movement pushed hard the first time you meet it.</li>'
    + '<li>Bending and twisting under load, especially within an hour of waking &mdash; discs are most swollen first thing in the morning.</li>'
    + '<li>A bad week of sleep, stress, or long stretches of sitting. These matter more than most people expect.</li>'
    + '</ul>'
    + '<h4>The signal to back off</h4>'
    + '<p>Muscle soreness that eases as you move is fine and expected. Back stiffness that is <em>worse</em> the next morning than it was that night is the one to respect. Drop the load on hinging and squatting for a week rather than pushing through.</p>'
    + '<h4>If one starts</h4><ul>'
    + '<li>Do not go to bed. Bed rest makes flares last longer &mdash; keep walking, little and often.</li>'
    + '<li>Stop the direction that hurts, not all training. Upper body machines, seated and supported, are usually fine.</li>'
    + '<li>Short, frequent position changes beat long stretches of anything, including sitting.</li>'
    + '<li>Log it here with the back check so you can see afterwards what the week before it looked like.</li>'
    + '</ul>'
    + '<h4>See a doctor promptly if</h4>'
    + '<p>Pain travels below the knee, you get numbness, pins and needles or weakness in a leg or foot, or there is any change in bladder or bowel control. That last one is same-day urgent. This app is a training log, not medical advice.</p>'
    + '</div>';
  h += '<div class="eyebrow" style="margin-top:22px">Recover</div>';
  h += '<div class="footnote" style="margin-top:0">Every session you have sent me is written into this app. '
    + 'Rebuilding fills in any of those seven dates that are missing or empty. It will not touch a date you have already filled in.</div>'
    + '<button class="btn btn-solid btn-wide" data-act="rebuild" style="margin-bottom:14px">Rebuild my seven logged sessions</button>';
  if(!snaps.length){
    h += '<div class="footnote" style="margin-top:0">No earlier copies stored yet. From now on the app keeps the last five, '
      + 'taken each time it opens.</div>';
  } else {
    h += '<div class="footnote" style="margin-top:0">Copies taken automatically each time the app opened. '
      + 'Restoring replaces what is on screen now.</div>';
    snaps.forEach(function(sn, i){
      var n = 0, when = new Date(sn.t);
      try {
        var o = JSON.parse(sn.raw);
        n = Object.keys(o.sessions||{}).filter(function(k){ return (o.sessions[k].items||[]).length; }).length;
      } catch(e){}
      h += '<button class="row" data-act="snap" data-i="'+i+'">'
        + '<span class="rdate">'+pad2(when.getMonth()+1)+'/'+pad2(when.getDate())+' '
        + pad2(when.getHours())+':'+pad2(when.getMinutes())+'</span>'
        + '<span class="rtype">'+n+' session'+(n===1?'':'s')+'</span>'
        + '<span class="rsets">Restore</span></button>';
    });
  }

  h += '<div class="eyebrow" style="margin-top:22px">Backup</div>'
    + '<div class="footnote" style="margin-top:0">Your log lives in this app. Copy the text below somewhere safe now and then, '
    + 'and you can paste it back if anything is ever lost.</div>'
    + '<button class="btn btn-solid btn-wide" data-act="download" style="margin-bottom:6px">Download backup file</button>'
    + '<label class="btn btn-ghost btn-wide" style="display:block;text-align:center;margin-bottom:8px">Load a backup file'
    + '<input type="file" accept=".json,application/json,text/plain" data-act="upload" style="display:none"></label>'
    + (backupOpen
        ? '<textarea class="notes" id="backupbox" style="min-height:110px;font-family:\'IBM Plex Mono\',monospace;font-size:11px" '
          + 'onclick="this.select()">'+esc(JSON.stringify(state))+'</textarea>'
          + '<button class="btn btn-ghost btn-wide" data-act="restore" style="margin-top:8px">Restore from pasted text</button>'
          + '<button class="btn btn-ghost btn-wide" data-act="backup" style="margin-top:6px">Hide</button>'
        : '<button class="btn btn-ghost btn-wide" data-act="backup">Show backup text</button>');

  h += '<div class="footnote">Loading a day adds the exercises with three empty sets each, so you fill in what you '
    + 'actually complete. Cardio goes after the machines. These templates skip barbell back squats and conventional '
    + 'deadlifts in favour of leg press and hack squat, and keep core work to stability holds rather than crunches.</div>';
  view.innerHTML = h;
}

/* ============ events ============ */
document.querySelector('.tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if(!b) return;
  flush();
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t===b); });
  render();
});

view.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var a = b.dataset.act, s = session(cur);

  if(a==='day'){ flush(); cur = shiftKey(cur, +b.dataset.d); render(); }
  else if(a==='addset'){
    var ia=find(s,b.dataset.id);
    ia.sets.push(null);
    if(ia.kind!=='hold'){
      if(!ia.loads) ia.loads = [];
      ia.loads.push(ia.loads.length ? ia.loads[ia.loads.length-1] : (+ia.weight||0));
    }
    save(); render();
  }
  else if(a==='delset'){
    var id2=find(s,b.dataset.id); id2.sets.pop(); if(id2.loads) id2.loads.pop(); save(); render();
  }
  else if(a==='copylast'){
    var prior = Object.keys(state.sessions).filter(function(k){
      return k < cur && (state.sessions[k].items||[]).length; }).sort();
    if(!prior.length){ toast('No earlier session'); return; }
    var src = state.sessions[prior[prior.length-1]];
    s.type = s.type || src.type;
    (src.items||[]).forEach(function(it){
      var c = JSON.parse(JSON.stringify(it)); c.id = uid(); s.items.push(c);
    });
    save(); render(); toast('Copied '+fmtShort(prior[prior.length-1]));
  }
  else if(a==='tick'){
    var ti = find(s, b.dataset.id);
    ti.done = !ti.done; save(); render();
  }
  else if(a==='addwarm'){
    var items = mobilityItems(warmupFor(s), 'prep');
    s.items = items.concat(s.items);
    save(); render(); toast('Warm up added');
  }
  else if(a==='addcool'){
    var cool = mobilityItems(stretchFor(s), 'cool');
    if(!cool.length){ toast('Log some exercises first'); return; }
    s.items = s.items.concat(cool);
    save(); render(); toast('Stretches added');
  }
  else if(a==='moveup' || a==='movedn'){
    var ix = -1;
    s.items.forEach(function(it, i){ if(it.id === b.dataset.id) ix = i; });
    var to = ix + (a === 'moveup' ? -1 : 1);
    if(ix > -1 && to >= 0 && to < s.items.length){
      var moved = s.items.splice(ix, 1)[0];
      s.items.splice(to, 0, moved);
      save(); render();
    }
  }
  else if(a==='insertafter'){
    insertAt = b.dataset.id;
    render();
    var f = document.getElementById('newname'); if(f) f.focus();
  }
  else if(a==='delitem'){
    s.items = s.items.filter(function(it){ return it.id!==b.dataset.id; }); save(); render();
  }
  else if(a==='holdstart'){ startHold(b.dataset.id, +b.dataset.i); }
  else if(a==='holdstop'){ stopHold(false); }
  else if(a==='ps'){ var ip=find(s,b.dataset.id); ip.ps = !ip.ps; save(); render(); }
  else if(a==='ss'){
    var itm = find(s, b.dataset.id), seq = ['','A','B','C','D'];
    itm.ss = seq[(seq.indexOf(itm.ss||'')+1) % seq.length];
    save(); render();
  }
  else if(a==='kind'){ newKind = b.dataset.v; render(); document.getElementById('newname').focus(); }
  else if(a==='rec'){ /* handled on input */ }
  else if(a==='period'){
    s.periodStart = !s.periodStart;
    if(s.periodStart && !s.phase) s.phase = 'Menstrual';
    save(); render();
  }
  else if(a==='phase'){
    s.phase = (s.phase === b.dataset.v ? '' : b.dataset.v);
    save(); render();
  }
  else if(a==='back'){ s.back = (s.back===b.dataset.v ? '' : b.dataset.v); save(); render(); }
  else if(a==='form'){ openForm = (openForm===b.dataset.id ? '' : b.dataset.id); render(); }
  else if(a==='rxfocus'){ rxFocus = b.dataset.v; rxPlan = null; render(); }
  else if(a==='rxmin'){ rxMin = +b.dataset.v; rxPlan = null; render(); }
  else if(a==='rxmode'){ rxMode = b.dataset.v; rxPlan = null; render(); }
  else if(a==='mode'){
    s.mode = (s.mode === b.dataset.v ? '' : b.dataset.v);
    save(); render();
  }
  else if(a==='nextup'){ nextOpen = !nextOpen; render(); }
  else if(a==='addnext'){
    var nm = b.dataset.n, ld = b.dataset.l === '' ? 0 : +b.dataset.l;
    var kind = guessKind(nm);
    var it = { id:uid(), name:nm, kind:kind, eq:guessEquip(nm, ld) };
    if(kind === 'cardio'){ it.minutes = 0; it.incline = 0; it.speed = 0; }
    else if(kind === 'hold'){ it.sets = [0,0,0]; }
    else { it.sets = [0,0,0]; it.loads = [ld,ld,ld]; }
    placeItem(s, it);
    nextOpen = false; save(); render(); toast(nm + ' added');
  }
  else if(a==='ovrange'){ ovRange = +b.dataset.v; render(); }
  else if(a==='segadd'){
    var ic = find(s, b.dataset.id);
    ic.segs = segsOf(ic).slice();
    var last = ic.segs[ic.segs.length-1] || { m:0, i:0, s:0 };
    ic.segs.push({ m:0, i:last.i||0, s:last.s||0 });
    save(); render();
  }
  else if(a==='segdel'){
    var id2 = find(s, b.dataset.id);
    id2.segs = segsOf(id2).slice();
    id2.segs.splice(+b.dataset.i, 1);
    if(!id2.segs.length) id2.segs = [{ m:0, i:0, s:0 }];
    save(); render();
  }
  else if(a==='markdeload'){
    s.deload = !s.deload;
    if(s.deload) toast('Deload week set');
    save(); render();
  }
  else if(a==='setuptoggle'){ openSetup = (openSetup===b.dataset.id ? '' : b.dataset.id); render(); }
  else if(a==='usesetup'){
    var su = find(s, b.dataset.id); su.setup = b.dataset.v; save(); render();
  }
  else if(a==='notetoggle'){ openNote = (openNote===b.dataset.id ? '' : b.dataset.id); render();
    var nf = document.querySelector('.exnote'); if(nf) nf.focus();
  }
  else if(a==='finish'){
    reviewFor = (reviewFor === cur ? '' : cur);
    render();
    if(reviewFor){
      var rv = document.querySelector('.review');
      if(rv && rv.scrollIntoView) rv.scrollIntoView({block:'start'});
    }
  }
  else if(a==='rvsave'){
    var k = b.dataset.k, sess = session(k);
    var txt = reviewText(k);
    sess.coach = (sess.coach ? sess.coach + '\n\n' : '') + txt;
    save(); render(); toast('Saved to coach notes');
  }
  else if(a==='rxform'){ rxOpen = (rxOpen === b.dataset.n ? '' : b.dataset.n); render(); }
  else if(a==='rxgo'){
    rxPlan = designSession({ focus:rxFocus, minutes:rxMin, mode:rxMode, variant:0 });
    rxVariant = 0; rxOpen = '';
    render();
  }
  else if(a==='rxshuffle'){
    rxVariant++;
    rxPlan = designSession({ focus:rxFocus, minutes:rxMin, mode:rxMode, variant:rxVariant });
    rxOpen = '';
    render();
  }
  else if(a==='rxswap'){
    if(!rxPlan) return;
    var ix = +b.dataset.i, cur2 = rxPlan.blocks[ix];
    if(!cur2) return;
    var inPlan = {};
    rxPlan.blocks.forEach(function(x){ inPlan[x.name] = 1; });
    var wantRegion = regionOf(cur2.name);
    var sameRegion = (rxPlan.pool||[]).filter(function(x){
      return !inPlan[x.n] && regionOf(x.n) === wantRegion;
    });
    var sameRole = (rxPlan.pool||[]).filter(function(x){
      return !inPlan[x.n] && x.role === cur2.role;
    });
    var alts = sameRegion.length ? sameRegion : sameRole;
    if(!alts.length){ toast('No other option for that slot'); return; }
    var pick = alts[0];
    var pr = prescribe(pick.n, rxPlan.mode);
    rxPlan.blocks[ix] = {
      name:pick.n, sets:cur2.sets, reps:pick.reps, load:pr.load,
      eq:pr.eq || guessEquip(pick.n, 0), ps:pr.ps, why:pr.why,
      note:pick.note, ss:pick.ss, role:pick.role
    };
    rxOpen = '';
    render();
    toast('Swapped for ' + pick.n);
  }
  else if(a==='rxload'){
    var r = rxPlan; if(!r) return;
    if(!s.type) s.type = r.focus;
    if(!r.cardioDay){
      s.items.push({ id:uid(), name:'Incline walk', kind:'cardio', minutes:r.warm, incline:9, speed:2.3 });
    }
    r.blocks.forEach(function(bl){
      if(bl.role === 'cardio'){
        s.items.push({ id:uid(), name:bl.name, kind:'cardio',
                       minutes:bl.mins||0, incline:bl.inc||0, speed:bl.mph||0,
                       tgt: bl.dose });
        return;
      }
      var kind = guessKind(bl.name);
      var it = { id:uid(), name:bl.name, kind:kind, eq:bl.eq, ss:bl.ss||'', ps:!!bl.ps,
                 tgt: bl.sets+' × '+bl.reps+(bl.load ? ' @ '+bl.load+' lb' : '') };
      if(kind === 'cardio'){ it.minutes = 0; it.incline = 0; it.speed = 0; }
      else {
        it.sets = []; it.loads = [];
        for(var q=0;q<bl.sets;q++){ it.sets.push(0); it.loads.push(bl.load || 0); }
      }
      s.items.push(it);
    });
    if(!r.cardioDay){
      if(!r.cardioDay){
      s.items.push({ id:uid(), name:'Incline walk', kind:'cardio', minutes:r.cardio, incline:9, speed:2.4 });
    }
    }
    save(); tab = 'log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0); toast('Session loaded');
  }
  else if(a==='backup'){ backupOpen = !backupOpen; render(); }
  else if(a==='restore'){
    var bx = document.getElementById('backupbox');
    if(!bx){ return; }
    try {
      var incoming = JSON.parse(bx.value);
      if(!incoming || !incoming.sessions) throw new Error('shape');
      state = incoming; migrate(); pending = true; flush();
      backupOpen = false; pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); toast('Restored');
    } catch(err){ toast('That text is not a valid backup'); }
  }
  else if(a==='retryboot'){ boot(); }
  else if(a==='download'){
    try {
      var blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = 'paramount-log-' + todayKey() + '.json';
      document.body.appendChild(link); link.click();
      setTimeout(function(){ document.body.removeChild(link); URL.revokeObjectURL(url); }, 400);
      toast('Backup downloaded');
    } catch(e){
      backupOpen = true; render();
      toast('Download blocked — copy the text instead');
    }
  }
  else if(a==='rebuild'){
    var n = restoreSeed(false);
    pending = true; flush();
    pickDate(); tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0);
    toast(n ? n+' sessions restored' : 'Nothing was missing');
  }
  else if(a==='snap'){
    var sn = snaps[+b.dataset.i];
    if(!sn) return;
    try {
      var o = JSON.parse(sn.raw);
      if(!o || !o.sessions) throw new Error('shape');
      pushSnap(JSON.stringify(state), 'before restore');
      state = o; state.seeded = true; migrate();
      pending = true; flush();
      pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); window.scrollTo(0,0); toast('Restored');
    } catch(e){ toast('That copy could not be read'); }
  }
  else if(a==='paste'){ pasteOpen = true; render();
    var pb=document.getElementById('pastebox'); if(pb) pb.focus();
  }
  else if(a==='dopaste'){
    var box = document.getElementById('pastebox');
    var got = box ? parseLines(box.value) : [];
    if(!got.length){ toast('Nothing to read'); return; }
    got.forEach(function(it){ s.items.push(it); });
    pasteOpen = false; save(); render();
    toast(got.length+' exercises added');
  }
  else if(a==='additem'){ addItem(); }
  else if(a==='pickex'){
    var f = document.getElementById('newname');
    if(f) f.value = b.dataset.n;
    addItem();
  }
  else if(a==='open'){ cur = b.dataset.k; tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0);
  }
  else if(a==='loadplan'){
    var p = PLANS[+b.dataset.i];
    if(!s.type) s.type = p.name;
    p.items.forEach(function(n){
      s.items.push({ id:uid(), name:n, kind:guessKind(n), eq:guessEquip(n,0),
                     weight:0, sets:[null,null,null], loads:[0,0,0] });
    });
    save(); tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0); toast(p.name+' loaded');
  }
});

view.addEventListener('input', function(e){
  var el = e.target, a = el.dataset.act;
  if(el.id === 'newname'){ renderSuggestions(el.value); return; }
  if(!a) return;
  var s = session(cur);
  if(a==='set'){ var it=find(s, el.dataset.id); it.sets[+el.dataset.i] = el.value===''?null:+el.value; softStats(); save(); }
  else if(a==='load'){
    var it3=find(s, el.dataset.id);
    if(!it3.loads) it3.loads = (it3.sets||[]).map(function(){ return +it3.weight||0; });
    it3.loads[+el.dataset.i] = el.value===''?0:+el.value; softStats(); save();
  }
  else if(a==='f'){ var i2=find(s, el.dataset.id); i2[el.dataset.k] = el.value===''?0:+el.value; softStats(); save(); }
  else if(a==='notes'){ s.notes = el.value; save(); }
  else if(el.id === 'newname'){ renderSuggestions(el.value); }
  else if(a==='coach'){ s.coach = el.value; save(); }
  else if(a==='setupval'){ find(s, el.dataset.id).setup = el.value; save(); }
  else if(a==='seg'){
    var its = find(s, el.dataset.id);
    its.segs = segsOf(its).slice();
    var g = its.segs[+el.dataset.i];
    if(g){
      g[el.dataset.k] = el.value === '' ? 0 : +el.value;
      /* the legacy single-value fields stay in step so nothing else breaks */
      its.minutes = cardioMins(its);
      its.incline = its.segs[0].i; its.speed = its.segs[0].s;
    }
    save();
    var tot = document.querySelector('.card[data-cid="'+el.dataset.id+'"] .segtot');
    if(tot) tot.textContent = cardioMins(its) + ' min total';
    softStats();
  }
  else if(a==='rec'){
    if(el.dataset.k === 'sleep'){
      s.sleep = parseSleep(el.value);
    } else {
      s[el.dataset.k] = el.value === '' ? '' : +el.value;
    }
    save();
    var box = document.querySelector('.recov .verdict'), v = recoveryVerdict(s);
    if(box && v){ box.textContent = v.text; box.className = 'verdict' + (v.warn ? ' warn' : ''); }
  }
  else if(a==='exnote'){ find(s, el.dataset.id).note = el.value; save(); }
});

view.addEventListener('change', function(e){
  var el = e.target, a = el.dataset.act; if(!a) return;
  if(a==='type'){
    var ses = session(cur);
    ses.type = el.value;
    ses.typeManual = !!el.value;      // blank returns it to automatic
    save(); render();
  }
  else if(a==='eq'){ find(session(cur), el.dataset.id).eq = el.value; save(); }
  else if(a==='pickdate'){ if(el.value){ cur = el.value; render(); } }
  else if(a==='pick'){ progressPick = el.value; render(); }
});

view.addEventListener('change', function(e){
  if(!e.target || e.target.dataset.act !== 'upload') return;
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var o = JSON.parse(fr.result);
      if(!o || !o.sessions) throw new Error('shape');
      pushSnap(JSON.stringify(state), 'before file restore');
      state = o; state.seeded = true; migrate();
      pending = true; flush();
      pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); window.scrollTo(0,0); toast('Backup loaded');
    } catch(err){ toast('That file is not a valid backup'); }
  };
  fr.readAsText(file);
});

view.addEventListener('focusout', function(e){
  var t = e.target;
  if(!t || !t.dataset || !t.dataset.act) return;
  if(t.dataset.act === 'rec' && t.dataset.k === 'sleep'){
    t.value = fmtSleep(session(cur).sleep);
  }
  flush();
  if(t.dataset.act === 'setupval'){ openSetup = ''; render(); return; }
  if(t.dataset.act === 'set' && cur === todayKey() && +t.value > 0 && !rest){
    startRest(REST_DEFAULT);
  }
});

view.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.id==='newname'){ e.preventDefault(); addItem(); }
});

function find(s,id){ 
  for(var i=0;i<s.items.length;i++){ if(s.items[i].id===id) return s.items[i]; }
  return {sets:[]};
}
function nameOf(sess, id){
  var n = '';
  (sess.items||[]).forEach(function(x){ if(x.id === id) n = x.name; });
  return n;
}

function placeItem(sess, it){
  if(insertAt){
    var ix = -1;
    sess.items.forEach(function(x,i){ if(x.id === insertAt) ix = i; });
    if(ix > -1){ sess.items.splice(ix+1, 0, it); insertAt = ''; return; }
    insertAt = '';
  }
  sess.items.push(it);
}

function addItem(){
  var el = document.getElementById('newname'); if(!el) return;
  var name = el.value.trim();
  if(!name){ el.focus(); return; }
  var kind = newKind, g = guessKind(name);
  if(g!=='lift') kind = g;
  var it = { id:uid(), name:name, kind:kind };
  if(kind==='cardio'){ it.minutes=0; it.incline=0; it.speed=0; }
  else if(kind==='hold'){ it.sets=[null,null,null]; }
  else { it.weight=0; it.sets=[null,null,null]; it.loads=[0,0,0]; }
  if(kind!=='cardio') it.eq = guessEquip(name, 0);
  placeItem(session(cur), it);
  if(LIBRARY.indexOf(name)<0) LIBRARY.push(name);
  save(); render();
  var box = document.getElementById('sugg'); if(box) box.innerHTML = '';
  var f = document.getElementById('newname'); if(f){ f.value = ''; f.focus(); }
}
function refreshBadges(){
  var s = session(cur);
  (s.items||[]).forEach(function(it){
    var slot = document.getElementById('pr-'+it.id);
    if(!slot) return;
    var pr = isPR(it, cur);
    var want = pr ? '<span class="prbadge">PR &middot; '+esc(pr)+'</span>' : '';
    if(slot.innerHTML !== want) slot.innerHTML = want;
  });
}

function softStats(){
  refreshBadges();
  var st = sessionStats(session(cur));
  var b = document.querySelectorAll('.sh-stats b');
  if(b.length===3){
    b[0].textContent = st.sets;
    b[1].textContent = st.reps;
    b[2].textContent = st.vol ? st.vol.toLocaleString() : '\u2014';
  }
  var plates = document.querySelectorAll('.plate');
  var total = Math.min(st.sets, plates.length);
  for(var i=0;i<plates.length;i++) plates[i].className = 'plate' + (i<total ? '' : ' empty');
}

/* ============ boot ============ */
view.innerHTML = '<div class="empty"><strong>Loading</strong>One moment.</div>';

function restoreSeed(replaceAll){
  try { pushSnap(JSON.stringify(state), 'before rebuild'); } catch(e){}
  var mine = state.sessions || {};
  state.sessions = {}; seed();
  var fresh = state.sessions;
  state.sessions = mine;
  var n = 0;
  Object.keys(fresh).forEach(function(k){
    if(replaceAll || !mine[k] || !(mine[k].items||[]).length){ mine[k] = fresh[k]; n++; }
    else if(!mine[k].coach && fresh[k].coach){ mine[k].coach = fresh[k].coach; }
  });
  migrate();
  return n;
}

function mergeSeed(){
  if(state.seeded) return;      // seed data is injected exactly once, ever
  var mine = state.sessions || {};
  state.sessions = {};
  seed();
  var fresh = state.sessions;
  state.sessions = mine;
  Object.keys(fresh).forEach(function(k){
    var have = mine[k];
    if(!have || !(have.items||[]).length){ mine[k] = fresh[k]; }
    else if(!have.coach && fresh[k].coach){ have.coach = fresh[k].coach; }
  });
}

function boot(){
  loadSnaps().then(function(sn){ snaps = sn; }).then(function(){
  return load().then(function(r){
    if(!r.ok){
      // Do NOT seed or save — that would overwrite whatever is really stored.
      readOK = false;
      setStatus(r.why === 'nostore' ? 'nostore' : 'read');
      if(r.why === 'nostore'){
        readOK = true;              // in-memory only; nothing to overwrite
        setStatus('nostore');
        state = { sessions:{} }; seed(); migrate(); pickDate(); render();
      } else {
        view.innerHTML = '<div class="empty"><strong>Could not read your saved log</strong>'
          + 'Nothing has been changed or overwritten. This is usually temporary.</div>'
          + '<button class="btn btn-solid btn-wide" data-act="retryboot">Try again</button>';
      }
      return;
    }
    readOK = true;
    if(r.empty){ state = { sessions:{} }; seed(); }
    else {
      pushSnap(JSON.stringify(r.data), 'on open');
      state = r.data; mergeSeed();
    }
    state.seeded = true;
    migrate();
    var anyLogged = Object.keys(state.sessions||{}).some(function(k){
      return (state.sessions[k].items||[]).length; });
    if(!anyLogged) restoreSeed(true);
    pending = true; flush();
    pickDate();
    render();
  }); });
}

function pickDate(){
  var logged = Object.keys(state.sessions).filter(function(k){
    return (state.sessions[k].items||[]).length; }).sort();
  cur = logged.length ? logged[logged.length-1] : todayKey();
}

boot();
</script>
