<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#123128">

<style>
:root{
  --bone:#E9EAE6;
  --paper:#F8F8F5;
  --ink:#14171A;
  --steel:#767C80;
  --pine:#1E4F43;
  --pine-deep:#123128;
  --brass:#C08F1F;
  --brass-lite:#E3B84A;
  --rule:#D3D4CE;
  --warn:#8C3A24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bone);
  color:var(--ink);
  font-family:'Barlow',system-ui,sans-serif;
  font-size:16px;line-height:1.4;
  padding-bottom:64px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto}

/* ---------- masthead ---------- */
.mast{
  background:var(--pine-deep);
  color:var(--paper);
  padding:18px 18px 14px;
  border-bottom:3px solid var(--brass);
}
.mast h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:30px;line-height:1;
  letter-spacing:.14em;text-transform:uppercase;
}
.sstat{margin-top:5px !important}
.sstat.ok{color:rgba(248,248,245,.55) !important}
.sstat.busy{color:var(--brass-lite) !important}
.sstat.bad{color:#F0A08A !important}
.mast p{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brass-lite);margin-top:7px;
}

/* ---------- tabs ---------- */
.tabs{display:flex;background:var(--pine);border-bottom:1px solid var(--pine-deep)}
.tab{
  flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.12em;text-transform:uppercase;
  color:rgba(248,248,245,.6);padding:14px 4px 12px;
  border-bottom:3px solid transparent;
}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass-lite)}
.tab:focus-visible{outline:2px solid var(--brass-lite);outline-offset:-4px}

main{padding:18px 14px 40px}

/* ---------- date bar ---------- */
.datebar{display:flex;align-items:stretch;gap:8px;margin-bottom:14px}
.datebar .nav{
  width:46px;flex:0 0 46px;background:var(--paper);border:1px solid var(--rule);
  border-radius:2px;font-size:20px;color:var(--ink);cursor:pointer;line-height:1;
}
.datefield{
  flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:8px 12px;text-align:center;position:relative;
}
.datefield .dow{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:var(--steel);text-transform:uppercase;
}
.datefield .dnum{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;
  letter-spacing:.06em;text-transform:uppercase;line-height:1.1;
}
.datefield input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}

/* ---------- session head ---------- */
.session-head{
  background:var(--pine);color:var(--paper);border-radius:2px;
  padding:14px 14px 12px;display:flex;gap:14px;margin-bottom:16px;
}
.stackmeter{flex:0 0 34px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
.plate{height:5px;background:var(--brass);border-radius:1px;opacity:.95}
.plate.empty{background:rgba(248,248,245,.14)}
.session-meta{flex:1;min-width:0}
.session-meta label{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--brass-lite);margin-bottom:4px;
}
.session-meta select{
  width:100%;appearance:none;background:transparent;border:0;border-bottom:1px solid rgba(227,184,74,.5);
  color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;
  letter-spacing:.08em;text-transform:uppercase;padding:0 0 4px;cursor:pointer;
}
.session-meta select option{color:#14171A}
.stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.stat b{
  display:block;font-family:'IBM Plex Mono',monospace;font-weight:500;
  font-size:18px;color:#fff;line-height:1.1;
}
.stat span{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(248,248,245,.55);
}

/* ---------- exercise card ---------- */
.card{
  background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--pine);
  border-radius:2px;padding:12px 12px 10px;margin-bottom:10px;position:relative;
}
.card.cardio{border-left-color:var(--brass)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.idx{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);
  font-weight:600;padding-top:4px;
}
.card h3{
  flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;
  letter-spacing:.03em;text-transform:uppercase;line-height:1.15;
}
.kill{
  appearance:none;border:0;background:transparent;color:var(--steel);
  font-size:20px;line-height:1;padding:2px 4px;cursor:pointer;
}
.kill:hover{color:var(--warn)}
.card.hold{border-left-color:var(--steel)}
.card.ss{border-left-style:double;border-left-width:6px}
.ssbadge{
  appearance:none;border:1px solid var(--brass);background:var(--brass);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  padding:4px 6px;border-radius:2px;cursor:pointer;line-height:1;margin-top:3px;
}
.ssbadge.off{background:transparent;color:var(--steel);border-color:var(--rule)}
.loadrow{display:flex;align-items:center;gap:6px;margin:8px 0 2px 22px}
.loadrow label{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--steel);
}
input.num{
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--ink);
  background:#fff;border:1px solid var(--rule);border-radius:2px;
  padding:6px 4px;text-align:center;width:58px;height:34px;
}
input.num:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}

.sets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 22px;align-items:flex-end}
.setchip{width:56px}
.setchip em{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-style:normal;
  letter-spacing:.14em;color:var(--steel);text-align:center;margin-bottom:3px;
}
.setchip input{
  width:56px;height:46px;font-size:19px;
  font-family:'IBM Plex Mono',monospace;font-weight:500;
  background:#fff;border:1px solid var(--rule);border-radius:2px;text-align:center;color:var(--ink);
}
.setchip input:focus{outline:2px solid var(--brass);outline-offset:-1px}
.setchip input.setload{
  height:30px;font-size:12px;color:var(--steel);margin-top:3px;
  background:#F1F1EC;border-top:0;
}
.setchip input.setload:focus{color:var(--ink)}
.setbtns{display:flex;gap:6px}
.setbtn{
  width:46px;height:46px;border:1px dashed var(--steel);background:transparent;
  border-radius:2px;font-size:22px;color:var(--steel);cursor:pointer;line-height:1;
}
.setbtn:hover{border-color:var(--pine);color:var(--pine)}

/* ---------- buttons ---------- */
.btn{
  appearance:none;cursor:pointer;border-radius:2px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.12em;text-transform:uppercase;padding:13px 16px;
}
.btn-solid{background:var(--pine);color:#fff;border:1px solid var(--pine)}
.btn-solid:hover{background:var(--pine-deep)}
.btn-ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.btn-ghost:hover{background:rgba(30,79,67,.07)}
.btn-wide{display:block;width:100%;margin-top:6px}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.adder{display:flex;gap:8px;margin-top:14px}
.adder input[type=text]{
  flex:1;min-width:0;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:12px;font-family:'Barlow',sans-serif;font-size:16px;color:var(--ink);
}
.adder input[type=text]:focus{outline:2px solid var(--brass);outline-offset:-1px}
.kindtog{display:flex;gap:0;margin-top:8px}
.kindtog button{
  flex:1;background:var(--paper);border:1px solid var(--rule);color:var(--steel);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:9px 4px;cursor:pointer;
}
.kindtog button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.backcheck{margin:-6px 0 16px}
.backcheck .lbl{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--steel);margin-bottom:6px;
}
.backcheck .opts{display:flex;gap:0}
.backcheck button{
  flex:1;background:var(--paper);border:1px solid var(--rule);color:var(--steel);
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:11px 2px;cursor:pointer;
}
.backcheck button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.backcheck button[aria-pressed="true"][data-v="Achy"],
.backcheck button[aria-pressed="true"][data-v="Sore"]{background:var(--warn);border-color:var(--warn)}

.eqrow{display:flex;align-items:center;gap:8px;margin:8px 0 2px 22px;flex-wrap:wrap}
select.eqsel{
  appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0h8L4 6z' fill='%23767C80'/></svg>") no-repeat right 8px center;
  border:1px solid var(--rule);border-radius:2px;padding:7px 24px 7px 9px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink);cursor:pointer;
}
select.eqsel:focus{outline:2px solid var(--brass);outline-offset:-1px}
.formbtn{
  appearance:none;border:1px solid var(--rule);background:#fff;color:var(--steel);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  padding:4px 7px;border-radius:2px;cursor:pointer;line-height:1;margin-top:3px;
}
.formbtn[aria-expanded="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.formpanel{
  display:flex;gap:12px;margin:10px 0 2px 22px;padding:10px;
  background:#EFF1EE;border:1px solid var(--rule);border-radius:2px;
}
.movesvg{flex:0 0 108px;width:108px;height:108px;background:#fff;border:1px solid var(--rule);border-radius:2px}
.movesvg .fig{fill:none;stroke:#1E4F43;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.movesvg circle.fig{fill:#1E4F43;stroke:none}
.movesvg .load{fill:none;stroke:#C08F1F;stroke-width:5;stroke-linecap:round}
.movesvg .gear{fill:none;stroke:#B9BCB6;stroke-width:3;stroke-linecap:round}
.formtext{flex:1;min-width:0}
.formtext .pat{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin-bottom:6px;
}
.formtext ul{margin:0 0 0 15px;padding:0}
.formtext li{font-size:13.5px;line-height:1.45;color:#33383C;padding:1px 0}
.formtext .care{color:var(--warn);font-weight:500}
@media (prefers-reduced-motion:reduce){.movesvg animate{display:none}}
.flag{color:var(--warn);font-family:'IBM Plex Mono',monospace;font-size:11px}
.alarm{
  background:#F6EFEA;border:1px solid #DCC6B8;border-left:4px solid var(--warn);
  border-radius:2px;padding:12px;margin-bottom:14px;
}
.alarm strong{
  display:block;font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--warn);margin-bottom:4px;
}
.alarm p{font-size:14px;line-height:1.45;color:#3A2E28;margin-bottom:9px}
.protocol{
  background:#F6EFEA;border:1px solid #DCC6B8;border-left:4px solid var(--warn);
  border-radius:2px;padding:14px;margin-top:16px;
}
.protocol h3{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--warn);
}
.protocol h4{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--warn);margin:12px 0 5px;
}
.protocol p,.protocol li{font-size:14.5px;line-height:1.5;color:#3A2E28}
.protocol ul{margin:0 0 0 17px}

/* ---------- misc ---------- */
.empty{
  border:1px dashed var(--steel);border-radius:2px;padding:26px 18px;text-align:center;
  color:var(--steel);
}
.empty strong{
  display:block;font-family:'Barlow Condensed',sans-serif;font-size:19px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:5px;
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--steel);
  border-bottom:1px solid var(--rule);padding-bottom:6px;margin:22px 0 12px;
}
.eyebrow:first-child{margin-top:0}
.notes{
  width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:11px;font-family:'Barlow',sans-serif;font-size:15px;color:var(--ink);
  resize:vertical;min-height:64px;
}
.notes:focus{outline:2px solid var(--brass);outline-offset:-1px}
.coach{
  background:#FBF6E9;border:1px solid #E0D4AE;border-left:4px solid var(--brass);
  border-radius:2px;padding:12px 12px 6px;
}
.coach textarea{
  width:100%;background:transparent;border:0;resize:vertical;min-height:180px;
  font-family:'Barlow',sans-serif;font-size:14.5px;line-height:1.55;color:#2E2A20;
}
.coach textarea:focus{outline:2px solid var(--brass);outline-offset:2px}

.row{
  display:flex;align-items:center;gap:12px;background:var(--paper);
  border:1px solid var(--rule);border-left:4px solid var(--pine);border-radius:2px;
  padding:12px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer;
}
.row:hover{background:#fff}
.row .rdate{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);
  flex:0 0 76px;letter-spacing:.04em;
}
.row .rtype{
  flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
  letter-spacing:.05em;text-transform:uppercase;
}
.row .rsets{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass)}

.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin:4px 0 10px;
  border-bottom:1px solid var(--rule);padding-bottom:0}
.bar{flex:1;background:var(--pine);border-radius:1px 1px 0 0;min-height:3px;position:relative}
.bar:last-child{background:var(--brass)}
.barlabels{display:flex;gap:5px}
.barlabels span{
  flex:1;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--steel);
  text-align:center;letter-spacing:-.02em;
}
.ptable{width:100%;border-collapse:collapse;margin-top:6px}
.ptable th{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--steel);text-align:left;padding:6px 6px;
  border-bottom:1px solid var(--rule);font-weight:500;
}
.ptable td{
  font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 6px;
  border-bottom:1px solid var(--rule);
}
.ptable td.strong{color:var(--pine);font-weight:600}
select.picker{
  width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:12px;font-family:'Barlow',sans-serif;font-size:16px;color:var(--ink);
}

.plan{background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:14px;margin-bottom:10px}
.plan h3{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;
  letter-spacing:.06em;text-transform:uppercase;
}
.plan .tagline{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass);margin:3px 0 9px;
}
.plan ol{margin:0 0 12px 18px;font-size:15px;color:#33383C}
.plan li{padding:1.5px 0}
.footnote{font-size:13.5px;color:var(--steel);line-height:1.5;margin-top:14px}
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);
  background:var(--pine-deep);color:#fff;padding:11px 20px;border-radius:2px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;transition:transform .28s ease;z-index:50;border-left:3px solid var(--brass);
}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Paramount Log</h1>
    <p>Matawan &middot; strength &amp; conditioning diary</p>
    <p class="sstat busy" id="sstat">Loading…</p>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="log" aria-selected="true">Log</button>
    <button class="tab" role="tab" data-tab="history" aria-selected="false">History</button>
    <button class="tab" role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button class="tab" role="tab" data-tab="plan" aria-selected="false">Plan</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast">Saved</div>

<script>
/* ============ state ============ */
var KEY = 'paramountlog:v1';
var state = { sessions: {} };
var cur = todayKey();
var tab = 'log';
var newKind = 'lift';
var progressPick = '';
var pasteOpen = false;
var openForm = '';
var backupOpen = false;
var saveTimer = null;

var TYPES = ['Pull','Push','Legs — quad','Legs — hamstring/glute','Upper','Full body','Cardio only','Rest'];

var LIBRARY = ['Lat pull down','Seated row','Chest supported row','Cable tricep pull down','Back extension',
'Pushups on knee','Bench reverse push ups','Face pull','Cable bicep curl','Chest press machine',
'Incline chest press','Shoulder press machine','Lateral raise','Leg press','Hack squat','Leg extension',
'Seated leg curl','Hip abduction','Glute kickback machine','Standing calf raise','Plank','Dead bug',
'Bird dog','Pallof press','Treadmill','Incline walk','Stationary bike','Elliptical',
'Bulgarian split squat','Romanian deadlift','Walking lunges','Squats','Stairmaster','Hip abduction',
'Seated calf raise','Glute extension','Cable crossover','Chest fly machine','Dumbbell chest fly',
'Concentration bicep curl','Bicep curl','Bench press','Chest press machine','Dead bug','Side plank'];

var CARDIO_WORDS = ['treadmill','walk','bike','elliptical','run','stair','row erg','cardio'];

var PLANS = [
  {name:'Pull', tag:'Day 1 · back, rear delts, biceps',
   items:['Lat pull down','Seated row','Chest supported row','Face pull','Cable bicep curl','Back extension','Plank']},
  {name:'Legs — quad', tag:'Day 2 · no spinal loading',
   items:['Leg press','Hack squat','Leg extension','Seated leg curl','Standing calf raise','Bird dog']},
  {name:'Push', tag:'Day 3 · chest, shoulders, triceps',
   items:['Chest press machine','Incline chest press','Shoulder press machine','Lateral raise','Cable tricep pull down','Pushups on knee','Dead bug']},
  {name:'Legs — hamstring/glute', tag:'Day 4 · posterior chain',

/* ============ helpers ============ */
function pad(n){ return (n<10?'0':'')+n; }
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftKey(k,days){ var d=parseKey(k); d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtLong(k){ var d=parseKey(k); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
function fmtShort(k){ var d=parseKey(k); return DOW[d.getDay()].slice(0,3).toUpperCase()+' '+pad(d.getDate())+' '+MON[d.getMonth()].toUpperCase(); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
var HOLD_WORDS = ['plank','hold','dead hang','wall sit','pallof'];
function guessKind(name){
  var n = name.toLowerCase(), i;
  for(i=0;i<CARDIO_WORDS.length;i++){ if(n.indexOf(CARDIO_WORDS[i])>-1) return 'cardio'; }
  for(i=0;i<HOLD_WORDS.length;i++){ if(n.indexOf(HOLD_WORDS[i])>-1) return 'hold'; }
  return 'lift';
}
function session(k){
  if(!state.sessions[k]) state.sessions[k] = { type:'', notes:'', items:[] };
  return state.sessions[k];
}
function loadAt(it, i){
  if(it.loads && it.loads[i]!==undefined && it.loads[i]!==null) return +it.loads[i]||0;
  return +it.weight||0;
}
function topLoad(it){
  var m=0; (it.sets||[]).forEach(function(_,i){ m=Math.max(m, loadAt(it,i)); }); return m;
}
function migrate(){
  Object.keys(state.sessions||{}).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind==='cardio') return;
      if(it.kind==='hold'){ if(!it.eq) it.eq = guessEquip(it.name,0); return; }
      if(!it.loads) it.loads = (it.sets||[]).map(function(){ return +it.weight||0; });
      if(!it.eq) it.eq = guessEquip(it.name, topLoad(it));
      if(it.eq==='Bodyweight' && /back extension|hyperextension/i.test(it.name) && topLoad(it)>0){
        it.eq = 'Weight plate';
      }
    });
  });
}
function sessionStats(s){
  var sets=0, reps=0, vol=0;
  (s.items||[]).forEach(function(it){
    if(it.kind==='cardio') return;
    (it.sets||[]).forEach(function(r, i){
      sets++;
      if(it.kind==='hold') return;
      reps += (+r||0); vol += (+r||0) * loadAt(it, i);
    });
  });
  return {sets:sets, reps:reps, vol:vol};
}

/* ============ storage backends ============ */
/* Try the host's storage first; fall back to this browser's own storage;
   fall back again to memory-only. Whichever is live is reported in the header. */
var BACKEND = 'none';

function lsUsable(){
  try {
    var k = '__pl_probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch(e){ return false; }
}

function pickBackend(){
  if(window.storage && typeof window.storage.get === 'function') return 'host';
  if(lsUsable()) return 'local';
  return 'none';
}

function sget(key){
  if(BACKEND === 'host'){
    return window.storage.get(key).then(function(r){
      return (r && r.value) ? r.value : null;
    });
  }
  if(BACKEND === 'local'){
    try { return Promise.resolve(window.localStorage.getItem(key)); }
    catch(e){ return Promise.reject(e); }
  }
  return Promise.resolve(null);
}

function sset(key, val){
  if(BACKEND === 'host'){
    return window.storage.set(key, val).catch(function(e){
      // host storage is present but not working — demote once and keep the data
      if(lsUsable()){
        BACKEND = 'local';
        try { window.localStorage.setItem(key, val); return; } catch(e2){}
      }
      throw e;
    });
  }
  if(BACKEND === 'local'){
    try { window.localStorage.setItem(key, val); return Promise.resolve(); }
    catch(e){ return Promise.reject(e); }
  }
  return Promise.reject(new Error('no backend'));
}

function backendLabel(){
  if(BACKEND === 'host')  return 'Saving to Claude storage';
  if(BACKEND === 'local') return 'Saving to this browser';
  return 'Not saving — memory only';
}

/* ============ storage ============ */
/* Read result is one of: {ok:true,data} | {ok:true,empty:true} | {ok:false}
   A failed READ must never trigger a write, or a transient error overwrites good data. */
var pending = false, retryTimer = null, readOK = false;
var SNAPKEY = 'paramountlog:snaps';
var snaps = [];

function loadSnaps(){
  if(BACKEND === 'none') return Promise.resolve([]);
  return sget(SNAPKEY).then(function(v){
    if(v){ try { return JSON.parse(v)||[]; } catch(e){ return []; } }
    return [];
  }).catch(function(){ return []; });
}
function pushSnap(raw, label){
  if(!raw || BACKEND === 'none') return;
  if(snaps.length && snaps[0].raw === raw) return;      // unchanged, skip
  snaps.unshift({ t:Date.now(), label:label||'', raw:raw });
  snaps = snaps.slice(0,5);
  sset(SNAPKEY, JSON.stringify(snaps)).catch(function(){});
}

function load(){
  BACKEND = pickBackend();
  if(BACKEND === 'none') return Promise.resolve({ok:false, why:'nostore'});
  return sget(KEY).then(function(v){
    if(v){
      try { return {ok:true, data:JSON.parse(v)}; }
      catch(e){ return {ok:false, why:'corrupt'}; }
    }
    return {ok:true, empty:true};
  }).catch(function(e){
    var msg = String((e && e.message) || e || '');
    if(/not found|no such|missing|404/i.test(msg)) return {ok:true, empty:true};
    return {ok:false, why:'read'};
  });
}

function save(){
  if(!readOK) return;           // never write over data we failed to read
  pending = true;
  setStatus('unsaved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}

function flush(){
  clearTimeout(saveTimer);
  if(!pending || !readOK) return;
  if(BACKEND === 'none'){ setStatus('nostore'); return; }
  var payload;
  try { payload = JSON.stringify(state); } catch(e){ setStatus('error'); return; }
  pending = false;
  setStatus('saving');
  sset(KEY, payload).then(function(){
    setStatus('saved');
  }).catch(function(){
    pending = true;
    setStatus('error');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flush, 3000);
  });
}

function pad2(n){ return (n<10?'0':'')+n; }
function setStatus(k){
  var el = document.getElementById('sstat');
  if(!el) return;
  var d = new Date(), t = pad2(d.getHours())+':'+pad2(d.getMinutes());
  var map = {
    saved:   ['Saved '+t+' &middot; '+backendLabel(), 'ok'],
    saving:  ['Saving…', 'busy'],
    unsaved: ['Unsaved changes', 'busy'],
    error:   ['Save failed — retrying', 'bad'],
    nostore: ['Nothing is being saved — download a backup before you close', 'bad'],
    read:    ['Could not read saved data', 'bad']
  };
  var m = map[k] || map.saved;
  el.innerHTML = m[0];
  el.className = 'sstat ' + m[1];
}

/* flush before anything that could end the session */
window.addEventListener('pagehide', flush);
window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flush();
});

var toastTimer=null;

function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },1600);
}

function guessEquip(name, load){
  var n = (name||'').toLowerCase();
  if(/barbell/.test(n)) return 'Barbell';
  if(/dumbbell|db\b|concentration/.test(n)) return 'Dumbbell';
  if(/kettle/.test(n)) return 'Kettlebell';
  if(/plate|disk|disc|weighted/.test(n)) return 'Weight plate';
  if(/cable|crossover|pull ?down|pushdown|push ?down|kickback/.test(n)) return 'Cable';
  if(/machine|leg press|leg extension|leg curl|abduction|adduction|hack|chest supported|pec deck|smith|calf raise|glute extension|hip thrust|row/.test(n)) return 'Machine';
  if(/deadlift|rdl/.test(n)) return 'Dumbbell';
  if(/band/.test(n)) return 'Band';
  if(/back extension|hyperextension/.test(n)) return (+load>0) ? 'Weight plate' : 'Bodyweight';
  if(/plank|push ?up|lunge|split|rollout|flutter|leg raise|bird dog|dead bug|dip|squat/.test(n)) return (+load>0) ? 'Dumbbell' : 'Bodyweight';
  if(/bench press|chest press|shoulder press|fly|curl|raise|row|press/.test(n)) return (+load>0) ? 'Dumbbell' : 'Machine';
  return (+load>0) ? 'Machine' : 'Bodyweight';
}

var NOWEIGHT = /(without|no)\s*weight|body\s*weight|\bbw\b/i;

function parseLines(text){
  var out = [];
  text.split(/\n+/).forEach(function(raw){
    var line = raw.replace(/^[\s\-\u2013\u2014\u2022*]+/,'').replace(/\s+/g,' ').trim();
    if(!line) return;
    var low = line.toLowerCase();

    if(guessKind(low)==='cardio'){
      var mn=/([\d.]+)\s*(?:min|minute)/.exec(low),
          ic=/([\d.]+)\s*(?:incl|incline|%)/.exec(low),
          sp=/([\d.]+)\s*(?:mph|speed)/.exec(low);
      var cname = cleanName(/^([^\d]*)/.exec(line)[0]);
      if(!cname){
        var tail = line.replace(/[\d.]+\s*(?:min|minute|mph|incl|incline|speed|%|s)?/gi,' ')
                       .replace(/\s+/g,' ').trim();
        cname = cleanName(tail) || 'Cardio';
      }
      cname = cname.charAt(0).toUpperCase()+cname.slice(1);
      out.push({id:uid(), name:cname, kind:'cardio',
        minutes:mn?+mn[1]:0, incline:ic?+ic[1]:0, speed:sp?+sp[1]:0});
      return;
    }

    var head = /^([^\d]*)/.exec(line)[0];
    var name = cleanName(head) || cleanName(line);
    var data = line.slice(head.length);

    if(/sec|second/.test(low) || guessKind(low)==='hold'){
      var nums = (data.match(/[\d.]+/g)||[]).map(Number);
      var secs;
      if(nums.length===2 && nums[0]<=6 && nums[1]>=5){ secs=[]; for(var q=0;q<nums[0];q++) secs.push(nums[1]); }
      else if(nums.length){ secs = nums; }
      else secs = [30];
      out.push({id:uid(), name:name, kind:'hold', eq:guessEquip(name,0), sets:secs.slice(0,8)});
      return;
    }

    var sets=[], loads=[], lastLoad=0;
    data.split(/[,;]+/).forEach(function(chunk){
      var c = chunk.trim(); if(!c) return;
      if(NOWEIGHT.test(c)) lastLoad = 0;
      var lm = /([\d.]+)\s*(?:lbs|lb|#|pounds)/i.exec(c);
      if(lm){ lastLoad = +lm[1]; c = c.replace(lm[0], ' '); }
      var reps = (c.match(/[\d.]+/g)||[]).map(Number).filter(function(n){ return n>0 && n<=60; });
      reps.forEach(function(n){ sets.push(Math.round(n)); loads.push(lastLoad); });
    });
    if(!sets.length){ sets=[0,0,0]; loads=[lastLoad,lastLoad,lastLoad]; }
    out.push({id:uid(), name:name, kind:'lift', eq:guessEquip(name, lastLoad),
              sets:sets.slice(0,8), loads:loads.slice(0,8)});
  });
  return out;
}
function cleanName(t){
  return t.replace(/[\s\-\u2013\u2014:*x\u00d7=]+$/i,'').replace(/^[\s\-]+/,'').trim();
}

var view = document.getElementById('view');

function render(){
  if(tab==='log') renderLog();
  else if(tab==='history') renderHistory();
  else if(tab==='progress') renderProgress();
  else renderPlan();
}

function renderLog(){
  var s = session(cur), st = sessionStats(s);
  var h = '';

  h += '<div class="datebar">'
    + '<button class="nav" data-act="day" data-d="-1" aria-label="Previous day">&lsaquo;</button>'
    + '<div class="datefield"><div class="dow">'+esc(DOW[parseKey(cur).getDay()])+'</div>'
    + '<div class="dnum">'+esc(fmtLong(cur))+'</div>'
    + '<input type="date" value="'+cur+'" data-act="pickdate" aria-label="Choose date"></div>'
    + '<button class="nav" data-act="day" data-d="1" aria-label="Next day">&rsaquo;</button>'
    + '</div>';

  var plates='', total=Math.min(st.sets,30);
  for(var i=0;i<30;i++) plates += '<div class="plate'+(i<total?'':' empty')+'"></div>';

  h += '<div class="session-head"><div class="stackmeter">'+plates+'</div><div class="session-meta">'
    + '<label>Session type</label><select data-act="type">'
    + '<option value="">— set type —</option>';
  TYPES.forEach(function(t){ h += '<option'+(s.type===t?' selected':'')+'>'+esc(t)+'</option>'; });
  h += '</select><div class="stats">'
    + '<div class="stat"><b>'+st.sets+'</b><span>working sets</span></div>'
    + '<div class="stat"><b>'+st.reps+'</b><span>total reps</span></div>'
    + '<div class="stat"><b>'+st.vol.toLocaleString()+'</b><span>lb volume</span></div>'
    + '</div></div></div>';

  if(BACKEND === 'none'){
    h += '<div class="alarm"><strong>Nothing is being saved</strong>'
      + '<p>This copy cannot store anything, so today\'s entries will be gone when you close it. '
      + 'Download a backup before you leave, and load it back next time.</p>'
      + '<button class="btn btn-solid btn-wide" data-act="download">Download backup file</button></div>';
  }

  var BACK = ['Fine','Aware','Achy','Sore'];
  h += '<div class="backcheck"><div class="lbl">Back check &mdash; how did it feel today?</div><div class="opts">';
  BACK.forEach(function(b){
    h += '<button data-act="back" data-v="'+b+'" aria-pressed="'+(s.back===b)+'">'+b+'</button>';

    h += '<div class="card'+cls+'">'

      + '<h3>'+esc(it.name)+'</h3>'
      + '<button class="formbtn" data-act="form" data-id="'+it.id+'" aria-expanded="'+(openForm===it.id)+'" '

      + (it.kind==='cardio' ? '' :
         '<button class="ssbadge'+(it.ss?'':' off')+'" data-act="ss" data-id="'+it.id+'" '
         + 'aria-label="Superset group">'+(it.ss ? 'SS '+esc(it.ss) : 'SS')+'</button>')
      + '<button class="kill" data-act="delitem" data-id="'+it.id+'" aria-label="Remove '+esc(it.name)+'">&times;</button></div>';

    if(openForm===it.id) h += formPanel(it.name);

    if(it.kind==='cardio'){
      h += '<div class="loadrow">'
        + '<label>Min</label><input class="num" inputmode="decimal" value="'+(it.minutes||'')+'" data-act="f" data-id="'+it.id+'" data-k="minutes">'
        + '<label>Incline</label><input class="num" inputmode="decimal" value="'+(it.incline||'')+'" data-act="f" data-id="'+it.id+'" data-k="incline">'
        + '<label>Mph</label><input class="num" inputmode="decimal" value="'+(it.speed||'')+'" data-act="f" data-id="'+it.id+'" data-k="speed">'
        + '</div>';
    } else {
      if(it.kind==='hold'){
        h += '<div class="eqrow"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)">Seconds held per set</label></div>';
      } else {
        var tl = topLoad(it);
        h += '<div class="eqrow"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)">Equipment</label>'
          + '<select class="eqsel" data-act="eq" data-id="'+it.id+'" aria-label="Equipment used">';
        EQUIP.forEach(function(q){
          h += '<option'+((it.eq||guessEquip(it.name, tl))===q?' selected':'')+'>'+esc(q)+'</option>';
        });
        h += '</select></div>';
        if(it.kind!=='hold'){
          h += '<div class="loadrow"><label>Reps &middot; load lb per set'
            + (tl ? ' &middot; top ' + tl + ' lb' : ' &middot; bodyweight') + '</label></div>';
        }
      }
      h += '<div class="sets">';
      (it.sets||[]).forEach(function(r, si){
        h += '<div class="setchip"><em>'+(it.kind==='hold'?'SEC ':'SET ')+(si+1)+'</em>'
          + '<input inputmode="numeric" value="'+r+'" data-act="set" data-id="'+it.id+'" data-i="'+si+'" aria-label="Set '+(si+1)+(it.kind==='hold'?' seconds':' reps')+'">'
          + (it.kind==='hold' ? '' :
             '<input class="setload" inputmode="decimal" placeholder="BW" value="'+(loadAt(it,si)||'')+'" data-act="load" data-id="'+it.id+'" data-i="'+si+'" aria-label="Set '+(si+1)+' load in pounds">')
          + '</div>';
      });
      h += '<div class="setbtns">'
        + '<button class="setbtn" data-act="addset" data-id="'+it.id+'" aria-label="Add set">+</button>'
        + (it.sets && it.sets.length ? '<button class="setbtn" data-act="delset" data-id="'+it.id+'" aria-label="Remove last set">&minus;</button>' : '')
        + '</div></div>';
    }
    h += '</div>';
  });

  h += '<div class="adder">'
    + '<input type="text" id="newname" list="lib" placeholder="Add an exercise…" autocomplete="off">'
    + '<button class="btn btn-solid" data-act="additem">Add</button></div>'
    + '<div class="kindtog">'
    + '<button data-act="kind" data-v="lift" aria-pressed="'+(newKind==='lift')+'">Strength</button>'
    + '<button data-act="kind" data-v="cardio" aria-pressed="'+(newKind==='cardio')+'">Cardio</button>'
    + '</div>';

  if(pasteOpen){
    h += '<div class="coach" style="margin-top:12px">'
      + '<textarea id="pastebox" style="min-height:130px" placeholder="Paste your notes, one exercise per line:&#10;Leg curl 55lb*12, 70lb*15, 85lb*12&#10;Knee pushups 12, 10, 8&#10;Treadmill 10 min 9 incline 2.4 mph&#10;Planks 3 30 sec"></textarea>'
      + '<button class="btn btn-solid btn-wide" data-act="dopaste" style="margin:8px 0 6px">Read it in</button>'
      + '</div>';
  } else {
    h += '<button class="btn btn-ghost btn-wide" data-act="paste" style="margin-top:10px">Paste from notes</button>';
  }

  if(s.items.length){
    h += '<div class="footnote" style="margin-top:2px">'
      + '<strong>SS</strong> marks a superset &mdash; two exercises done back to back with no rest between them, '
      + 'then a rest before repeating. Tap SS on both exercises until they show the same letter to pair them.</div>';
  }

  h += '<div class="eyebrow">Coach notes</div>'
    + '<div class="coach"><textarea data-act="coach" placeholder="Feedback on this session — what to hold, what to load up, what to watch.">'
    + esc(s.coach||'') + '</textarea></div>';

  h += '<div class="eyebrow">How it felt</div>'
    + '<textarea class="notes" data-act="notes" placeholder="Energy, aches, machine settings, seat height…">'+esc(s.notes||'')+'</textarea>';

  h += '<datalist id="lib">';
  LIBRARY.forEach(function(n){ h += '<option value="'+esc(n)+'">'; });
  h += '</datalist>';

  view.innerHTML = h;
}

function renderHistory(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return state.sessions[k].items && state.sessions[k].items.length;
  }).sort().reverse();

  var h = '<div class="eyebrow">Logged sessions · '+keys.length+'</div>';
  if(!keys.length){
    h += '<div class="empty"><strong>No sessions yet</strong>Anything you log shows up here, newest first.</div>';
  }
  keys.forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    h += '<button class="row" data-act="open" data-k="'+k+'">'
      + '<span class="rdate">'+fmtShort(k)+'</span>'
      + '<span class="rtype">'+esc(s.type||'Untitled')+'</span>'
      + '<span class="rsets">'+((s.back==='Achy'||s.back==='Sore')?'<span class="flag">\u25cf </span>':'')+st.sets+' sets</span></button>';
  });

  var week = 0, cutoff = shiftKey(todayKey(), -6);
  keys.forEach(function(k){ if(k >= cutoff) week += sessionStats(state.sessions[k]).sets; });
  h += '<div class="footnote">Last 7 days: <strong>'+week+'</strong> working sets across '
    + keys.filter(function(k){return k>=cutoff;}).length + ' sessions.</div>';
  view.innerHTML = h;
}

function renderProgress(){
  var names = {};
  Object.keys(state.sessions).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind==='lift'||!it.kind) names[it.name] = true;
    });
  });
  var list = Object.keys(names).sort();
  if(!progressPick || list.indexOf(progressPick)<0) progressPick = list[0]||'';

  var h = '<div class="eyebrow">Exercise history</div>';
  if(!list.length){
    view.innerHTML = h + '<div class="empty"><strong>Nothing to chart yet</strong>Log a couple of sessions and progress shows up here.</div>';
    return;
  }
  h += '<select class="picker" data-act="pick">';
  list.forEach(function(n){ h += '<option'+(n===progressPick?' selected':'')+'>'+esc(n)+'</option>'; });
  h += '</select>';

  var rows = [];
  Object.keys(state.sessions).sort().forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.name!==progressPick || (it.kind && it.kind!=='lift')) return;
      var reps=0, vol=0;
      (it.sets||[]).forEach(function(r,i){ reps += (+r||0); vol += (+r||0)*loadAt(it,i); });
      rows.push({ k:k, w:topLoad(it), sets:(it.sets||[]).length, reps:reps, vol:vol,
                  best:Math.max.apply(null,(it.sets||[0]).map(Number)) });
    });
  });

  var metricVol = rows.some(function(r){ return r.w>0; });
  var maxv = Math.max.apply(null, rows.map(function(r){ return metricVol?r.vol:r.reps; }).concat([1]));
  var recent = rows.slice(-10);

  h += '<div class="eyebrow" style="margin-top:18px">'+(metricVol?'Volume per session (lb)':'Total reps per session')+'</div>';
  h += '<div class="bars">';
  recent.forEach(function(r){
    var v = metricVol?r.vol:r.reps;
    h += '<div class="bar" style="height:'+Math.max(3, Math.round(v/maxv*108))+'px" title="'+v+'"></div>';
  });
  h += '</div><div class="barlabels">';
  recent.forEach(function(r){ h += '<span>'+parseKey(r.k).getDate()+'/'+(parseKey(r.k).getMonth()+1)+'</span>'; });
  h += '</div>';

  h += '<table class="ptable"><thead><tr><th>Date</th><th>Load</th><th>Sets</th><th>Reps</th><th>Best set</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){
    h += '<tr><td>'+fmtShort(r.k)+'</td><td class="strong">'+(r.w?r.w+' lb':'BW')+'</td><td>'+r.sets+'</td><td>'+r.reps+'</td><td>'+r.best+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="footnote">Add one rep to a set, or step the stack up 5&nbsp;lb, once you finish every set at the top of your rep range with clean form.</div>';
  view.innerHTML = h;
}

function renderPlan(){
  var h = '<div class="eyebrow">Rotation · 5 days, machine-led</div>';
  PLANS.forEach(function(p, i){
    h += '<div class="plan"><h3>'+esc(p.name)+'</h3><div class="tagline">'+esc(p.tag)+'</div><ol>';
    p.items.forEach(function(n){ h += '<li>'+esc(n)+'</li>'; });
    h += '</ol><button class="btn btn-ghost btn-wide" data-act="loadplan" data-i="'+i+'">Load into '+fmtShort(cur)+'</button></div>';
  });
  h += '<div class="protocol"><h3>If your back flares</h3>'
    + '<p>Written down now so you are not deciding in the middle of it.</p>'
    + '<h4>What usually sets one off</h4><ul>'
    + '<li>A jump in load or volume that is bigger than the week before.</li>'
    + '<li>A new movement pushed hard the first time you meet it.</li>'
    + '<li>Bending and twisting under load, especially within an hour of waking &mdash; discs are most swollen first thing in the morning.</li>'
    + '<li>A bad week of sleep, stress, or long stretches of sitting. These matter more than most people expect.</li>'
    + '</ul>'
    + '<h4>The signal to back off</h4>'
    + '<p>Muscle soreness that eases as you move is fine and expected. Back stiffness that is <em>worse</em> the next morning than it was that night is the one to respect. Drop the load on hinging and squatting for a week rather than pushing through.</p>'
    + '<h4>If one starts</h4><ul>'
    + '<li>Do not go to bed. Bed rest makes flares last longer &mdash; keep walking, little and often.</li>'
    + '<li>Stop the direction that hurts, not all training. Upper body machines, seated and supported, are usually fine.</li>'
    + '<li>Short, frequent position changes beat long stretches of anything, including sitting.</li>'
    + '<li>Log it here with the back check so you can see afterwards what the week before it looked like.</li>'
    + '</ul>'
    + '<h4>See a doctor promptly if</h4>'
    + '<p>Pain travels below the knee, you get numbness, pins and needles or weakness in a leg or foot, or there is any change in bladder or bowel control. That last one is same-day urgent. This app is a training log, not medical advice.</p>'
    + '</div>';
  h += '<div class="eyebrow" style="margin-top:22px">Recover</div>';
  h += '<div class="footnote" style="margin-top:0">Every session you have sent me is written into this app. '
    + 'Rebuilding fills in any of those seven dates that are missing or empty. It will not touch a date you have already filled in.</div>'
    + '<button class="btn btn-solid btn-wide" data-act="rebuild" style="margin-bottom:14px">Rebuild my seven logged sessions</button>';
  if(!snaps.length){
    h += '<div class="footnote" style="margin-top:0">No earlier copies stored yet. From now on the app keeps the last five, '
      + 'taken each time it opens.</div>';
  } else {
    h += '<div class="footnote" style="margin-top:0">Copies taken automatically each time the app opened. '
      + 'Restoring replaces what is on screen now.</div>';
    snaps.forEach(function(sn, i){
      var n = 0, when = new Date(sn.t);
      try {
        var o = JSON.parse(sn.raw);
        n = Object.keys(o.sessions||{}).filter(function(k){ return (o.sessions[k].items||[]).length; }).length;
      } catch(e){}
      h += '<button class="row" data-act="snap" data-i="'+i+'">'
        + '<span class="rdate">'+pad2(when.getMonth()+1)+'/'+pad2(when.getDate())+' '
        + pad2(when.getHours())+':'+pad2(when.getMinutes())+'</span>'
        + '<span class="rtype">'+n+' session'+(n===1?'':'s')+'</span>'
        + '<span class="rsets">Restore</span></button>';
    });
  }

  h += '<div class="eyebrow" style="margin-top:22px">Backup</div>'
    + '<div class="footnote" style="margin-top:0">Your log lives in this app. Copy the text below somewhere safe now and then, '
    + 'and you can paste it back if anything is ever lost.</div>'
    + '<button class="btn btn-solid btn-wide" data-act="download" style="margin-bottom:6px">Download backup file</button>'
    + '<label class="btn btn-ghost btn-wide" style="display:block;text-align:center;margin-bottom:8px">Load a backup file'
    + '<input type="file" accept=".json,application/json,text/plain" data-act="upload" style="display:none"></label>'
    + (backupOpen
        ? '<textarea class="notes" id="backupbox" style="min-height:110px;font-family:\'IBM Plex Mono\',monospace;font-size:11px" '
          + 'onclick="this.select()">'+esc(JSON.stringify(state))+'</textarea>'
          + '<button class="btn btn-ghost btn-wide" data-act="restore" style="margin-top:8px">Restore from pasted text</button>'
          + '<button class="btn btn-ghost btn-wide" data-act="backup" style="margin-top:6px">Hide</button>'
        : '<button class="btn btn-ghost btn-wide" data-act="backup">Show backup text</button>');

  h += '<div class="footnote">Loading a day adds the exercises with three empty sets each, so you fill in what you '
    + 'actually complete. Cardio goes after the machines. These templates skip barbell back squats and conventional '
    + 'deadlifts in favour of leg press and hack squat, and keep core work to stability holds rather than crunches.</div>';
  view.innerHTML = h;
}

/* ============ events ============ */
document.querySelector('.tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if(!b) return;
  flush();
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t===b); });
  render();
});

view.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var a = b.dataset.act, s = session(cur);

  if(a==='day'){ flush(); cur = shiftKey(cur, +b.dataset.d); render(); }
  else if(a==='addset'){
    var ia=find(s,b.dataset.id);
    var lastR = ia.sets.length ? ia.sets[ia.sets.length-1] : (ia.kind==='hold'?30:10);
    ia.sets.push(lastR);
    if(ia.kind!=='hold'){
      if(!ia.loads) ia.loads = [];
      ia.loads.push(ia.loads.length ? ia.loads[ia.loads.length-1] : (+ia.weight||0));
    }
    save(); render();
  }
  else if(a==='delset'){
    var id2=find(s,b.dataset.id); id2.sets.pop(); if(id2.loads) id2.loads.pop(); save(); render();
  }
  else if(a==='copylast'){
    var prior = Object.keys(state.sessions).filter(function(k){
      return k < cur && (state.sessions[k].items||[]).length; }).sort();
    if(!prior.length){ toast('No earlier session'); return; }
    var src = state.sessions[prior[prior.length-1]];
    s.type = s.type || src.type;
    (src.items||[]).forEach(function(it){
      var c = JSON.parse(JSON.stringify(it)); c.id = uid(); s.items.push(c);
    });
    save(); render(); toast('Copied '+fmtShort(prior[prior.length-1]));
  }
  else if(a==='delitem'){
    s.items = s.items.filter(function(it){ return it.id!==b.dataset.id; }); save(); render();
  }
  else if(a==='ss'){
    var itm = find(s, b.dataset.id), seq = ['','A','B','C','D'];
    itm.ss = seq[(seq.indexOf(itm.ss||'')+1) % seq.length];
    save(); render();
  }
  else if(a==='kind'){ newKind = b.dataset.v; render(); document.getElementById('newname').focus(); }
  else if(a==='back'){ s.back = (s.back===b.dataset.v ? '' : b.dataset.v); save(); render(); }
  else if(a==='form'){ openForm = (openForm===b.dataset.id ? '' : b.dataset.id); render(); }
  else if(a==='backup'){ backupOpen = !backupOpen; render(); }
  else if(a==='restore'){
    var bx = document.getElementById('backupbox');
    if(!bx){ return; }
    try {
      var incoming = JSON.parse(bx.value);
      if(!incoming || !incoming.sessions) throw new Error('shape');
      state = incoming; migrate(); pending = true; flush();
      backupOpen = false; pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); toast('Restored');
    } catch(err){ toast('That text is not a valid backup'); }
  }
  else if(a==='retryboot'){ boot(); }
  else if(a==='download'){
    try {
      var blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = 'paramount-log-' + todayKey() + '.json';
      document.body.appendChild(link); link.click();
      setTimeout(function(){ document.body.removeChild(link); URL.revokeObjectURL(url); }, 400);
      toast('Backup downloaded');
    } catch(e){
      backupOpen = true; render();
      toast('Download blocked — copy the text instead');
    }
  }
  else if(a==='rebuild'){
    var n = restoreSeed(false);
    pending = true; flush();
    pickDate(); tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0);
    toast(n ? n+' sessions restored' : 'Nothing was missing');
  }
  else if(a==='snap'){
    var sn = snaps[+b.dataset.i];
    if(!sn) return;
    try {
      var o = JSON.parse(sn.raw);
      if(!o || !o.sessions) throw new Error('shape');
      pushSnap(JSON.stringify(state), 'before restore');
      state = o; state.seeded = true; migrate();
      pending = true; flush();
      pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); window.scrollTo(0,0); toast('Restored');
    } catch(e){ toast('That copy could not be read'); }
  }
  else if(a==='paste'){ pasteOpen = true; render();
    var pb=document.getElementById('pastebox'); if(pb) pb.focus();
  }
  else if(a==='dopaste'){
    var box = document.getElementById('pastebox');
    var got = box ? parseLines(box.value) : [];
    if(!got.length){ toast('Nothing to read'); return; }
    got.forEach(function(it){ s.items.push(it); });
    pasteOpen = false; save(); render();
    toast(got.length+' exercises added');
  }
  else if(a==='additem'){ addItem(); }
  else if(a==='open'){ cur = b.dataset.k; tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0);
  }
  else if(a==='loadplan'){
    var p = PLANS[+b.dataset.i];
    if(!s.type) s.type = p.name;
    p.items.forEach(function(n){
      s.items.push({ id:uid(), name:n, kind:guessKind(n), weight:0, sets:[0,0,0] });
    });
    save(); tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0); toast(p.name+' loaded');
  }
});

view.addEventListener('input', function(e){
  var el = e.target, a = el.dataset.act; if(!a) return;
  var s = session(cur);
  if(a==='set'){ var it=find(s, el.dataset.id); it.sets[+el.dataset.i] = el.value===''?0:+el.value; softStats(); save(); }
  else if(a==='load'){
    var it3=find(s, el.dataset.id);
    if(!it3.loads) it3.loads = (it3.sets||[]).map(function(){ return +it3.weight||0; });
    it3.loads[+el.dataset.i] = el.value===''?0:+el.value; softStats(); save();
  }
  else if(a==='f'){ var i2=find(s, el.dataset.id); i2[el.dataset.k] = el.value===''?0:+el.value; softStats(); save(); }
  else if(a==='notes'){ s.notes = el.value; save(); }
  else if(a==='coach'){ s.coach = el.value; save(); }
});

view.addEventListener('change', function(e){
  var el = e.target, a = el.dataset.act; if(!a) return;
  if(a==='type'){ session(cur).type = el.value; save(); }
  else if(a==='eq'){ find(session(cur), el.dataset.id).eq = el.value; save(); }
  else if(a==='pickdate'){ if(el.value){ cur = el.value; render(); } }
  else if(a==='pick'){ progressPick = el.value; render(); }
});

view.addEventListener('change', function(e){
  if(!e.target || e.target.dataset.act !== 'upload') return;
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var o = JSON.parse(fr.result);
      if(!o || !o.sessions) throw new Error('shape');
      pushSnap(JSON.stringify(state), 'before file restore');
      state = o; state.seeded = true; migrate();
      pending = true; flush();
      pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); window.scrollTo(0,0); toast('Backup loaded');
    } catch(err){ toast('That file is not a valid backup'); }
  };
  fr.readAsText(file);
});

view.addEventListener('focusout', function(e){
  if(e.target && e.target.dataset && e.target.dataset.act) flush();
});

view.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.id==='newname'){ e.preventDefault(); addItem(); }
});

function find(s,id){ 
  for(var i=0;i<s.items.length;i++){ if(s.items[i].id===id) return s.items[i]; }
  return {sets:[]};
}
function addItem(){
  var el = document.getElementById('newname'); if(!el) return;
  var name = el.value.trim();
  if(!name){ el.focus(); return; }
  var kind = newKind, g = guessKind(name);
  if(g!=='lift') kind = g;
  var it = { id:uid(), name:name, kind:kind };
  if(kind==='cardio'){ it.minutes=0; it.incline=0; it.speed=0; }
  else if(kind==='hold'){ it.sets=[30,30,30]; }
  else { it.weight=0; it.sets=[10,10,10]; it.loads=[0,0,0]; }
  if(kind!=='cardio') it.eq = guessEquip(name, 0);
  session(cur).items.push(it);
  if(LIBRARY.indexOf(name)<0) LIBRARY.push(name);
  save(); render();
  var f=document.getElementById('newname'); if(f) f.focus();
}
function softStats(){
  var st = sessionStats(session(cur));
  var b = document.querySelectorAll('.stat b');
  if(b.length===3){ b[0].textContent=st.sets; b[1].textContent=st.reps; b[2].textContent=st.vol.toLocaleString(); }
  var plates = document.querySelectorAll('.plate');
  for(var i=0;i<plates.length;i++) plates[i].className = 'plate' + (i<Math.min(st.sets,30)?'':' empty');
}

/* ============ boot ============ */
view.innerHTML = '<div class="empty"><strong>Loading</strong>One moment.</div>';

function restoreSeed(replaceAll){
  try { pushSnap(JSON.stringify(state), 'before rebuild'); } catch(e){}
  var mine = state.sessions || {};
  state.sessions = {}; seed();
  var fresh = state.sessions;
  state.sessions = mine;
  var n = 0;
  Object.keys(fresh).forEach(function(k){
    if(replaceAll || !mine[k] || !(mine[k].items||[]).length){ mine[k] = fresh[k]; n++; }
    else if(!mine[k].coach && fresh[k].coach){ mine[k].coach = fresh[k].coach; }
  });
  migrate();
  return n;
}

function mergeSeed(){
  if(state.seeded) return;      // seed data is injected exactly once, ever
  var mine = state.sessions || {};
  state.sessions = {};
  seed();
  var fresh = state.sessions;
  state.sessions = mine;
  Object.keys(fresh).forEach(function(k){
    var have = mine[k];
    if(!have || !(have.items||[]).length){ mine[k] = fresh[k]; }
    else if(!have.coach && fresh[k].coach){ have.coach = fresh[k].coach; }
  });
}

function boot(){
  loadSnaps().then(function(sn){ snaps = sn; }).then(function(){
  return load().then(function(r){
    if(!r.ok){
      // Do NOT seed or save — that would overwrite whatever is really stored.
      readOK = false;
      setStatus(r.why === 'nostore' ? 'nostore' : 'read');
      if(r.why === 'nostore'){
        readOK = true;              // in-memory only; nothing to overwrite
        setStatus('nostore');
        state = { sessions:{} }; seed(); migrate(); pickDate(); render();
      } else {
        view.innerHTML = '<div class="empty"><strong>Could not read your saved log</strong>'
          + 'Nothing has been changed or overwritten. This is usually temporary.</div>'
          + '<button class="btn btn-solid btn-wide" data-act="retryboot">Try again</button>';
      }
      return;
    }
    readOK = true;
    if(r.empty){ state = { sessions:{} }; seed(); }
    else {
      pushSnap(JSON.stringify(r.data), 'on open');
      state = r.data; mergeSeed();
    }
    state.seeded = true;
    migrate();
    var anyLogged = Object.keys(state.sessions||{}).some(function(k){
      return (state.sessions[k].items||[]).length; });
    if(!anyLogged) restoreSeed(true);
    pending = true; flush();
    pickDate();
    render();
  }); });
}

function pickDate(){
  var logged = Object.keys(state.sessions).filter(function(k){
    return (state.sessions[k].items||[]).length; }).sort();
  cur = logged.length ? logged[logged.length-1] : todayKey();
}

boot();
</script>
