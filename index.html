function renderHistory(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return state.sessions[k].items && state.sessions[k].items.length;
  }).sort().reverse();

  var h = '<div class="eyebrow">Logged sessions · '+keys.length+'</div>';
  if(!keys.length){
    h += '<div class="empty"><strong>No sessions yet</strong>Anything you log shows up here, newest first.</div>';
  }
  keys.forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    var exCount = (s.items||[]).filter(function(i){ return i.kind !== 'cardio'; }).length;
    // a session logged without rep counts would otherwise read as almost no work
    var tail = (st.sets >= exCount) ? (st.sets + ' sets') : (exCount + ' ex \u00b7 ' + st.sets + ' set' + (st.sets===1?'':'s'));
    h += '<button class="row" data-act="open" data-k="'+k+'">'
      + '<span class="rdate">'+fmtShort(k)+'</span>'
      + '<span class="rtype">'+esc(sessionLabel(s))
      + (s.mode==='trainer' ? ' <span class="spat">trainer</span>' : '')
      + (s.mode==='rest' ? ' <span class="spat">rest</span>' : '')+'</span>'
      + '<span class="rsets">'+((s.back==='Achy'||s.back==='Sore')?'<span class="flag">\u25cf </span>':'')+tail+'</span></button>';
  });

  var week = 0, cutoff = shiftKey(todayKey(), -6);
  keys.forEach(function(k){ if(k >= cutoff) week += sessionStats(state.sessions[k]).sets; });
  h += '<div class="footnote">Last 7 days: <strong>'+week+'</strong> working sets across '
    + keys.filter(function(k){return k>=cutoff;}).length + ' sessions.</div>';
  view.innerHTML = h;
}

function renderProgress(){
  var names = {};
  Object.keys(state.sessions).forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.kind==='lift'||!it.kind) names[it.name] = true;
    });
  });
  var list = Object.keys(names).sort();
  if(!progressPick || list.indexOf(progressPick)<0) progressPick = list[0]||'';

  var h = '';

  var wk = weeklySummary(10);
  var peakVol = Math.max.apply(null, wk.map(function(w){ return w.vol; }).concat([1]));
  h += '<div class="eyebrow">Last 10 weeks</div><div class="wkchart">';
  wk.forEach(function(w, i){
    var hgt = Math.round(w.vol / peakVol * 108);
    var hasPeriod = Object.keys(state.sessions).some(function(k){
      return state.sessions[k].periodStart && weekKey(k) === w.k; });
    h += '<div class="wkcol" title="'+w.vol.toLocaleString()+' lb">'
      + '<div class="wkbar'+(i===wk.length-1?' now':'')+'" style="height:'+Math.max(hgt,2)+'px"></div>'
      + (hasPeriod ? '<div class="wkdot"></div>' : '')
      + '</div>';
  });
  h += '</div><div class="wklabels">';
  wk.forEach(function(w){
    var d = parseKey(w.k);
    h += '<span>'+d.getDate()+'/'+(d.getMonth()+1)+'</span>';
  });
  h += '</div>';

  var totalSessions = wk.reduce(function(a,w){ return a + w.sessions; }, 0);
  var totalVol = wk.reduce(function(a,w){ return a + w.vol; }, 0);
  var totalCardio = wk.reduce(function(a,w){ return a + w.cardio; }, 0);
  var activeWeeks = wk.filter(function(w){ return w.sessions; }).length;
  h += '<div class="footnote" style="margin-top:8px">Bar height is weekly volume in pounds lifted. '
    + '<strong>'+totalSessions+'</strong> sessions over '+activeWeeks+' active weeks &middot; '
    + '<strong>'+totalVol.toLocaleString()+' lb</strong> total &middot; '
    + '<strong>'+totalCardio+' min</strong> cardio'
    + (cycleStarts().length ? ' &middot; pink marks a week your period began.' : '.') + '</div>';

  var pc = phaseComparison();
  if(pc){
    h += '<div class="eyebrow" style="margin-top:22px">Your own numbers by cycle phase</div>'
      + '<table class="wktable"><thead><tr><th>Phase</th><th>Sessions</th><th>Avg sets</th><th>Avg volume</th></tr></thead><tbody>';
    PHASES.forEach(function(ph){
      var b = pc[ph];
      h += '<tr><td class="ph">'+esc(ph)+'</td><td>'+b.sessions+'</td><td>'
        + (b.sessions? b.avgSets : '\u2014')+'</td><td>'
        + (b.sessions? b.avgVol.toLocaleString()+' lb' : '\u2014')+'</td></tr>';
    });
    h += '</tbody></table>'
      + '<div class="footnote">Give this a few months before reading anything into it. Large reviews find '
      + 'no consistent effect of cycle phase on strength, so nothing in this app changes your prescribed '
      + 'weights by phase &mdash; but if a clear pattern shows up in <em>your</em> numbers, that is worth knowing.</div>';
  }

  h += '<div class="eyebrow" style="margin-top:22px">Exercise history</div>';
  if(!list.length){
    view.innerHTML = h + '<div class="empty"><strong>Nothing to chart yet</strong>Log a couple of sessions and progress shows up here.</div>';
    return;
  }
  h += '<select class="picker" data-act="pick">';
  list.forEach(function(n){ h += '<option'+(n===progressPick?' selected':'')+'>'+esc(n)+'</option>'; });
  h += '</select>';

  h += formPanel(progressPick);

  var pb = bestEver(progressPick, null);
  if(pb.reps){
    h += '<div class="lastline" style="margin-left:0">Best so far &middot; <b>'
      + (pb.load ? pb.load+' lb' : 'bodyweight') + ' &times; ' + pb.reps + ' reps</b></div>';
  }

  var rows = [];
  Object.keys(state.sessions).sort().forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      if(it.name!==progressPick || (it.kind && it.kind!=='lift')) return;
      var reps=0, vol=0;
      (it.sets||[]).forEach(function(r,i){ reps += (+r||0); vol += (+r||0)*loadAt(it,i); });
      rows.push({ k:k, w:topLoad(it), sets:(it.sets||[]).length, reps:reps, vol:vol,
                  best:Math.max.apply(null,(it.sets||[0]).map(Number)) });
    });
  });

  var metricVol = rows.some(function(r){ return r.w>0; });
  var maxv = Math.max.apply(null, rows.map(function(r){ return metricVol?r.vol:r.reps; }).concat([1]));
  var recent = rows.slice(-10);

  h += '<div class="eyebrow" style="margin-top:18px">'+(metricVol?'Volume per session (lb)':'Total reps per session')+'</div>';
  h += '<div class="bars">';
  recent.forEach(function(r){
    var v = metricVol?r.vol:r.reps;
    h += '<div class="bar" style="height:'+Math.max(3, Math.round(v/maxv*108))+'px" title="'+v+'"></div>';
  });
  h += '</div><div class="barlabels">';
  recent.forEach(function(r){ h += '<span>'+parseKey(r.k).getDate()+'/'+(parseKey(r.k).getMonth()+1)+'</span>'; });
  h += '</div>';

  h += '<table class="ptable"><thead><tr><th>Date</th><th>Load</th><th>Sets</th><th>Reps</th><th>Best set</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){
    h += '<tr><td>'+fmtShort(r.k)+'</td><td class="strong">'+(r.w?r.w+' lb':'BW')+'</td><td>'+r.sets+'</td><td>'+r.reps+'</td><td>'+r.best+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="footnote">Add one rep to a set, or step the stack up 5&nbsp;lb, once you finish every set at the top of your rep range with clean form.</div>';

  var tally = groupTally(14);
  var peak = Math.max.apply(null, GROUPS.map(function(g){ return tally[g]; }).concat([1]));
  h += '<div class="eyebrow" style="margin-top:24px">Balance &middot; sets per muscle group, last 14 days</div><div class="bars2">';
  GROUPS.forEach(function(g){
    var v = tally[g], pct = Math.round(v/peak*100);
    h += '<div class="grprow"><span class="grpname">'+esc(g)+'</span>'
      + '<span class="grptrack"><i class="'+(v < peak*0.34 ? 'low' : '')+'" style="width:'+Math.max(pct,2)+'%"></i></span>'
      + '<span class="grpnum">'+v+'</span></div>';
  });
  h += '</div>';
  var starved = GROUPS.filter(function(g){ return tally[g] < peak*0.34; });
  h += '<div class="footnote">'
    + (starved.length
        ? 'Running light on <strong>'+esc(starved.join(', '))+'</strong> compared with your heaviest group. '
          + 'Red bars are the ones to feed next.'
        : 'Reasonably even across the board over the last two weeks.')
    + '</div>';

  view.innerHTML = h;
}


function renderWhy(){
  var keys = Object.keys(state.sessions).filter(function(k){
    return (state.sessions[k].items||[]).length; }).sort();
  var sessions = keys.length;
  var sets = 0, reps = 0, vol = 0, cardio = 0, mus = {};
  keys.forEach(function(k){
    var s = state.sessions[k], st = sessionStats(s);
    sets += st.sets; reps += st.reps; vol += st.vol;
    (s.items||[]).forEach(function(it){ if(it.kind==='cardio') cardio += (+it.minutes||0); });
    var m = muscleTally(s).muscles;
    Object.keys(m).forEach(function(n){ mus[n] = (mus[n]||0) + m[n]; });
  });
  var span = keys.length ? Math.max(1, Math.round((parseKey(keys[keys.length-1]) - parseKey(keys[0]))/86400000)+1) : 0;
  var perWeek = span ? Math.round(sessions/span*7*10)/10 : 0;

  var prs = [];
  keys.forEach(function(k){
    (state.sessions[k].items||[]).forEach(function(it){
      var p = isPR(it, k);
      if(p) prs.push(it.name);
    });
  });

  var heaviest = [];
  var names = {};
  keys.forEach(function(k){ (state.sessions[k].items||[]).forEach(function(it){
    if(it.kind==='lift') names[it.name] = true; }); });
  Object.keys(names).forEach(function(n){
    var b = bestEver(n, null);
    if(b.load) heaviest.push({ n:n, l:b.load, r:b.reps });
  });
  heaviest.sort(function(a,b){ return b.l - a.l; });

  var h = '<div class="whyhero">'
    + '<div class="whyeyebrow">Where you are</div>'
    + '<h2>'+sessions+' sessions, '+sets+' working sets, '
    + (vol>=1000 ? Math.round(vol/1000)+',000' : vol) + ' pounds moved.</h2>'
    + '<p>Over '+span+' days, averaging '+perWeek+' sessions a week, plus '+cardio+' minutes of walking. '
    + 'That is not a small thing after years away from a gym.</p></div>';

  h += '<div class="eyebrow">What we actually built</div>'
    + '<div class="whycard"><h3>A record instead of a memory</h3>'
    + '<p>The single reason people stall is that they cannot remember what they lifted last time, so they '
    + 'lift the same thing forever. Every exercise here shows you last week\'s numbers before you start. '
    + 'That one line is what turns exercise into training.</p></div>';

  h += '<div class="whycard"><h3>Progressive overload, calculated for you</h3>'
    + '<p>Muscle adapts to a demand slightly beyond what it has met before. Slightly. The Plan tab reads what you '
    + 'actually did and asks for a little more \u2014 ten percent when you sailed through fifteen reps, nothing at all '
    + 'when you scraped through eight. That judgement is the whole job of a coach, and it is now written down '
    + 'rather than guessed.</p></div>';

  h += '<div class="whycard"><h3>A spine that is protected, not avoided</h3>'
    + '<p>Your disc history shaped every choice in here. No barbell back squats, no conventional deadlifts, '
    + 'machines and supported positions where possible, core work that resists movement rather than crunching '
    + 'through it. Not because loading is dangerous \u2014 because the wrong loading is, and the right loading is '
    + 'the best protection you can buy. The strongest thing you can do for a vulnerable back is build the hips, '
    + 'glutes and trunk around it.</p></div>';

  h += '<div class="whycard"><h3>Warning signs written down before you need them</h3>'
    + '<p>The back check takes one tap. If a flare ever comes, the fortnight before it will be readable \u2014 '
    + 'what you loaded, what jumped, how you felt. And the flare protocol in the Plan tab was written while '
    + 'nothing hurt, which is the only time anyone thinks clearly about it.</p></div>';

  h += '<div class="eyebrow">What this earns you</div>';

  h += '<div class="whycard gain"><h3>Muscle kept while fat goes</h3>'
    + '<p>In a calorie deficit the body will take weight from wherever it likes, including muscle. Lifting is the '
    + 'signal that says keep this. Two people can lose the same twenty pounds and end up in completely different '
    + 'bodies; the difference is almost entirely whether they trained while they did it.</p></div>';

  h += '<div class="whycard gain"><h3>A metabolism that does not sink</h3>'
    + '<p>Muscle is expensive tissue to keep. Lose it and your maintenance calories fall, which is why weight lost '
    + 'through diet alone tends to come back. Holding your muscle holds the floor under everything.</p></div>';

  h += '<div class="whycard gain"><h3>Bone, joints and the next forty years</h3>'
    + '<p>Loaded exercise is one of very few things that increases bone density, and for a woman in her thirties '
    + 'that matters enormously \u2014 you are building the reserve you will draw on decades from now. Strong hips and '
    + 'hamstrings also mean the everyday moments that ambush a bad back, lifting a box or twisting for a seatbelt, '
    + 'stop being a gamble.</p></div>';

  h += '<div class="whycard gain"><h3>Endurance you feel outside the gym</h3>'
    + '<p>Incline walking after the machines builds the aerobic base with almost no impact. Stairs stop being an '
    + 'event. That is the change most people notice first, and it usually arrives before the scale moves.</p></div>';

  if(heaviest.length){
    h += '<div class="eyebrow">Your strongest lifts so far</div><table class="ptable"><tbody>';
    heaviest.slice(0,6).forEach(function(x){
      h += '<tr><td>'+esc(x.n)+'</td><td class="strong">'+x.l+' lb</td><td>'+x.r+' reps</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="footnote">An 85 lb leg curl is not a beginner number. Your legs are genuinely strong \u2014 '
      + 'it is your upper body that has catching up to do, and that is where the fastest gains are sitting.</div>';
  }

  var mn = Object.keys(mus).sort(function(a,b){ return mus[b]-mus[a]; });
  if(mn.length){
    h += '<div class="eyebrow">Everything you have trained</div><div class="mtags">';
    mn.forEach(function(n){
      h += '<span class="mtag">'+esc(n)+' <b>'+Math.round(mus[n])+'</b></span>';
    });
    h += '</div><div class="footnote">Numbers are weighted sets. Thin ones are not failures, just the next '
      + 'thing to feed.</div>';
  }

  h += '<div class="whycard last"><h3>The honest part</h3>'
    + '<p>This app cannot make you lose weight. The deficit comes from the kitchen and nothing here touches it. '
    + 'What it can do is make certain that while the weight comes off you are getting stronger rather than '
    + 'smaller and weaker \u2014 and give you a record clear enough that on the days it feels like nothing is '
    + 'happening, you can open it and see that something plainly is.</p></div>';

  view.innerHTML = h;
}

function renderPlan(){

  h += '<div class="coachbox"><h3>Design my next session</h3>'
    + '<div class="sub">from your history, your time, and your back</div>';

  h += '<div class="ctrl"><div class="clbl">Focus</div><div class="seg">';
  [['auto','Decide for me'],['Pull','Pull'],['Push','Push'],['Legs \u2014 quad','Legs'],['Full body','Full']].forEach(function(o){
    h += '<button data-act="rxfocus" data-v="'+esc(o[0])+'" aria-pressed="'+(rxFocus===o[0])+'">'+esc(o[1])+'</button>';
  });
  h += '</div></div>';

  h += '<div class="ctrl"><div class="clbl">Time today</div><div class="seg">';
  [30,45,60,75].forEach(function(m){
    h += '<button data-act="rxmin" data-v="'+m+'" aria-pressed="'+(rxMin===m)+'">'+m+' min</button>';
  });
  h += '</div></div>';

  h += '<div class="ctrl"><div class="clbl">How you feel</div><div class="seg">';
  [['hard','Challenge me'],['steady','Steady'],['easy','Take it easy']].forEach(function(o){
    h += '<button data-act="rxmode" data-v="'+o[0]+'" aria-pressed="'+(rxMode===o[0])+'">'+esc(o[1])+'</button>';
  });
  h += '</div></div>';

  h += '<button class="btn btn-solid btn-wide" data-act="rxgo" style="background:var(--brass);border-color:var(--brass);margin-top:4px">Build it</button></div>';

  if(rxPlan){
    var r = rxPlan;
    h += '<div class="rx"><div class="rxhead">'+esc(r.focus)+'</div>'
      + '<div class="rxmeta">'+r.blocks.length+' exercises \u00b7 '+r.totalSets+' working sets \u00b7 about '
      + r.est+' min \u00b7 rest '+esc(r.rest)+'</div>';

    r.flags.forEach(function(f){ h += '<div class="rxflag">'+esc(f)+'</div>'; });

    h += '<div class="rxrow"><span class="rxn">\u2014</span><div class="rxbody">'
      + '<div class="rxname">Warm up</div>'
      + '<div class="rxdose">'+r.warm+' min incline walk \u00b7 2.2-2.4 mph</div>'
      + '<div class="rxwhy">Just enough to raise your temperature. Save the real walking for the end.</div></div></div>';

    r.blocks.forEach(function(b, i){
      var dose = b.sets + ' \u00d7 ' + b.reps
        + (b.load === null ? '' : (b.load ? ' @ ' + b.load + ' lb' + (b.ps ? ' per side' : '') : ' @ bodyweight'));
      var open = (rxOpen === b.name);
      h += '<button class="rxrow" data-act="rxform" data-n="'+esc(b.name)+'" aria-expanded="'+open+'">'
        + '<span class="rxn">'+pad(i+1)+'</span><span class="rxbody">'
        + '<span class="rxname" style="display:block">'+esc(b.name)+(b.ss?' <span class="spat">SS '+esc(b.ss)+'</span>':'')+'</span>'
        + '<span class="rxdose" style="display:block">'+esc(dose)+'</span>'
        + '<span class="rxwhy" style="display:block">'+esc(b.why)+'</span>'
        + (b.note ? '<span class="rxwhy care" style="display:block">'+esc(b.note)+'</span>' : '')
        + '<span class="rxtip" style="display:block">'+(open ? 'Tap to close' : 'Tap to see how it is done')+'</span>'
        + '</span></button>';
      if(open) h += '<div class="rxform">'+formPanel(b.name)+'</div>';
    });

    h += '<div class="rxrow"><span class="rxn">\u2014</span><div class="rxbody">'
      + '<div class="rxname">Finish</div>'
      + '<div class="rxdose">'+r.cardio+' min incline walk \u00b7 9-10% \u00b7 2.3-2.5 mph</div>'
      + '<div class="rxwhy">Low impact, kind to your spine, and where a real share of the weekly burn comes from.</div></div></div>';

    h += '</div>'

      + '<div class="footnote" style="margin-top:4px">Loads are predicted from what you actually lifted last time, '
      + 'rounded to real pins and plates. If one feels wrong on the day, trust your body and change it \u2014 '
      + 'the next prediction learns from whatever you log.</div>';
  }

  h += '<div class="eyebrow">Rotation \u00b7 5 days, machine-led</div>';
  PLANS.forEach(function(p, i){
    h += '<div class="plan"><h3>'+esc(p.name)+'</h3><div class="tagline">'+esc(p.tag)+'</div><ol>';
    p.items.forEach(function(n){ h += '<li>'+esc(n)+'</li>'; });
    h += '</ol><button class="btn btn-ghost btn-wide" data-act="loadplan" data-i="'+i+'">Load into '+fmtShort(cur)+'</button></div>';
  });
  h += '<div class="protocol"><h3>If your back flares</h3>'
    + '<p>Written down now so you are not deciding in the middle of it.</p>'
    + '<h4>What usually sets one off</h4><ul>'
    + '<li>A jump in load or volume that is bigger than the week before.</li>'
    + '<li>A new movement pushed hard the first time you meet it.</li>'
    + '<li>Bending and twisting under load, especially within an hour of waking &mdash; discs are most swollen first thing in the morning.</li>'
    + '<li>A bad week of sleep, stress, or long stretches of sitting. These matter more than most people expect.</li>'
    + '</ul>'
    + '<h4>The signal to back off</h4>'
    + '<p>Muscle soreness that eases as you move is fine and expected. Back stiffness that is <em>worse</em> the next morning than it was that night is the one to respect. Drop the load on hinging and squatting for a week rather than pushing through.</p>'
    + '<h4>If one starts</h4><ul>'
    + '<li>Do not go to bed. Bed rest makes flares last longer &mdash; keep walking, little and often.</li>'
    + '<li>Stop the direction that hurts, not all training. Upper body machines, seated and supported, are usually fine.</li>'
    + '<li>Short, frequent position changes beat long stretches of anything, including sitting.</li>'
    + '<li>Log it here with the back check so you can see afterwards what the week before it looked like.</li>'
    + '</ul>'
    + '<h4>See a doctor promptly if</h4>'
    + '<p>Pain travels below the knee, you get numbness, pins and needles or weakness in a leg or foot, or there is any change in bladder or bowel control. That last one is same-day urgent. This app is a training log, not medical advice.</p>'
    + '</div>';
  h += '<div class="eyebrow" style="margin-top:22px">Recover</div>';
  h += '<div class="footnote" style="margin-top:0">Every session you have sent me is written into this app. '
    + 'Rebuilding fills in any of those seven dates that are missing or empty. It will not touch a date you have already filled in.</div>'
    + '<button class="btn btn-solid btn-wide" data-act="rebuild" style="margin-bottom:14px">Rebuild my seven logged sessions</button>';
  if(!snaps.length){
    h += '<div class="footnote" style="margin-top:0">No earlier copies stored yet. From now on the app keeps the last five, '
      + 'taken each time it opens.</div>';
  } else {
    h += '<div class="footnote" style="margin-top:0">Copies taken automatically each time the app opened. '
      + 'Restoring replaces what is on screen now.</div>';
    snaps.forEach(function(sn, i){
      var n = 0, when = new Date(sn.t);
      try {
        var o = JSON.parse(sn.raw);
        n = Object.keys(o.sessions||{}).filter(function(k){ return (o.sessions[k].items||[]).length; }).length;
      } catch(e){}
      h += '<button class="row" data-act="snap" data-i="'+i+'">'
        + '<span class="rdate">'+pad2(when.getMonth()+1)+'/'+pad2(when.getDate())+' '
        + pad2(when.getHours())+':'+pad2(when.getMinutes())+'</span>'
        + '<span class="rtype">'+n+' session'+(n===1?'':'s')+'</span>'
        + '<span class="rsets">Restore</span></button>';
    });
  }

  h += '<div class="eyebrow" style="margin-top:22px">Backup</div>'
    + '<div class="footnote" style="margin-top:0">Your log lives in this app. Copy the text below somewhere safe now and then, '
    + 'and you can paste it back if anything is ever lost.</div>'
    + '<button class="btn btn-solid btn-wide" data-act="download" style="margin-bottom:6px">Download backup file</button>'
    + '<label class="btn btn-ghost btn-wide" style="display:block;text-align:center;margin-bottom:8px">Load a backup file'
    + '<input type="file" accept=".json,application/json,text/plain" data-act="upload" style="display:none"></label>'
    + (backupOpen
        ? '<textarea class="notes" id="backupbox" style="min-height:110px;font-family:\'IBM Plex Mono\',monospace;font-size:11px" '
          + 'onclick="this.select()">'+esc(JSON.stringify(state))+'</textarea>'
          + '<button class="btn btn-ghost btn-wide" data-act="restore" style="margin-top:8px">Restore from pasted text</button>'
          + '<button class="btn btn-ghost btn-wide" data-act="backup" style="margin-top:6px">Hide</button>'
        : '<button class="btn btn-ghost btn-wide" data-act="backup">Show backup text</button>');

  h += '<div class="footnote">Loading a day adds the exercises with three empty sets each, so you fill in what you '
    + 'actually complete. Cardio goes after the machines. These templates skip barbell back squats and conventional '
    + 'deadlifts in favour of leg press and hack squat, and keep core work to stability holds rather than crunches.</div>';
  view.innerHTML = h;
}

/* ============ events ============ */
document.querySelector('.tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if(!b) return;
  flush();
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t===b); });
  render();
});

view.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var a = b.dataset.act, s = session(cur);

  if(a==='day'){ flush(); cur = shiftKey(cur, +b.dataset.d); render(); }
  else if(a==='addset'){
    var ia=find(s,b.dataset.id);
    ia.sets.push(null);
    if(ia.kind!=='hold'){
      if(!ia.loads) ia.loads = [];
      ia.loads.push(ia.loads.length ? ia.loads[ia.loads.length-1] : (+ia.weight||0));
    }
    save(); render();
  }
  else if(a==='delset'){
    var id2=find(s,b.dataset.id); id2.sets.pop(); if(id2.loads) id2.loads.pop(); save(); render();
  }
  else if(a==='copylast'){
    var prior = Object.keys(state.sessions).filter(function(k){
      return k < cur && (state.sessions[k].items||[]).length; }).sort();
    if(!prior.length){ toast('No earlier session'); return; }
    var src = state.sessions[prior[prior.length-1]];
    s.type = s.type || src.type;
    (src.items||[]).forEach(function(it){
      var c = JSON.parse(JSON.stringify(it)); c.id = uid(); s.items.push(c);
    });
    save(); render(); toast('Copied '+fmtShort(prior[prior.length-1]));
  }
  else if(a==='delitem'){
    s.items = s.items.filter(function(it){ return it.id!==b.dataset.id; }); save(); render();
  }
  else if(a==='holdstart'){ startHold(b.dataset.id, +b.dataset.i); }
  else if(a==='holdstop'){ stopHold(false); }
  else if(a==='ps'){ var ip=find(s,b.dataset.id); ip.ps = !ip.ps; save(); render(); }
  else if(a==='ss'){
    var itm = find(s, b.dataset.id), seq = ['','A','B','C','D'];
    itm.ss = seq[(seq.indexOf(itm.ss||'')+1) % seq.length];
    save(); render();
  }
  else if(a==='kind'){ newKind = b.dataset.v; render(); document.getElementById('newname').focus(); }
  else if(a==='rec'){ /* handled on input */ }
  else if(a==='period'){
    s.periodStart = !s.periodStart;
    if(s.periodStart && !s.phase) s.phase = 'Menstrual';
    save(); render();
  }
  else if(a==='phase'){
    s.phase = (s.phase === b.dataset.v ? '' : b.dataset.v);
    save(); render();
  }
  else if(a==='back'){ s.back = (s.back===b.dataset.v ? '' : b.dataset.v); save(); render(); }
  else if(a==='form'){ openForm = (openForm===b.dataset.id ? '' : b.dataset.id); render(); }
  else if(a==='rxfocus'){ rxFocus = b.dataset.v; rxPlan = null; render(); }
  else if(a==='rxmin'){ rxMin = +b.dataset.v; rxPlan = null; render(); }
  else if(a==='rxmode'){ rxMode = b.dataset.v; rxPlan = null; render(); }
  else if(a==='mode'){
    s.mode = (s.mode === b.dataset.v ? '' : b.dataset.v);
    save(); render();
  }
  else if(a==='nextup'){ nextOpen = !nextOpen; render(); }
  else if(a==='addnext'){
    var nm = b.dataset.n, ld = b.dataset.l === '' ? 0 : +b.dataset.l;
    var kind = guessKind(nm);
    var it = { id:uid(), name:nm, kind:kind, eq:guessEquip(nm, ld) };
    if(kind === 'cardio'){ it.minutes = 0; it.incline = 0; it.speed = 0; }
    else if(kind === 'hold'){ it.sets = [0,0,0]; }
    else { it.sets = [0,0,0]; it.loads = [ld,ld,ld]; }
    s.items.push(it);
    nextOpen = false; save(); render(); toast(nm + ' added');
  }
  else if(a==='notetoggle'){ openNote = (openNote===b.dataset.id ? '' : b.dataset.id); render();
    var nf = document.querySelector('.exnote'); if(nf) nf.focus();
  }
  else if(a==='finish'){
    reviewFor = (reviewFor === cur ? '' : cur);
    render();
    if(reviewFor){
      var rv = document.querySelector('.review');
      if(rv && rv.scrollIntoView) rv.scrollIntoView({block:'start'});
    }
  }
  else if(a==='rvsave'){
    var k = b.dataset.k, sess = session(k);
    var txt = reviewText(k);
    sess.coach = (sess.coach ? sess.coach + '\n\n' : '') + txt;
    save(); render(); toast('Saved to coach notes');
  }
  else if(a==='rxform'){ rxOpen = (rxOpen === b.dataset.n ? '' : b.dataset.n); render(); }
  else if(a==='rxgo'){
    rxPlan = designSession({ focus:rxFocus, minutes:rxMin, mode:rxMode });
    rxOpen = '';
    render();
  }
  else if(a==='rxload'){
    var r = rxPlan; if(!r) return;
    if(!s.type) s.type = r.focus;
    s.items.push({ id:uid(), name:'Incline walk', kind:'cardio', minutes:r.warm, incline:9, speed:2.3 });
    r.blocks.forEach(function(bl){
      var kind = guessKind(bl.name);
      var it = { id:uid(), name:bl.name, kind:kind, eq:bl.eq, ss:bl.ss||'', ps:!!bl.ps,
                 tgt: bl.sets+' × '+bl.reps+(bl.load ? ' @ '+bl.load+' lb' : '') };
      if(kind === 'cardio'){ it.minutes = 0; it.incline = 0; it.speed = 0; }
      else {
        it.sets = []; it.loads = [];
        for(var q=0;q<bl.sets;q++){ it.sets.push(0); it.loads.push(bl.load || 0); }
      }
      s.items.push(it);
    });
    s.items.push({ id:uid(), name:'Incline walk', kind:'cardio', minutes:r.cardio, incline:9, speed:2.4 });
    save(); tab = 'log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0); toast('Session loaded');
  }
  else if(a==='backup'){ backupOpen = !backupOpen; render(); }
  else if(a==='restore'){
    var bx = document.getElementById('backupbox');
    if(!bx){ return; }
    try {
      var incoming = JSON.parse(bx.value);
      if(!incoming || !incoming.sessions) throw new Error('shape');
      state = incoming; migrate(); pending = true; flush();
      backupOpen = false; pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); toast('Restored');
    } catch(err){ toast('That text is not a valid backup'); }
  }
  else if(a==='retryboot'){ boot(); }
  else if(a==='download'){
    try {
      var blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = 'paramount-log-' + todayKey() + '.json';
      document.body.appendChild(link); link.click();
      setTimeout(function(){ document.body.removeChild(link); URL.revokeObjectURL(url); }, 400);
      toast('Backup downloaded');
    } catch(e){
      backupOpen = true; render();
      toast('Download blocked — copy the text instead');
    }
  }
  else if(a==='rebuild'){
    var n = restoreSeed(false);
    pending = true; flush();
    pickDate(); tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0);
    toast(n ? n+' sessions restored' : 'Nothing was missing');
  }
  else if(a==='snap'){
    var sn = snaps[+b.dataset.i];
    if(!sn) return;
    try {
      var o = JSON.parse(sn.raw);
      if(!o || !o.sessions) throw new Error('shape');
      pushSnap(JSON.stringify(state), 'before restore');
      state = o; state.seeded = true; migrate();
      pending = true; flush();
      pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); window.scrollTo(0,0); toast('Restored');
    } catch(e){ toast('That copy could not be read'); }
  }
  else if(a==='paste'){ pasteOpen = true; render();
    var pb=document.getElementById('pastebox'); if(pb) pb.focus();
  }
  else if(a==='dopaste'){
    var box = document.getElementById('pastebox');
    var got = box ? parseLines(box.value) : [];
    if(!got.length){ toast('Nothing to read'); return; }
    got.forEach(function(it){ s.items.push(it); });
    pasteOpen = false; save(); render();
    toast(got.length+' exercises added');
  }
  else if(a==='additem'){ addItem(); }
  else if(a==='pickex'){
    var f = document.getElementById('newname');
    if(f) f.value = b.dataset.n;
    addItem();
  }
  else if(a==='open'){ cur = b.dataset.k; tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0);
  }
  else if(a==='loadplan'){
    var p = PLANS[+b.dataset.i];
    if(!s.type) s.type = p.name;
    p.items.forEach(function(n){
      s.items.push({ id:uid(), name:n, kind:guessKind(n), eq:guessEquip(n,0),
                     weight:0, sets:[null,null,null], loads:[0,0,0] });
    });
    save(); tab='log';
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
    render(); window.scrollTo(0,0); toast(p.name+' loaded');
  }
});

view.addEventListener('input', function(e){
  var el = e.target, a = el.dataset.act;
  if(el.id === 'newname'){ renderSuggestions(el.value); return; }
  if(!a) return;
  var s = session(cur);
  if(a==='set'){ var it=find(s, el.dataset.id); it.sets[+el.dataset.i] = el.value===''?null:+el.value; softStats(); save(); }
  else if(a==='load'){
    var it3=find(s, el.dataset.id);
    if(!it3.loads) it3.loads = (it3.sets||[]).map(function(){ return +it3.weight||0; });
    it3.loads[+el.dataset.i] = el.value===''?0:+el.value; softStats(); save();
  }
  else if(a==='f'){ var i2=find(s, el.dataset.id); i2[el.dataset.k] = el.value===''?0:+el.value; softStats(); save(); }
  else if(a==='notes'){ s.notes = el.value; save(); }
  else if(el.id === 'newname'){ renderSuggestions(el.value); }
  else if(a==='coach'){ s.coach = el.value; save(); }
  else if(a==='rec'){
    if(el.dataset.k === 'sleep'){
      s.sleep = parseSleep(el.value);
    } else {
      s[el.dataset.k] = el.value === '' ? '' : +el.value;
    }
    save();
    var box = document.querySelector('.recov .verdict'), v = recoveryVerdict(s);
    if(box && v){ box.textContent = v.text; box.className = 'verdict' + (v.warn ? ' warn' : ''); }
  }
  else if(a==='exnote'){ find(s, el.dataset.id).note = el.value; save(); }
});

view.addEventListener('change', function(e){
  var el = e.target, a = el.dataset.act; if(!a) return;
  if(a==='type'){
    var ses = session(cur);
    ses.type = el.value;
    ses.typeManual = !!el.value;      // blank returns it to automatic
    save(); render();
  }
  else if(a==='eq'){ find(session(cur), el.dataset.id).eq = el.value; save(); }
  else if(a==='pickdate'){ if(el.value){ cur = el.value; render(); } }
  else if(a==='pick'){ progressPick = el.value; render(); }
});

view.addEventListener('change', function(e){
  if(!e.target || e.target.dataset.act !== 'upload') return;
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var o = JSON.parse(fr.result);
      if(!o || !o.sessions) throw new Error('shape');
      pushSnap(JSON.stringify(state), 'before file restore');
      state = o; state.seeded = true; migrate();
      pending = true; flush();
      pickDate(); tab='log';
      document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab==='log'); });
      render(); window.scrollTo(0,0); toast('Backup loaded');
    } catch(err){ toast('That file is not a valid backup'); }
  };
  fr.readAsText(file);
});

view.addEventListener('focusout', function(e){
  var t = e.target;
  if(!t || !t.dataset || !t.dataset.act) return;
  if(t.dataset.act === 'rec' && t.dataset.k === 'sleep'){
    t.value = fmtSleep(session(cur).sleep);
  }
  flush();
  if(t.dataset.act === 'set' && cur === todayKey() && +t.value > 0 && !rest){
    startRest(REST_DEFAULT);
  }
});

view.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.id==='newname'){ e.preventDefault(); addItem(); }
});

function find(s,id){ 
  for(var i=0;i<s.items.length;i++){ if(s.items[i].id===id) return s.items[i]; }
  return {sets:[]};
}
function addItem(){
  var el = document.getElementById('newname'); if(!el) return;
  var name = el.value.trim();
  if(!name){ el.focus(); return; }
  var kind = newKind, g = guessKind(name);
  if(g!=='lift') kind = g;
  var it = { id:uid(), name:name, kind:kind };
  if(kind==='cardio'){ it.minutes=0; it.incline=0; it.speed=0; }
  else if(kind==='hold'){ it.sets=[null,null,null]; }
  else { it.weight=0; it.sets=[null,null,null]; it.loads=[0,0,0]; }
  if(kind!=='cardio') it.eq = guessEquip(name, 0);
  session(cur).items.push(it);
  if(LIBRARY.indexOf(name)<0) LIBRARY.push(name);
  save(); render();
  var box = document.getElementById('sugg'); if(box) box.innerHTML = '';
  var f = document.getElementById('newname'); if(f){ f.value = ''; f.focus(); }
}
function refreshBadges(){
  var s = session(cur);
  (s.items||[]).forEach(function(it){
    var slot = document.getElementById('pr-'+it.id);
    if(!slot) return;
    var pr = isPR(it, cur);
    var want = pr ? '<span class="prbadge">PR &middot; '+esc(pr)+'</span>' : '';
    if(slot.innerHTML !== want) slot.innerHTML = want;
  });
}

function softStats(){
  refreshBadges();
  var st = sessionStats(session(cur));
  var b = document.querySelectorAll('.sh-stats b');
  if(b.length===3){
    b[0].textContent = st.sets;
    b[1].textContent = st.reps;
    b[2].textContent = st.vol ? st.vol.toLocaleString() : '\u2014';
  }
  var plates = document.querySelectorAll('.plate');
  var total = Math.min(st.sets, plates.length);
  for(var i=0;i<plates.length;i++) plates[i].className = 'plate' + (i<total ? '' : ' empty');
}


/* ============ boot ============ */
view.innerHTML = '<div class="empty"><strong>Loading</strong>One moment.</div>';

function restoreSeed(replaceAll){
  try { pushSnap(JSON.stringify(state), 'before rebuild'); } catch(e){}
  var mine = state.sessions || {};
  state.sessions = {}; seed();
  var fresh = state.sessions;
  state.sessions = mine;
  var n = 0;
  Object.keys(fresh).forEach(function(k){
    if(replaceAll || !mine[k] || !(mine[k].items||[]).length){ mine[k] = fresh[k]; n++; }
    else if(!mine[k].coach && fresh[k].coach){ mine[k].coach = fresh[k].coach; }
  });
  migrate();
  return n;
}

function mergeSeed(){
  if(state.seeded) return;      // seed data is injected exactly once, ever
  var mine = state.sessions || {};
  state.sessions = {};
  seed();
  var fresh = state.sessions;
  state.sessions = mine;
  Object.keys(fresh).forEach(function(k){
    var have = mine[k];
    if(!have || !(have.items||[]).length){ mine[k] = fresh[k]; }
    else if(!have.coach && fresh[k].coach){ have.coach = fresh[k].coach; }
  });
}

function boot(){
  loadSnaps().then(function(sn){ snaps = sn; }).then(function(){
  return load().then(function(r){
    if(!r.ok){
      // Do NOT seed or save — that would overwrite whatever is really stored.
      readOK = false;
      setStatus(r.why === 'nostore' ? 'nostore' : 'read');
      if(r.why === 'nostore'){
        readOK = true;              // in-memory only; nothing to overwrite
        setStatus('nostore');
        state = { sessions:{} }; seed(); migrate(); pickDate(); render();
      } else {
        view.innerHTML = '<div class="empty"><strong>Could not read your saved log</strong>'
          + 'Nothing has been changed or overwritten. This is usually temporary.</div>'
          + '<button class="btn btn-solid btn-wide" data-act="retryboot">Try again</button>';
      }
      return;
    }
    readOK = true;
    if(r.empty){ state = { sessions:{} }; seed(); }
    else {
      pushSnap(JSON.stringify(r.data), 'on open');
      state = r.data; mergeSeed();
    }
    state.seeded = true;
    migrate();
    var anyLogged = Object.keys(state.sessions||{}).some(function(k){
      return (state.sessions[k].items||[]).length; });
    if(!anyLogged) restoreSeed(true);
    pending = true; flush();
    pickDate();
    render();
  }); });
}

function pickDate(){
  var logged = Object.keys(state.sessions).filter(function(k){
    return (state.sessions[k].items||[]).length; }).sort();
  cur = logged.length ? logged[logged.length-1] : todayKey();
}

boot();
</script>
